function FinanzasApp() {
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [resetMode, setResetMode] = useState(false);
  const [mainTab, setMainTab] = useState("inicio"); // inicio | analisis | perfil
  const [panel, setPanel] = useState(null); // key de PLAN_PANELS, "transacciones", o null
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [dolarRate, setDolarRate] = useState(null);
  const [waPhone, setWaPhone] = useState(null); // null=sin chequear, false=no vinculado, string=teléfono
  const [waModal, setWaModal] = useState(false);
  const [waCode, setWaCode] = useState("");
  const [waLoading, setWaLoading] = useState(false);
  const [waError, setWaError] = useState("");
  const { closing: waClosing, requestClose: closeWa } = useClosable(() => setWaModal(false));

  const defaultData = makeDefaultData();

  // Check existing session on mount
  useEffect(() => {
    const hash = window.location.hash;
    if (hash.includes("type=recovery")) {
      setResetMode(true);
      setAuthLoading(false);
      return;
    }

    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      setUser(session?.user || null);
      setAuthLoading(false);
    });
    const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        setResetMode(true);
        setUser(session?.user || null);
      } else {
        setUser(session?.user || null);
        setResetMode(false);
      }
    });
    return () => subscription.unsubscribe();
  }, []);

  // Cotización blue (para ahorros/deudas/préstamos en USD). Best-effort: si el
  // backend no responde o bloquea el origen por CORS, la app sigue funcionando
  // sin conversión USD.
  useEffect(() => {
    fetch(`${BACKEND_URL}/api/dolar`)
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d && d.blue) setDolarRate(d.blue); })
      .catch(() => {});
  }, []);

  // Estado de vinculación con WhatsApp: se lee directo de whatsapp_users (RLS
  // scopeado a auth.uid()), igual que hace la app móvil.
  useEffect(() => {
    if (!user) return;
    supabaseClient.from("whatsapp_users").select("phone, linked_at").eq("user_id", user.id)
      .order("linked_at", { ascending: false })
      .then(({ data: rows }) => setWaPhone(rows?.[0]?.phone || false))
      .catch(() => setWaPhone(false));
  }, [user]);

  const generateWaCode = async () => {
    setWaError(""); setWaLoading(true);
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const resp = await fetch(`${BACKEND_URL}/api/generate-link-code`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${session.access_token}`, "Content-Type": "application/json" },
        body: JSON.stringify({}),
      });
      const body = await resp.json();
      if (resp.ok && body.code) {
        setWaCode(body.code);
        window.open(`https://wa.me/5491125728211?text=${encodeURIComponent("ORBE:" + body.code)}`, "_blank");
      } else {
        setWaError(body.error || "No se pudo generar el código. Probá de nuevo.");
      }
    } catch {
      setWaError("Error de conexión con el backend de Orbe. Probá de nuevo.");
    }
    setWaLoading(false);
  };

  const refreshWaLinked = async () => {
    setWaLoading(true);
    try {
      const { data: rows } = await supabaseClient.from("whatsapp_users").select("phone, linked_at").eq("user_id", user.id).order("linked_at", { ascending: false });
      const phone = rows?.[0]?.phone || null;
      if (phone) { setWaPhone(phone); setWaError(""); }
      else setWaError("Todavía no recibí tu mensaje. Asegurate de enviarlo desde tu WhatsApp.");
    } catch {
      setWaError("No pude verificar. Probá de nuevo.");
    }
    setWaLoading(false);
  };

  useEffect(() => {
    if (!user) return;
    async function load() {
      try {
        const d = await loadData(user.id);
        let next = d || defaultData;
        // Igual que la app: si el mes/año guardado quedó en el pasado, lo
        // adelantamos al actual en vez de mostrar un mes viejo por defecto.
        if (next.selectedYear < currentYear || (next.selectedYear === currentYear && next.selectedMonth < currentMonth)) {
          next = { ...next, selectedMonth: currentMonth, selectedYear: currentYear };
        }
        setData(next);
      } catch {
        setData(defaultData);
      }
      setLoading(false);
    }
    load();
  }, [user]);

  // El estado local se actualiza SIEMPRE al instante (optimista). El guardado
  // en Supabase se debouncea ~700ms: editar un límite de presupuesto o el
  // nombre de una categoría disparaba un upsert del jsonb entero por cada
  // tecla. Si la pestaña se oculta o se cierra, se hace flush inmediato para
  // no perder el último cambio. Si el guardado falla, avisamos (antes el
  // catch estaba vacío y el error se tragaba en silencio).
  const pendingSave = useRef(null);   // { uid, data } todavía sin persistir
  const saveDebounce = useRef(null);
  const flushSave = useCallback(async () => {
    if (!pendingSave.current) return;
    const { uid, data: payload } = pendingSave.current;
    pendingSave.current = null;
    clearTimeout(saveDebounce.current);
    try { await saveData(uid, payload); } catch {
      alert("No se pudo guardar el cambio. Revisá tu conexión e intentá de nuevo.");
    }
  }, []);
  const save = useCallback((newData) => {
    setData(newData);
    if (!user) return;
    pendingSave.current = { uid: user.id, data: newData };
    clearTimeout(saveDebounce.current);
    saveDebounce.current = setTimeout(flushSave, 700);
  }, [user, flushSave]);

  useEffect(() => {
    const onHide = () => { if (document.visibilityState === "hidden") flushSave(); };
    document.addEventListener("visibilitychange", onHide);
    window.addEventListener("pagehide", flushSave);
    return () => {
      document.removeEventListener("visibilitychange", onHide);
      window.removeEventListener("pagehide", flushSave);
      flushSave();
    };
  }, [flushSave]);

  // Snackbar con "Deshacer" para acciones rápidas y frecuentes (borrar un
  // movimiento). Se auto-oculta a los 5s.
  const [snack, setSnack] = useState(null); // { msg, onUndo }
  const snackTimer = useRef(null);
  const showSnack = useCallback((msg, onUndo) => {
    clearTimeout(snackTimer.current);
    setSnack({ msg, onUndo });
    snackTimer.current = setTimeout(() => setSnack(null), 5000);
  }, []);

  // A11y del modal de Conectar WhatsApp (es JSX inline, no un componente, así
  // que no puede usar useModalA11y): Escape para cerrar, bloqueo de scroll de
  // fondo, foco adentro al abrir y de vuelta al opener al cerrar.
  const waCardRef = useRef(null);
  useEffect(() => {
    if (!waModal) return;
    const prevFocus = document.activeElement;
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const onKey = (e) => { if (e.key === "Escape") { e.preventDefault(); closeWa(); } };
    document.addEventListener("keydown", onKey, true);
    const t = setTimeout(() => waCardRef.current && waCardRef.current.focus(), 20);
    return () => {
      clearTimeout(t);
      document.removeEventListener("keydown", onKey, true);
      document.body.style.overflow = prevOverflow;
      if (prevFocus && prevFocus.focus) prevFocus.focus();
    };
  }, [waModal]);

  const logout = async () => {
    await supabaseClient.auth.signOut();
    setUser(null);
    setData(null);
    setLoading(true);
  };

  if (authLoading) return (
    <div style={{ minHeight: "100vh", background: COLORS.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ color: COLORS.textMuted, fontFamily: "'Nunito', sans-serif", fontSize: 18 }}>Cargando...</div>
    </div>
  );

  if (resetMode) return <ResetPasswordScreen onDone={() => { setResetMode(false); setUser(null); }} />;

  if (!user) return <LoginScreen onLogin={setUser} />;

  if (loading || !data) return (
    <div style={{ minHeight: "100vh", background: COLORS.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ color: COLORS.textMuted, fontFamily: "'Nunito', sans-serif", fontSize: 18 }}>Cargando tus finanzas...</div>
    </div>
  );

  // Primera vez en esta cuenta: mostrar el onboarding. Se saltea si ya lo hizo
  // (data.onboardingDone, que también marca el bot de WhatsApp) o si la cuenta ya
  // tiene actividad — así un usuario existente no se topa con el onboarding de golpe.
  const yaActiva = data.transactions.length > 0 || (data.recurringIncomes || []).length > 0
    || data.savings.length > 0 || data.debts.length > 0;
  if (!data.onboardingDone && !yaActiva) return (
    <FinancialOnboardingScreen onDone={() => save({ ...data, onboardingDone: true })} />
  );

  const displayName = user?.user_metadata?.full_name || [user?.user_metadata?.nombre, user?.user_metadata?.apellido].filter(Boolean).join(" ") || (user?.email || "").split("@")[0];

  // (No se usa useMemo acá: estos derivados van DESPUÉS de varios early-return
  // de FinanzasApp — authLoading / !user / loading / onboarding — así que un
  // hook en este punto violaría el orden de hooks. Son filter/reduce sobre un
  // array chico, cuesta ~0. El costo real que marcaba el critique era el
  // upsert del jsonb por tecla, resuelto con el debounce de save().)
  const monthTxs = data.transactions.filter(t => {
    const p = parseDateParts(t.date);
    return p.month === data.selectedMonth && p.year === data.selectedYear;
  });
  const totalIncome = monthTxs.filter(isIncomeType).reduce((s, t) => s + t.amount, 0);
  const totalExpense = monthTxs.filter(isExpenseType).reduce((s, t) => s + t.amount, 0);

  const expByCat = {};
  monthTxs.filter(t => t.type === "gasto").forEach(t => {
    expByCat[t.category] = (expByCat[t.category] || 0) + t.amount;
  });

  const totalDebt = data.debts.reduce((s, d) => s + (d.currency === "usd" ? (d.remainingUSD || 0) * (dolarRate || d.arsRate || 0) : d.remaining), 0);
  const totalSavings = data.savings.reduce((s, g) => s + (g.currency === "usd" ? (g.current || 0) * (dolarRate || g.arsRate || 0) : (g.current || 0)), 0);

  const openWa = () => { setWaError(""); setWaCode(""); setWaModal(true); };

  return (
    <div className="app-shell" style={{ minHeight: "100vh", background: COLORS.bg, fontFamily: "'Nunito', 'DM Sans', 'Helvetica Neue', sans-serif", color: COLORS.text }}>
      {/* El <link> de fuentes ya está en <head> (línea 9); tenerlo también acá,
          inyectado en el árbol de React, duplicaba la request bloqueante. */}

      <DesktopSidebar mainTab={mainTab} onSelectTab={setMainTab} panel={panel} onOpenPanel={setPanel} waPhone={waPhone} onConnectWa={openWa} />

      <div className="app-main-col">
        {/* ── TOP HEADER (solo marca + mes/año, como el header fijo verde de la app) ── */}
        <div className="topbar" style={{ background: COLORS.accent, padding: "0 20px", boxShadow: "0 1px 8px #00000020", display: "flex", alignItems: "center", justifyContent: "space-between", height: 56, position: "sticky", top: 0, zIndex: 50, flexShrink: 0 }}>
          <div className="topbar-brand" style={{ display: "flex", alignItems: "center" }}>
            <img src="assets/orbe-logo-wordmark.png" alt="Orbe" style={{ width: 84, height: "auto", display: "block" }} />
          </div>
          <DatePillPicker selectedMonth={data.selectedMonth} selectedYear={data.selectedYear} onChangeMonth={m => save({ ...data, selectedMonth: m })} onChangeYear={y => save({ ...data, selectedYear: y })} />
        </div>

        {/* ── CONTENIDO: una sola columna centrada en mobile, dashboard ancho desde 1024px ── */}
        <div className="content-area">
          {/* key={mainTab} fuerza a React a remontar este wrapper al cambiar de
              tab, lo que retrigger la animación .tab-fade en cada cambio en vez
              de reciclar el nodo (que no dispararía la animación de nuevo). */}
          <div key={mainTab} className="tab-fade">
            {mainTab === "inicio" && <InicioTab data={data} save={save} displayName={displayName} monthTxs={monthTxs} totalIncome={totalIncome} totalExpense={totalExpense} totalDebt={totalDebt} totalSavings={totalSavings} onOpenPanel={setPanel} showSnack={showSnack} />}
            {mainTab === "analisis" && <div className="narrow-col"><AnalisisTab data={data} /></div>}
            {mainTab === "perfil" && <div className="narrow-col"><PerfilTab user={user} displayName={displayName} waPhone={waPhone} onConnectWa={openWa} onLogout={logout} /></div>}
          </div>
        </div>

        {/* ── BOTTOM NAV estilo app: Inicio / Análisis / WhatsApp / Perfil (oculto desde 1024px, reemplazado por el sidebar). El "+" NO es un 5º
            ítem de la fila -- calcado de la app real, es un FAB circular aparte que flota superpuesto arriba a la derecha de la barra. ── */}
        <div className="bottom-nav" style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "rgba(242,247,245,0.97)", backdropFilter: "blur(20px)", borderTop: `1px solid ${COLORS.border}`, boxShadow: "0 -2px 12px #00000010", padding: "8px 84px 8px 4px", paddingBottom: "calc(8px + env(safe-area-inset-bottom))", display: "flex", justifyContent: "space-around", alignItems: "center", zIndex: 60 }}>
          {[["inicio", "Inicio", "🏠"], ["analisis", "Análisis", "📊"]].map(([key, label, icon]) => (
            <button key={key} onClick={() => setMainTab(key)} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "4px 10px" }}>
              <div style={{ fontSize: 20, filter: mainTab === key ? "none" : "grayscale(1) opacity(0.4)", transform: mainTab === key ? "scale(1.1)" : "scale(1)", transition: "all var(--dur-base) var(--ease-standard)" }}>{icon}</div>
              <div style={{ fontSize: 9, color: mainTab === key ? COLORS.accent : COLORS.textDim, fontWeight: mainTab === key ? 700 : 400 }}>{label}</div>
            </button>
          ))}
          <button onClick={openWa} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "4px 10px" }}>
            <div style={{ display: "flex", filter: waPhone ? "none" : "grayscale(1) opacity(0.4)" }}><WhatsAppIcon size={20} /></div>
            <div style={{ fontSize: 9, color: waPhone ? COLORS.green : COLORS.textDim, fontWeight: 600 }}>WhatsApp</div>
          </button>
          <button onClick={() => setMainTab("perfil")} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "4px 10px" }}>
            <div style={{ fontSize: 20, filter: mainTab === "perfil" ? "none" : "grayscale(1) opacity(0.4)", transform: mainTab === "perfil" ? "scale(1.1)" : "scale(1)", transition: "all var(--dur-base) var(--ease-standard)" }}>👤</div>
            <div style={{ fontSize: 9, color: mainTab === "perfil" ? COLORS.accent : COLORS.textDim, fontWeight: mainTab === "perfil" ? 700 : 400 }}>Perfil</div>
          </button>
        </div>
        <button className="mobile-fab" onClick={() => setPanel("transacciones")} style={{ position: "fixed", right: 20, bottom: "calc(28px + env(safe-area-inset-bottom))", width: 56, height: 56, borderRadius: "50%", background: COLORS.accent, border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: `0 6px 16px ${COLORS.accent}60`, zIndex: 70 }}>
          <span style={{ color: "#fff", fontSize: 26, fontWeight: 700, lineHeight: 1 }}>+</span>
        </button>
      </div>

      {/* ── PANELES: pantalla completa en mobile, card centrado en escritorio (Ahorros, Deudas, Presupuesto, etc.) ── */}
      {panel && panel !== "transacciones" && (
        <PanelModal title={PANEL_LABELS[panel]} onClose={() => setPanel(null)}>
          <ErrorBoundary key={panel} fallback={() => (
            <div style={{ padding: "28px 8px", textAlign: "center" }}>
              <div style={{ fontWeight: 700, fontSize: 16, color: COLORS.accent }}>No se pudo abrir esta sección</div>
              <div style={{ color: COLORS.textMuted, fontSize: 13, margin: "8px 0 18px", maxWidth: 300, marginLeft: "auto", marginRight: "auto" }}>Puede haber un dato con un formato que la web todavía no reconoce. El resto de la app sigue funcionando.</div>
              <button onClick={() => setPanel(null)} style={{ background: COLORS.accent, color: "#E8C97A", border: "1px solid #C9A84C", borderRadius: 12, padding: "10px 20px", fontWeight: 800, fontFamily: "inherit", fontSize: 13, cursor: "pointer" }}>Volver al inicio</button>
            </div>
          )}>
            {panel === "ahorros" && <Ahorros data={data} save={save} dolarRate={dolarRate} />}
            {panel === "deudas" && <Deudas data={data} save={save} dolarRate={dolarRate} />}
            {panel === "prestamos" && <Prestamos data={data} save={save} dolarRate={dolarRate} />}
            {panel === "turnos" && <Turnos data={data} save={save} />}
            {panel === "calendario" && <Calendario data={data} save={save} />}
            {panel === "proyeccion" && <Proyeccion data={data} save={save} />}
            {panel === "suscripciones" && <Suscripciones data={data} save={save} />}
            {panel === "gastosfijos" && <GastosFijos data={data} save={save} />}
            {panel === "presupuesto" && <Presupuesto data={data} save={save} expByCat={expByCat} />}
          </ErrorBoundary>
        </PanelModal>
      )}

      {/* ── "+" / "Nueva transacción": bottom sheet dedicado (calcado de "Nuevo
          movimiento" en la app real), no el panel de lista completa -- la
          lista completa del mes ya vive embebida en Inicio (con buscador y
          filtros), así que este atajo va directo al alta. ── */}
      {panel === "transacciones" && (
        <NuevaTransaccionSheet data={data} save={save} onClose={() => setPanel(null)} />
      )}

      {/* ── MODAL: Conectar WhatsApp ── */}
      {waModal && (
        <div onClick={closeWa} className={`overlay-anim ${waClosing ? "is-closing" : ""}`} style={{ position: "fixed", inset: 0, background: "#00000070", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
          <div ref={waCardRef} tabIndex={-1} role="dialog" aria-modal="true" aria-label="Conectar WhatsApp" onClick={e => e.stopPropagation()} className={`modal-anim ${waClosing ? "is-closing" : ""}`} style={{ background: "#fff", borderRadius: 22, padding: 28, maxWidth: 420, width: "100%", boxShadow: "0 20px 60px #00000030" }}>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 10 }}><WhatsAppIcon size={32} /></div>
            <div style={{ fontWeight: 700, fontSize: 18, textAlign: "center", marginBottom: 6 }}>Conectar WhatsApp</div>
            {waPhone ? (
              <>
                <div style={{ fontSize: 13, color: COLORS.textMuted, textAlign: "center", marginBottom: 20 }}>
                  Tu número <strong style={{ color: COLORS.text }}>{waPhone}</strong> ya está vinculado al bot de Orbe.
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  <Button onClick={() => window.open(`https://wa.me/5491125728211`, "_blank")} style={{ width: "100%", background: "#25D366", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}><WhatsAppIcon size={16} color="#fff" /> Hablar con Orbe</Button>
                  <Button onClick={() => { setWaPhone(false); setWaCode(""); setWaError(""); }} variant="ghost" style={{ width: "100%" }}>Cambiar número</Button>
                  <Button onClick={closeWa} variant="ghost" style={{ width: "100%" }}>Cerrar</Button>
                </div>
              </>
            ) : (
              <>
                <div style={{ fontSize: 13, color: COLORS.textMuted, textAlign: "center", marginBottom: 20 }}>
                  Generá un código, se va a abrir WhatsApp con un mensaje listo para enviar al bot. Apenas lo mandes desde tu teléfono, quedan vinculados.
                </div>
                {waCode && (
                  <div style={{ background: COLORS.accentDim, borderRadius: 10, padding: "10px 14px", fontSize: 13, color: COLORS.accent, textAlign: "center", marginBottom: 14, fontWeight: 600 }} className="form-pop">
                    Código: ORBE:{waCode} — se abrió WhatsApp en otra pestaña.
                  </div>
                )}
                {waError && <div style={{ background: COLORS.redDim, borderRadius: 8, padding: "10px 14px", fontSize: 13, color: COLORS.red, marginBottom: 14 }} className="form-pop">{waError}</div>}
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {!waCode ? (
                    <Button onClick={generateWaCode} disabled={waLoading} style={{ width: "100%" }}>{waLoading ? "Generando..." : "Generar código y abrir WhatsApp"}</Button>
                  ) : (
                    <>
                      <Button onClick={refreshWaLinked} disabled={waLoading} style={{ width: "100%" }}>{waLoading ? "Verificando..." : "Ya lo envié, verificar"}</Button>
                      <Button onClick={generateWaCode} variant="ghost" disabled={waLoading} style={{ width: "100%" }}>Generar otro código</Button>
                    </>
                  )}
                  <Button onClick={closeWa} variant="ghost" style={{ width: "100%" }}>Cerrar</Button>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {/* ── Snackbar con "Deshacer" ── */}
      {snack && (
        <div role="status" aria-live="polite" style={{ position: "fixed", left: "50%", transform: "translateX(-50%)", bottom: "calc(78px + env(safe-area-inset-bottom))", zIndex: 300, display: "flex", alignItems: "center", gap: 14, background: "#0D1F1C", color: "#fff", padding: "12px 16px", borderRadius: 12, boxShadow: "0 12px 34px #00000047", fontSize: 13.5, maxWidth: "calc(100vw - 32px)" }}>
          <span>{snack.msg}</span>
          {snack.onUndo && (
            <button onClick={() => { snack.onUndo(); clearTimeout(snackTimer.current); setSnack(null); }} style={{ background: "none", border: "none", color: "#E8C97A", fontWeight: 800, fontFamily: "inherit", fontSize: 13.5, cursor: "pointer", padding: "2px 4px", flexShrink: 0 }}>Deshacer</button>
          )}
        </div>
      )}
    </div>
  );
}

// ---- INICIO (dashboard estilo app) ----
// "sueldo" no se ofrece como opción nueva: para el usuario es lo mismo que
// "ingreso" (ambos se tratan como ingreso, ver isIncomeType), pero el bot/app
// todavía puede crear transacciones con ese tipo — isIncomeType las sigue
// reconociendo igual aunque acá no se puedan elegir ni crear nuevas.
const TX_TYPES = ["gasto", "ingreso", "ahorro_meta"];

function InicioTab({ data, save, displayName, monthTxs, totalIncome, totalExpense, totalDebt, totalSavings, onOpenPanel, showSnack }) {
  const [hideBalance, setHideBalance] = useState(false);
  const [txFilter, setTxFilter] = useState("mes");
  const [search, setSearch] = useState("");
  const [editingTxId, setEditingTxId] = useState(null);
  const [txPage, setTxPage] = useState(0);

  const balance = totalIncome - totalExpense;
  const greeting = (() => {
    const h = new Date().getHours();
    if (h < 12) return "Buen día";
    if (h < 20) return "Buenas tardes";
    return "Buenas noches";
  })();

  const totalBudget = data.budgets.reduce((s, b) => s + b.limit, 0);
  const spentThisMonth = monthTxs.filter(t => t.type === "gasto").reduce((s, t) => s + t.amount, 0);

  const today = todayStr();
  const proximosTurnos = (data.turnos || []).filter(t => t.date >= today && !t.cancelled).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3);

  const isCurrentMonth = data.selectedMonth === currentMonth && data.selectedYear === currentYear;
  const todayDay = new Date().getDate();
  const proximosVencimientos = isCurrentMonth ? (data.events || []).filter(e => e.day - todayDay >= 0 && e.day - todayDay <= 7).sort((a, b) => a.day - b.day) : [];

  let filteredTxs;
  if (txFilter === "semana") {
    const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
    filteredTxs = data.transactions.filter(t => new Date(t.date) >= weekAgo);
  } else if (txFilter === "anterior") {
    filteredTxs = data.transactions.filter(t => {
      const p = parseDateParts(t.date);
      return p.year < data.selectedYear || (p.year === data.selectedYear && p.month < data.selectedMonth);
    });
  } else {
    filteredTxs = monthTxs;
  }
  if (search.trim()) {
    const q = search.trim().toLowerCase();
    filteredTxs = filteredTxs.filter(t => (t.description || "").toLowerCase().includes(q) || (t.category || "").toLowerCase().includes(q));
  }
  // Orden real por fecha (más reciente primero), no por orden de inserción —
  // agregar un gasto atrasado no debe hacerlo aparecer arriba de gastos más recientes.
  // reverse() antes de sort() (estable) para que, entre transacciones del mismo
  // día, las agregadas más recientemente queden primero — no se usa el id como
  // desempate porque las transacciones del bot de WhatsApp usan crypto.randomUUID().
  const sortedTxs = [...filteredTxs].reverse().sort((a, b) => b.date.localeCompare(a.date));
  const TX_PAGE_SIZE = 20;
  const txTotalPages = Math.max(1, Math.ceil(sortedTxs.length / TX_PAGE_SIZE));
  const txPageClamped = Math.min(txPage, txTotalPages - 1);
  const listTxs = sortedTxs.slice(txPageClamped * TX_PAGE_SIZE, txPageClamped * TX_PAGE_SIZE + TX_PAGE_SIZE);
  const delTx = (id) => {
    const prevData = data;
    save({ ...data, transactions: data.transactions.filter(t => t.id !== id) });
    showSnack && showSnack("Movimiento eliminado", () => save(prevData));
  };

  const catNames = Object.keys(data.categories);
  // Editar ahora abre el MISMO bottom sheet que "Nueva transacción"
  // (NuevaTransaccionSheet con prop `editing`), en vez de un formulario inline
  // aparte con dropdowns planos.
  const startEditTx = (t) => setEditingTxId(t.id);
  const cancelEditTx = () => setEditingTxId(null);
  const editingTx = editingTxId != null ? data.transactions.find(t => t.id === editingTxId) : null;

  return (
    <div className="inicio-layout">
      <div className="inicio-primary">
        <div>
          <div style={{ fontSize: 13, color: COLORS.textMuted, marginBottom: 2 }}>{greeting},</div>
          <div style={{ fontSize: 20, fontWeight: 700 }}>{displayName}</div>
        </div>

        {/* Hero balance -- calcado de la app real: "BALANCE DISPONIBLE" (antes
            "Balance del mes"), Ingresos/Gastos en una sola línea con puntos de
            color en vez del grid de 4 stats con flechas de antes. Deuda total
            y Ahorro total siguen viéndose en sus propios accesos rápidos
            (Deudas/Ahorros) más abajo -- no se pierde el dato, solo se saca
            del hero para calcar el diseño real, que no lo incluye acá. */}
        <div style={{ background: `linear-gradient(135deg, ${COLORS.accent} 0%, #002f28 100%)`, borderRadius: 28, padding: "22px 24px 20px", boxShadow: `0 12px 48px ${COLORS.accent}28`, position: "relative", overflow: "hidden" }}>
          <div style={{ position: "absolute", top: -50, right: -50, width: 200, height: 200, borderRadius: "50%", background: "#ffffff0d", pointerEvents: "none" }} />
          <div style={{ position: "relative", zIndex: 1 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div style={{ fontSize: 11, color: "#ffffffaa", fontWeight: 700, textTransform: "uppercase", letterSpacing: 1.5 }}>Balance disponible</div>
              <button onClick={() => setHideBalance(!hideBalance)} aria-label={hideBalance ? "Mostrar balance" : "Ocultar balance"} style={{ background: "none", border: "none", cursor: "pointer", padding: 0, display: "flex", alignItems: "center" }}><EyeToggleIcon shown={!hideBalance} color="#ffffffcc" size={17} /></button>
            </div>
            <div style={{ display: "flex", alignItems: "baseline", gap: 4, marginBottom: 4 }}>
              {hideBalance ? (
                <span style={{ fontSize: 40, fontWeight: 300, color: "#fff", fontFamily: "'Nunito', sans-serif" }}>••••••</span>
              ) : (
                <>
                  <span style={{ fontSize: 26, fontWeight: 400, color: "#ffffffcc", fontFamily: "'Nunito', sans-serif" }}>{balance < 0 ? "-$" : "$"}</span>
                  <span style={{ fontSize: 52, fontWeight: 300, color: "#fff", fontFamily: "'Nunito', sans-serif", letterSpacing: -2, lineHeight: 1 }}>{Math.abs(balance).toLocaleString("es-AR", { maximumFractionDigits: 0 })}</span>
                </>
              )}
            </div>
            <div style={{ fontSize: 13, color: "#ffffffb3", marginBottom: 12 }}>{MONTH_NAMES[data.selectedMonth]} {data.selectedYear}</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 18 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 13, color: "#ffffffdd", fontWeight: 500 }}>
                <span style={{ width: 8, height: 8, borderRadius: "50%", background: "#4ADE80", flexShrink: 0 }} />
                Ingresos {hideBalance ? "••••" : formatFull(totalIncome)}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 13, color: "#ffffffdd", fontWeight: 500 }}>
                <span style={{ width: 8, height: 8, borderRadius: "50%", background: "#F87171", flexShrink: 0 }} />
                Gastos {hideBalance ? "••••" : formatFull(totalExpense)}
              </div>
            </div>
          </div>
        </div>

        {totalBudget > 0 && (
          <Card style={{ padding: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: COLORS.textMuted, marginBottom: 8 }}>
              <span>Presupuesto del mes</span>
              <span>{formatFull(spentThisMonth)} / {formatFull(totalBudget)}</span>
            </div>
            <ProgressBar value={spentThisMonth} max={totalBudget} height={8} />
          </Card>
        )}
      </div>

      {/* Accesos rápidos + próximos turnos/vencimientos: mismo ancho completo que
          el resto de Inicio, ya no una columna lateral angosta al costado. */}
      <div className="inicio-rail">
        <div className="inicio-shortcuts">
          {/* Mismo grid ya alineado (3 columnas fijas en mobile, auto-fill
              desde 1024px) -- solo restyle visual de las cards, calcado de las
              cards blancas redondeadas de la app real (ícono arriba, label
              abajo, sin borde, sombra suave). */}
          {PLAN_PANELS.map(p => (
            <button key={p.key} onClick={() => onOpenPanel(p.key)} style={{ background: COLORS.surface, border: "none", borderRadius: 20, padding: "18px 8px 14px", display: "flex", flexDirection: "column", alignItems: "center", gap: 8, cursor: "pointer", boxShadow: "0 4px 16px #00000010" }}>
              <span style={{ fontSize: 26 }}>{p.icon}</span>
              <span style={{ fontSize: 12, fontWeight: 700, color: COLORS.text, textAlign: "center" }}>{p.label}</span>
            </button>
          ))}
        </div>

        {(proximosTurnos.length > 0 || proximosVencimientos.length > 0) && (
          <div className="inicio-upcoming">
            {proximosTurnos.length > 0 && (
              <Card style={{ padding: 18 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                  <div style={{ fontWeight: 700, fontSize: 15 }}>📅 Próximos turnos</div>
                  <button onClick={() => onOpenPanel("turnos")} style={{ background: "none", border: "none", color: COLORS.accent, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Ver todos</button>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {proximosTurnos.map(t => (
                    <div key={t.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                      <span>{TIPO_ICONS[t.turnoType] || "📌"} {t.description}</span>
                      <span style={{ color: COLORS.textMuted }}>{t.date}{t.time ? ` · ${t.time}` : ""}</span>
                    </div>
                  ))}
                </div>
              </Card>
            )}

            {proximosVencimientos.length > 0 && (
              <Card style={{ padding: 18 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                  <div style={{ fontWeight: 700, fontSize: 15 }}>⏰ Próximos vencimientos</div>
                  <button onClick={() => onOpenPanel("calendario")} style={{ background: "none", border: "none", color: COLORS.accent, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Ver todos</button>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {proximosVencimientos.map(e => (
                    <div key={e.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                      <span style={{ color: eventType(e.type).color }}>{eventType(e.type).label} {e.title}</span>
                      <span style={{ color: COLORS.textMuted }}>{e.day - todayDay === 0 ? "hoy" : `en ${e.day - todayDay}d`}</span>
                    </div>
                  ))}
                </div>
              </Card>
            )}
          </div>
        )}
      </div>

      {/* Transacciones embebidas, con filtros y buscador como en la app */}
      <div className="inicio-tx">
        <Card style={{ padding: 0, overflow: "hidden" }}>
          <div style={{ padding: "16px 20px 12px", borderBottom: `1px solid ${COLORS.border}` }}>
            <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 12 }}>Transacciones</div>
            <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
              {[["semana", "Semana"], ["mes", "Mes"], ["anterior", "Anterior"]].map(([k, label]) => (
                <button key={k} onClick={() => { setTxFilter(k); setTxPage(0); }} style={{ background: txFilter === k ? COLORS.accent : COLORS.bg, color: txFilter === k ? "#fff" : COLORS.textMuted, border: "none", borderRadius: 99, padding: "5px 14px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>{label}</button>
              ))}
            </div>
            <input value={search} onChange={e => { setSearch(e.target.value); setTxPage(0); }} placeholder="Buscar por descripción o categoría..." style={{ width: "100%", background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "8px 12px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none", boxSizing: "border-box" }} />
          </div>
          {listTxs.length === 0 ? (
            <div style={{ padding: 32, textAlign: "center", color: COLORS.textMuted }}>Sin transacciones.</div>
          ) : listTxs.map(t => (
            <Removable key={t.id} onRemove={() => delTx(t.id)}>
              {({ remove, rowClass }) => (
                <div className={rowClass} style={{ display: "flex", alignItems: "center", padding: "12px 20px", borderBottom: `1px solid ${COLORS.border}`, gap: 12 }}>
                  <div style={{ width: 34, height: 34, borderRadius: 10, background: isIncomeType(t) ? COLORS.greenDim : COLORS.redDim, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15, flexShrink: 0 }}>{catIcon(data, t.category)}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontWeight: 500, fontSize: 13 }}>{t.description || t.category}</div>
                    <div style={{ fontSize: 11, color: COLORS.textMuted }}>{t.date} · {t.category}</div>
                  </div>
                  <div style={{ fontWeight: 700, fontSize: 14, color: isIncomeType(t) ? COLORS.green : COLORS.red }}>{isIncomeType(t) ? "+" : "-"}{formatFull(t.amount)}</div>
                  <button onClick={() => startEditTx(t)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.accent, fontSize: 13, fontWeight: 600, padding: 4 }}>Editar</button>
                  <button onClick={remove} aria-label={`Eliminar ${t.description || t.category}`} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textMuted, fontSize: 15, padding: 8, lineHeight: 1, display: "flex", alignItems: "center" }}>✕</button>
                </div>
              )}
            </Removable>
          ))}
          {txTotalPages > 1 && (
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 16, padding: "12px 20px" }}>
              <button onClick={() => setTxPage(p => Math.max(0, p - 1))} disabled={txPageClamped === 0} style={{ background: "none", border: "none", cursor: txPageClamped === 0 ? "default" : "pointer", color: txPageClamped === 0 ? COLORS.textDim : COLORS.accent, fontSize: 13, fontWeight: 600, opacity: txPageClamped === 0 ? 0.5 : 1 }}>← Anterior</button>
              <span style={{ fontSize: 12, color: COLORS.textMuted }}>Página {txPageClamped + 1} de {txTotalPages}</span>
              <button onClick={() => setTxPage(p => Math.min(txTotalPages - 1, p + 1))} disabled={txPageClamped === txTotalPages - 1} style={{ background: "none", border: "none", cursor: txPageClamped === txTotalPages - 1 ? "default" : "pointer", color: txPageClamped === txTotalPages - 1 ? COLORS.textDim : COLORS.accent, fontSize: 13, fontWeight: 600, opacity: txPageClamped === txTotalPages - 1 ? 0.5 : 1 }}>Siguiente →</button>
            </div>
          )}
        </Card>
      </div>

      {editingTx && (
        <NuevaTransaccionSheet data={data} save={save} editing={editingTx} onClose={cancelEditTx} />
      )}
    </div>
  );
}

// ---- ANÁLISIS ----
function AnalisisTab({ data }) {
  const months = Array.from({ length: 6 }, (_, i) => {
    let m = currentMonth - 5 + i, y = currentYear;
    if (m < 0) { m += 12; y--; }
    const txs = data.transactions.filter(t => { const p = parseDateParts(t.date); return p.month === m && p.year === y; });
    const inc = txs.filter(isIncomeType).reduce((s, t) => s + t.amount, 0);
    const exp = txs.filter(isExpenseType).reduce((s, t) => s + t.amount, 0);
    return { m, y, label: MONTH_NAMES[m], inc, exp };
  });
  const maxVal = Math.max(...months.flatMap(mo => [mo.inc, mo.exp]), 1);

  const selMonthTxs = data.transactions.filter(t => { const p = parseDateParts(t.date); return p.month === data.selectedMonth && p.year === data.selectedYear; });
  const totalIncome = selMonthTxs.filter(isIncomeType).reduce((s, t) => s + t.amount, 0);
  const totalExpense = selMonthTxs.filter(isExpenseType).reduce((s, t) => s + t.amount, 0);
  const expByCat = {};
  selMonthTxs.filter(t => t.type === "gasto").forEach(t => { expByCat[t.category] = (expByCat[t.category] || 0) + t.amount; });
  const topCats = Object.entries(expByCat).sort((a, b) => b[1] - a[1]);
  const maxCat = Math.max(...topCats.map(([, v]) => v), 1);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ fontSize: 20, fontWeight: 700 }}>Análisis</div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Card style={{ padding: 16 }}>
          <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", marginBottom: 6 }}>Ingresos</div>

function PerfilTab({ user, displayName, waPhone, onConnectWa, onLogout }) {

  const [apellido, setApellido] = useState(user?.user_metadata?.apellido || "");
  const [nameMsg, setNameMsg] = useState("");
  const [savingName, setSavingName] = useState(false);

  const [changingPw, setChangingPw] = useState(false);
  const [pw1, setPw1] = useState("");
  const [pw2, setPw2] = useState("");
  const [pwMsg, setPwMsg] = useState("");
  const [pwLoading, setPwLoading] = useState(false);

  const saveName = async () => {
    setSavingName(true); setNameMsg("");
    const full_name = [nombre, apellido].filter(Boolean).join(" ");

    if (pw1 !== pw2) { setPwMsg("Las contraseñas no coinciden"); return; }
    setPwLoading(true); setPwMsg("");

    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {/* Header verde con avatar + nombre + email, calcado de la app real.

          </div>

        <ProfileRow label="Cambiar contraseña" sub="Actualizá tu contraseña de acceso" onClick={() => setChangingPw(v => !v)} open={changingPw} />
