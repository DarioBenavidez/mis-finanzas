// ---- NUEVA TRANSACCIÓN (bottom sheet, calcado de "Nuevo movimiento") ----
// Antes este componente también mostraba la lista completa del mes con
// edición/borrado inline (era el panel detrás del botón "+"). Esa lista ya
// vive embebida en Inicio (con buscador y filtros semana/mes/anterior, edición
// y borrado incluidos) -- mostrarla de nuevo acá era redundante y, sobre todo,
// no es lo que hace la app real: en la app, "+" abre únicamente el formulario
// de alta como bottom sheet. Editar/eliminar transacciones existentes se sigue
// haciendo desde la lista de Inicio, sin pérdida de funcionalidad.
// `editing` opcional: si viene una transacción, el sheet funciona en modo
// edición (mismo formulario que el alta -- antes editar usaba otra UI, con
// dropdowns planos, dentro de la lista de Inicio).
function NuevaTransaccionSheet({ data, save, onClose, editing = null }) {
  const catNames = Object.keys(data.categories);
  const [form, setForm] = useState(editing
    ? { type: editing.type, amount: formatAmountInput(editing.amount), category: editing.category || catNames[0] || "Otros", description: editing.description || "", date: editing.date }
    : { type: "gasto", amount: "", category: catNames[0] || "Otros", description: "", date: todayStr() });
  const [showCatForm, setShowCatForm] = useState(false);
  const [newCatName, setNewCatName] = useState("");

  // gasto/ingreso siempre; si se está editando una tx de un tipo que la web no
  // ofrece crear (ahorro_meta, sueldo...), se agrega como 3ª opción para no
  // pisarlo sin querer.
  const typeOptions = [{ value: "gasto", label: "Gasto" }, { value: "ingreso", label: "Ingreso" }];
  if (editing && !typeOptions.some(o => o.value === editing.type)) {
    typeOptions.push({ value: editing.type, label: editing.type });
  }

  const add = () => {
    if (!form.amount || !parseAmountInput(form.amount)) return;
    const amount = parseAmountInput(form.amount);
    if (editing) {
      const transactions = data.transactions.map(t => t.id === editing.id ? { ...t, ...form, amount } : t);
      save({ ...data, transactions });
    } else {
      const tx = { ...form, amount, id: Date.now() };
      save({ ...data, transactions: [...data.transactions, tx] });
    }
    onClose();
  };

  const addCategoryQuick = () => {
    const name = newCatName.trim();
    if (!name || data.categories[name]) return;
    const categories = { ...data.categories, [name]: "📦" };
    const budgets = [...data.budgets, { cat: name, limit: 0 }];
    save({ ...data, categories, budgets });
    setForm(f => ({ ...f, category: name }));
    setNewCatName("");
    setShowCatForm(false);
  };

  return (
    <BottomSheet title={editing ? "Editar movimiento" : "Nuevo movimiento"} onClose={onClose}>
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <SegmentedControl
          options={typeOptions}
          value={form.type}
          onChange={v => setForm({ ...form, type: v })}
        />
        <Input label="Monto" value={form.amount} onChange={v => setForm({ ...form, amount: v })} type="amount" prefix="$" placeholder="0" />
        <Input label="Descripción" value={form.description} onChange={v => setForm({ ...form, description: v })} placeholder="Ej: Supermercado, Netflix..." />
        {/* Igual que la app real: las categorías se muestran siempre, sin
            filtrar por Gasto/Ingreso -- es una lista plana compartida. */}
        <div>
          <label style={{ fontSize: 11, color: COLORS.accent, fontWeight: 700, letterSpacing: "0.8px", textTransform: "uppercase", display: "block", marginBottom: 8 }}>Categoría *</label>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            <button onClick={() => setShowCatForm(s => !s)} style={{ background: COLORS.accent, color: "#fff", border: "none", borderRadius: 999, padding: "9px 16px", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>+ Nueva</button>
            {catNames.map(c => (
              <button key={c} onClick={() => setForm({ ...form, category: c })} style={{
                background: form.category === c ? COLORS.accent : COLORS.pillBg,
                color: form.category === c ? "#fff" : COLORS.accent,
                border: "none", borderRadius: 999, padding: "9px 16px", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit",
              }}>{catIcon(data, c)} {c}</button>
            ))}
          </div>
          {showCatForm && (
            <div className="form-pop" style={{ display: "flex", gap: 8, marginTop: 10 }}>
              <input value={newCatName} onChange={e => setNewCatName(e.target.value)} placeholder="Nombre de categoría" style={{ flex: 1, minWidth: 0, background: COLORS.pillBg, border: "none", borderRadius: 999, padding: "10px 16px", fontFamily: "inherit", fontSize: 14, color: COLORS.text, outline: "none" }} />
              <Button onClick={addCategoryQuick} variant="gold" style={{ flexShrink: 0 }}>Agregar</Button>
            </div>
          )}
        </div>
        <Input label="Fecha" value={form.date} onChange={v => setForm({ ...form, date: v })} type="date" />
      </div>
      <SheetActions onCancel={onClose} onSave={add} saveLabel={editing ? "Guardar cambios" : "Guardar"} />
    </BottomSheet>
  );
}

// ---- PRESUPUESTO (incluye gestión de categorías) ----
function Presupuesto({ data, save, expByCat }) {
  const [showCatForm, setShowCatForm] = useState(false);
  const [newCat, setNewCat] = useState({ icon: "📦", name: "" });
  const [editingCat, setEditingCat] = useState(null);
  const [editCat, setEditCat] = useState({ icon: "", name: "" });

  const updateLimit = (cat, val) => {
    const budgets = data.budgets.map(b => b.cat === cat ? { ...b, limit: parseAmountInput(val) } : b);
    save({ ...data, budgets });
  };

  const addCategory = () => {
    const name = newCat.name.trim();
    if (!name || data.categories[name]) return;
    const categories = { ...data.categories, [name]: newCat.icon };
    const budgets = [...data.budgets, { cat: name, limit: 0 }];
    save({ ...data, categories, budgets });
    setNewCat({ icon: "📦", name: "" });
    setShowCatForm(false);
  };

  const startEditCat = (name) => { setEditingCat(name); setEditCat({ icon: catIcon(data, name), name }); };

  const saveEditCat = () => {
    const oldName = editingCat;
    const newName = editCat.name.trim();
    if (!newName) return;
    const categories = { ...data.categories };
    delete categories[oldName];
    categories[newName] = editCat.icon;
    const budgets = data.budgets.map(b => b.cat === oldName ? { ...b, cat: newName } : b);
    const transactions = data.transactions.map(t => t.category === oldName ? { ...t, category: newName } : t);
    save({ ...data, categories, budgets, transactions });
    setEditingCat(null);
  };

  // Separado en "confirmar" (síncrono, antes de animar) y "aplicar" (después
  // de la animación de salida, ver Removable más abajo): si confirmamos y
  // borramos en el mismo paso, la fila desaparece de golpe antes de que la
  // transición de salida llegue a jugar.
  const confirmDeleteCategory = (name) => {
    const txCount = data.transactions.filter(t => t.category === name).length;
    const msg = txCount > 0
      ? `Eliminar "${name}" dejará ${txCount} transacción(es) sin categoría existente. ¿Continuar?`
      : `¿Eliminar la categoría "${name}"?`;
    return window.confirm(msg);
  };
  const commitDeleteCategory = (name) => {
    const categories = { ...data.categories };
    delete categories[name];
    const budgets = data.budgets.filter(b => b.cat !== name);
    save({ ...data, categories, budgets });
  };

  const allCatNames = Array.from(new Set([
    ...Object.keys(data.categories),
    ...data.budgets.filter(b => b.limit > 0).map(b => b.cat),
  ]));
  const totalBudget = data.budgets.reduce((s, b) => s + b.limit, 0);
  const totalSpent = Object.values(expByCat).reduce((s, v) => s + v, 0);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
        <Card>
          <div style={{ fontSize: 12, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", marginBottom: 6 }}>Presupuesto total</div>
          <div style={{ fontSize: 28, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif", letterSpacing: -1 }}>{formatFull(totalBudget)}</div>
        </Card>
        <Card>
          <div style={{ fontSize: 12, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", marginBottom: 6 }}>Gastado este mes</div>
          <div style={{ fontSize: 28, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif", letterSpacing: -1 }}>{formatFull(totalSpent)}</div>
        </Card>
      </div>

      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <div style={{ fontWeight: 700, fontSize: 15 }}>Categorías y límites</div>
          <Button size="sm" onClick={() => setShowCatForm(true)}>+ Nueva categoría</Button>
        </div>

        {showCatForm && (
          <BottomSheet title="Nueva categoría" onClose={() => setShowCatForm(false)}>
            <IconPicker value={newCat.icon} onChange={ic => setNewCat({ ...newCat, icon: ic })} />
            <div style={{ height: 14 }} />
            <Input label="Nombre" value={newCat.name} onChange={v => setNewCat({ ...newCat, name: v })} placeholder="Ej: Mascotas" />
            <SheetActions onCancel={() => setShowCatForm(false)} onSave={addCategory} />
          </BottomSheet>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
          {allCatNames.map(catName => {
            const b = data.budgets.find(x => x.cat === catName) || { cat: catName, limit: 0 };
            const spent = expByCat[catName] || 0;
            const pct = b.limit > 0 ? Math.min(100, (spent / b.limit) * 100) : 0;
            const isEditing = editingCat === catName;
            return (
              <Removable key={catName} onRemove={() => commitDeleteCategory(catName)}>
                {({ remove, rowClass }) => (
                <div className={isEditing ? "form-pop" : rowClass}>
                {isEditing ? (
                  <div style={{ background: COLORS.bg, borderRadius: 14, padding: 16, border: `1.5px solid ${COLORS.accent}`, boxShadow: "0 4px 16px #00000014", display: "flex", flexDirection: "column", gap: 10 }}>
                    <div style={{ fontWeight: 700, fontSize: 13, color: COLORS.accent }}>✏️ Editar categoría</div>
                    <IconPicker value={editCat.icon} onChange={ic => setEditCat({ ...editCat, icon: ic })} />
                    <div className="inline-edit-actions">
                      <input value={editCat.name} onChange={e => setEditCat({ ...editCat, name: e.target.value })} style={{ background: "#fff", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13 }} />
                      <Button onClick={saveEditCat} size="sm">Guardar</Button>
                      <Button onClick={() => setEditingCat(null)} variant="ghost" size="sm">Cancelar</Button>
                    </div>
                  </div>
                ) : (
                  <div>
                    {/* Fila 1: ícono + nombre + editar/eliminar — separada de los montos
                        para no amontonar 5 elementos en una sola fila en mobile (antes el
                        nombre y "$X / $Y" quedaban pegados o se cortaban en ~360-390px). */}
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                      <span style={{ fontSize: 20 }}>{catIcon(data, catName)}</span>
                      <span style={{ fontSize: 14, fontWeight: 600, flex: 1, minWidth: 0 }}>{catName}</span>
                      <button onClick={() => startEditCat(catName)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textMuted, fontSize: 14, flexShrink: 0 }}>✏️</button>
                      <button onClick={() => { if (confirmDeleteCategory(catName)) remove(); }} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textDim, fontSize: 14, flexShrink: 0 }}>✕</button>
                    </div>
                    {/* Fila 2: gasto/límite + barra de progreso (izquierda, flexible) y el
                        input de límite (derecha, ancho fijo) — con flex-wrap por si igual
                        no entran en el mismo renglón. */}
                    <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                      <div style={{ flex: 1, minWidth: 140 }}>
                        {b.limit > 0 ? (
                          <span style={{ fontSize: 13, color: COLORS.textMuted }}>{formatFull(spent)} / {formatFull(b.limit)}</span>
                        ) : spent > 0 ? (
                          <span style={{ fontSize: 13, color: COLORS.textMuted }}>Gastado: {formatFull(spent)}</span>
                        ) : (
                          <span style={{ fontSize: 13, color: COLORS.textDim }}>Sin gastos este mes</span>
                        )}
                        {b.limit > 0 && <div style={{ marginTop: 6 }}><ProgressBar value={spent} max={b.limit} /></div>}
                      </div>
                      <input
                        type="text"
                        inputMode="numeric"
                        value={formatAmountInput(b.limit || "")}
                        onChange={e => updateLimit(catName, e.target.value)}
                        placeholder="Límite"
                        style={{ width: 90, flexShrink: 0, background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "5px 8px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, textAlign: "right" }}
                      />
                    </div>
                  </div>
                )}
                </div>
                )}
              </Removable>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

// ---- AHORROS ----
function Ahorros({ data, save, dolarRate }) {
  const [form, setForm] = useState({ name: "", target: "", current: "", currency: "ars" });
  const [addAmt, setAddAmt] = useState({});
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [editForm, setEditForm] = useState({ name: "", target: "" });
  const [fromSalary, setFromSalary] = useState(true);

  const add = () => {
    if (!form.name || !form.target) return;
    const isUsd = form.currency === "usd";
    const parse = isUsd ? parseAmountInputUSD : parseAmountInput;
    const current = parse(form.current);
    const g = {
      id: Date.now(), name: form.name, target: parse(form.target), current,
      currency: form.currency, arsRate: form.currency === "usd" ? dolarRate : null,
      history: current > 0 ? [{ date: todayStr(), amount: current }] : [],
    };
    let transactions = data.transactions;
    if (current > 0 && fromSalary) {
      const amountARS = form.currency === "usd" ? Math.round(current * (dolarRate || 0)) : current;
      transactions = [...transactions, {
        id: Date.now() + 1, type: "ahorro_meta", description: `Ahorro: ${g.name}`,
        amount: amountARS, category: findCatCI(data, "Otros") || "Otros", date: todayStr(), savingsId: g.id,
        ...(form.currency === "usd" ? { currency: "usd", amountUSD: current } : {}),
      }];
    }
    save({ ...data, savings: [...data.savings, g], transactions });
    setForm({ name: "", target: "", current: "", currency: "ars" });
    setFromSalary(true);
    setShowForm(false);
  };

  const startEdit = (g) => { setEditId(g.id); setEditForm({ name: g.name, target: (g.currency === "usd" ? formatAmountInputUSD : formatAmountInput)(g.target) }); };
  const saveEdit = () => {
    if (!editForm.name || !editForm.target) return;
    const savings = data.savings.map(g => {
      if (g.id !== editId) return g;
      const parse = g.currency === "usd" ? parseAmountInputUSD : parseAmountInput;
      return { ...g, name: editForm.name, target: parse(editForm.target) };
    });
    save({ ...data, savings });
    setEditId(null);
  };

  const addToSaving = (id) => {
    const g = data.savings.find(x => x.id === id);
    const parse = g && g.currency === "usd" ? parseAmountInputUSD : parseAmountInput;
    const amt = parse(addAmt[id] || 0);
    if (!amt) return;
    const savings = data.savings.map(g => g.id === id ? { ...g, current: (g.current || 0) + amt, history: [...(g.history || []), { date: todayStr(), amount: amt }] } : g);
    save({ ...data, savings });
    setAddAmt({ ...addAmt, [id]: "" });
  };

  const confirmDeleteSaving = () => window.confirm("¿Eliminar esta meta de ahorro?");
  const commitDeleteSaving = (id) => save({ ...data, savings: data.savings.filter(g => g.id !== id) });

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <Button onClick={() => setShowForm(true)}>+ Nueva meta</Button>
      </div>
      {showForm && (
        <BottomSheet title="Nueva meta de ahorro" onClose={() => setShowForm(false)}>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <Input label="Nombre" value={form.name} onChange={v => setForm({ ...form, name: v })} placeholder="Ej: Vacaciones" />
            <SegmentedControl
              options={[{ value: "ars", label: "🇦🇷 ARS" }, { value: "usd", label: "🇺🇸 USD" }]}
              value={form.currency}
              onChange={v => setForm({ ...form, currency: v })}
            />
            <Input label="Meta" value={form.target} onChange={v => setForm({ ...form, target: v })} type="amount" decimals={form.currency === "usd"} prefix={form.currency === "usd" ? "US$" : "$"} placeholder="0" />
            <Input label="Ya tengo" value={form.current} onChange={v => setForm({ ...form, current: v })} type="amount" decimals={form.currency === "usd"} prefix={form.currency === "usd" ? "US$" : "$"} placeholder="0" />
            {parseAmountInput(form.current) > 0 && (
              <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: COLORS.textMuted }}>
                <input type="checkbox" checked={fromSalary} onChange={e => setFromSalary(e.target.checked)} />
                Ese monto ya lo desconté de mi sueldo (afecta el balance del mes)
              </label>
            )}
          </div>
          <SheetActions onCancel={() => setShowForm(false)} onSave={add} saveLabel="Crear meta" />
        </BottomSheet>
      )}

      {data.savings.length === 0 ? (
        <Card style={{ textAlign: "center", padding: 48 }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>🐷</div>
          <div style={{ color: COLORS.textMuted }}>No tenés metas de ahorro aún.</div>
        </Card>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 16 }}>
          {data.savings.map(g => {
            const pct = g.target > 0 ? Math.min(100, (g.current / g.target) * 100) : 0;
            const remaining = Math.max(0, g.target - g.current);
            const fmt = g.currency === "usd" ? formatUSD : formatFull;
            const arsEquiv = g.currency === "usd" && dolarRate ? Math.round(g.current * dolarRate) : null;
            return (
              <Removable key={g.id} onRemove={() => commitDeleteSaving(g.id)}>
              {({ remove, rowClass }) => (
              <Card className={editId === g.id ? "form-pop" : rowClass}>
                {editId === g.id ? (
                  <div style={{ marginBottom: 16 }}>
                    <div style={{ fontWeight: 700, marginBottom: 12, fontSize: 14 }}>✏️ Editar meta</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                      <input value={editForm.name} onChange={e => setEditForm({...editForm, name: e.target.value})} placeholder="Nombre" style={{ background: "#f8faf8", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none" }} />
                      <input type="text" inputMode={g.currency === "usd" ? "decimal" : "numeric"} value={editForm.target} onChange={e => setEditForm({...editForm, target: (g.currency === "usd" ? formatAmountInputUSD : formatAmountInput)(e.target.value)})} placeholder="Meta total" style={{ background: "#f8faf8", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none" }} />
                      <div className="inline-edit-actions">
                        <Button onClick={saveEdit} size="sm">Guardar</Button>
                        <Button onClick={() => setEditId(null)} variant="ghost" size="sm">Cancelar</Button>
                      </div>
                    </div>
                  </div>
                ) : (
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16 }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 16 }}>{g.name}</div>
                    {g.currency === "usd" && <Pill color={COLORS.green}>USD{arsEquiv ? ` · ≈ ${formatFull(arsEquiv)}` : ""}</Pill>}
                  </div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => startEdit(g)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textMuted, fontSize: 14 }}>✏️</button>
                    <button onClick={() => { if (confirmDeleteSaving()) remove(); }} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textDim }}>✕</button>
                  </div>
                </div>
                )}
                <div style={{ marginBottom: 8 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: COLORS.textMuted, marginBottom: 8 }}>
                    <span>Ahorrado: <strong>{fmt(g.current)}</strong></span>
                    <span>Meta: <strong style={{ color: COLORS.text }}>{fmt(g.target)}</strong></span>
                  </div>
                  <ProgressBar value={g.current} max={g.target} color={COLORS.accent} height={10} />
                  <div style={{ fontSize: 13, color: COLORS.textMuted, marginTop: 8 }}>
                    {pct.toFixed(1)}% · Falta {fmt(remaining)}
                  </div>
                </div>
                {g.history && g.history.length > 0 && (
                  <div style={{ marginTop: 8 }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: COLORS.textDim, letterSpacing: ".5px", textTransform: "uppercase", marginBottom: 6 }}>
                      Últimos depósitos
                    </div>
                    <div style={{ maxHeight: 96, overflowY: "auto", display: "flex", flexDirection: "column", gap: 4 }}>
                      {g.history.slice().reverse().map((h, i) => (
                        <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: COLORS.textDim }}>
                          <span>{h.date}</span>
                          <span>+{fmt(h.amount)}</span>
                        </div>
                      ))}
                    </div>
                    {g.history.length > 4 && (
                      <div style={{ textAlign: "center", fontSize: 12, color: COLORS.textMuted, marginTop: 2 }}>⌄</div>
                    )}
                  </div>
                )}
                <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
                  <input
                    type="text"
                    inputMode={g.currency === "usd" ? "decimal" : "numeric"}
                    value={addAmt[g.id] || ""}
                    onChange={e => setAddAmt({ ...addAmt, [g.id]: (g.currency === "usd" ? formatAmountInputUSD : formatAmountInput)(e.target.value) })}
                    placeholder={g.currency === "usd" ? "Agregar US$..." : "Agregar monto..."}
                    style={{ flex: 1, background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13 }}
                  />
                  <Button onClick={() => addToSaving(g.id)} size="sm">+ Agregar</Button>
                </div>
              </Card>
              )}
              </Removable>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ---- DEUDAS ----
function Deudas({ data, save, dolarRate }) {
  const [form, setForm] = useState({ name: "", total: "", remaining: "", installment: "", remainingInstallments: "", dueDay: "", interest: "", currency: "ars" });
  const [showForm, setShowForm] = useState(false);
  const [showAdvanced, setShowAdvanced] = useState(false);
  const [payAmt, setPayAmt] = useState({});
  const [editId, setEditId] = useState(null);
  const [editForm, setEditForm] = useState({ name: "", total: "", remaining: "", installment: "", remainingInstallments: "", dueDay: "", interest: "" });
  // Si el usuario no tocó "Cuota mensual" a mano, se recalcula solo a partir de
  // Saldo restante ÷ Cuotas restantes. En cuanto edita el campo directamente,
  // dejamos de pisarlo (por si la cuota real no es una división exacta, ej. con
  // interés).
  const [installmentEdited, setInstallmentEdited] = useState(false);
  const autoInstallment = (remainingVal, cuotasVal) => {
    const r = parseAmountInput(remainingVal || "0");
    const c = parseInt(cuotasVal) || 0;
    return r > 0 && c > 0 ? formatAmountInput(String(Math.round(r / c))) : "";
  };
  // Preview "N cuotas · Termina {mes} {año}", calcado de la app real: se
  // deduce solo de Monto pendiente ÷ Cuota mensual, sin pedir cuotas restantes
  // a mano (eso queda en "Más opciones" para cuando la cuenta no da exacta).
  const calcPreview = (remainingVal, installmentVal) => {
    const r = parseAmountInput(remainingVal || "0");
    const inst = parseAmountInput(installmentVal || "0");
    if (r <= 0 || inst <= 0) return null;
    const cuotas = Math.ceil(r / inst);
    const now = new Date();
    const end = new Date(now.getFullYear(), now.getMonth() + cuotas - 1, 1);
    return { cuotas, label: `${MONTH_NAMES[end.getMonth()]} ${end.getFullYear()}` };
  };

  const add = () => {
    if (!form.name || !form.remaining) return;
    const installment = parseAmountInput(form.installment);
    const remainingInstallments = parseInt(form.remainingInstallments) || (installment > 0 ? Math.ceil(parseAmountInput(form.remaining) / installment) : 0);
    const isUsd = form.currency === "usd";
    const d = {
      id: Date.now(),
      name: form.name,
      currency: form.currency,
      total: isUsd ? Math.round(parseAmountInput(form.total || form.remaining) * (dolarRate || 0)) : (parseAmountInput(form.total) || parseAmountInput(form.remaining)),
      remaining: isUsd ? Math.round(parseAmountInput(form.remaining) * (dolarRate || 0)) : parseAmountInput(form.remaining),
      ...(isUsd ? { amountUSD: parseAmountInput(form.total || form.remaining), remainingUSD: parseAmountInput(form.remaining), arsRate: dolarRate } : {}),
      installment,
      remainingInstallments,
      dueDay: parseInt(form.dueDay) || 1,
      interest: parseFloat(form.interest) || 0,
      startMonth: new Date().getMonth(),
      startYear: new Date().getFullYear(),
    };
    save({ ...data, debts: [...data.debts, d] });
    setForm({ name: "", total: "", remaining: "", installment: "", remainingInstallments: "", dueDay: "", interest: "", currency: "ars" });
    setInstallmentEdited(false);
    setShowAdvanced(false);
    setShowForm(false);
  };

  const startEdit = (d) => {
    setEditId(d.id);
    const isUsd = d.currency === "usd";
    setEditForm({
      name: d.name,
      total: formatAmountInput(String(isUsd ? (d.amountUSD || 0) : (d.total || 0))),
      remaining: formatAmountInput(String(isUsd ? (d.remainingUSD || 0) : (d.remaining || 0))),
      installment: formatAmountInput(String(d.installment || 0)),
      remainingInstallments: d.remainingInstallments ? String(d.remainingInstallments) : "",
      dueDay: d.dueDay ? String(d.dueDay) : "",
      interest: d.interest ? String(d.interest) : "",
    });
  };
  const saveEdit = () => {
    if (!editForm.name || !editForm.remaining) return;
    const debts = data.debts.map(d => {
      if (d.id !== editId) return d;
      const isUsd = d.currency === "usd";
      const rate = dolarRate || d.arsRate || 0;
      const remainingVal = parseAmountInput(editForm.remaining);
      const totalVal = parseAmountInput(editForm.total || editForm.remaining);
      const upd = {
        ...d,
        name: editForm.name,
        installment: parseAmountInput(editForm.installment),
        remainingInstallments: parseInt(editForm.remainingInstallments) || 0,
        dueDay: parseInt(editForm.dueDay) || 1,
        interest: parseFloat(editForm.interest) || 0,
      };
      if (isUsd) {
        upd.remainingUSD = remainingVal;
        upd.amountUSD = totalVal;
        upd.remaining = Math.round(remainingVal * rate);
        upd.total = Math.round(totalVal * rate);
      } else {
        upd.remaining = remainingVal;
        upd.total = totalVal;
      }
      return upd;
    });
    save({ ...data, debts });
    setEditId(null);
  };

  const pay = (id) => {
    const amt = parseAmountInput(payAmt[id] || 0);
    if (!amt) return;
    const debt = data.debts.find(d => d.id === id);
    if (debt.currency === "usd" && !dolarRate && !debt.arsRate) { alert("Sin cotización del dólar disponible, intentá más tarde."); return; }
    const rate = dolarRate || debt.arsRate || 0;
    const amountARS = debt.currency === "usd" ? Math.round(amt * rate) : amt;
    const debts = data.debts.map(d => {
      if (d.id !== id) return d;
      const upd = { ...d };
      // Igual que la app real: un pago solo cuenta como "una cuota" si cubre al
      // menos el 90% de la cuota mensual. Un pago parcial (ej. $400 de una cuota
      // de $1000) descuenta esa plata de la deuda pero no toca "cuotas restantes".
      if ((d.remainingInstallments || 0) > 0 && d.installment > 0 && amountARS >= d.installment * 0.9) {
        upd.remainingInstallments = Math.max(0, (d.remainingInstallments || 0) - 1);
      }
      if (d.currency === "usd") { upd.remainingUSD = Math.max(0, (d.remainingUSD || 0) - amt); upd.remaining = Math.round(upd.remainingUSD * rate); }
      else { upd.remaining = Math.max(0, d.remaining - amt); }
      return upd;
    });
    const cat = findCatCI(data, "Préstamo tarjeta") || findCatCI(data, "Otros") || Object.keys(data.categories)[0];
    const transactions = [...data.transactions, {
      id: Date.now(), type: "gasto", description: `Pago ${debt.name}`, amount: amountARS,
      category: cat, date: todayStr(),
      ...(debt.currency === "usd" ? { currency: "usd", amountUSD: amt } : {}),
    }];
    save({ ...data, debts, transactions });
    setPayAmt({ ...payAmt, [id]: "" });
  };

  const confirmDeleteDebt = () => window.confirm("¿Eliminar esta deuda?");
  const commitDeleteDebt = (id) => save({ ...data, debts: data.debts.filter(d => d.id !== id) });

  const totalDebt = data.debts.reduce((s, d) => s + (d.currency === "usd" ? Math.round((d.remainingUSD || 0) * (dolarRate || d.arsRate || 0)) : d.remaining), 0);
  const monthlyPayments = data.debts.reduce((s, d) => s + (d.installment || 0), 0);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <Card style={{ padding: "12px 20px" }}>
            <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", marginBottom: 4 }}>Deuda total</div>
            <div style={{ fontSize: 22, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif" }}>{formatFull(totalDebt)}</div>
          </Card>
          {monthlyPayments > 0 && (
            <Card style={{ padding: "12px 20px" }}>
              <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", marginBottom: 4 }}>Cuotas mensuales</div>
              <div style={{ fontSize: 22, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif" }}>{formatFull(monthlyPayments)}</div>
            </Card>
          )}
        </div>
        <Button onClick={() => setShowForm(true)}>+ Nueva deuda</Button>
      </div>

      {showForm && (
        <BottomSheet title="Nueva deuda" onClose={() => setShowForm(false)}>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            {/* Calcado de la app real: 3 campos + auto-cálculo de cuotas y
                fecha fin. Moneda/interés/vencimiento/cuotas manuales, que la
                app no tiene, quedan detrás de "Más opciones" para no perder
                lo que la web ya soportaba (deudas en USD, por ejemplo). */}
            <Input label="Nombre / Acreedor" value={form.name} onChange={v => setForm({ ...form, name: v })} placeholder="Ej: Tarjeta Visa" />
            <Input label="Monto pendiente" value={form.remaining} onChange={v => {
              const next = { ...form, remaining: v };
              if (!installmentEdited) next.installment = autoInstallment(v, form.remainingInstallments);
              setForm(next);
            }} type="amount" prefix={form.currency === "usd" ? "US$" : "$"} placeholder="0" />
            <Input label="Cuota mensual" value={form.installment} onChange={v => { setInstallmentEdited(true); setForm({ ...form, installment: v }); }} type="amount" prefix="$" placeholder="0" />

            {(() => {
              const preview = calcPreview(form.remaining, form.installment);
              return (
                <div style={{ background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 14px", fontSize: 13, color: COLORS.textMuted }}>
                  {preview ? <>📅 <strong style={{ color: COLORS.text }}>{preview.cuotas} cuotas</strong> · Termina {preview.label}</> : "📅 Ingresá monto y cuota para calcular"}
                </div>
              );
            })()}

            <button type="button" onClick={() => setShowAdvanced(s => !s)} style={{ background: "none", border: "none", color: COLORS.accent, fontWeight: 700, fontSize: 13, cursor: "pointer", textAlign: "left", padding: 0 }}>
              {showAdvanced ? "− Menos opciones" : "+ Más opciones (moneda, interés, vencimiento...)"}
            </button>

            {showAdvanced && (
              <div className="form-pop" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <SegmentedControl
                  options={[{ value: "ars", label: "🇦🇷 ARS" }, { value: "usd", label: "🇺🇸 USD" }]}
                  value={form.currency}
                  onChange={v => setForm({ ...form, currency: v })}
                />
                <Input label="Deuda total original" value={form.total} onChange={v => setForm({ ...form, total: v })} type="amount" prefix={form.currency === "usd" ? "US$" : "$"} placeholder="0" />
                <div className="form-grid-4" style={{ margin: 0 }}>
                  <Input label="Cuotas restantes" value={form.remainingInstallments} onChange={v => {
                    const next = { ...form, remainingInstallments: v };
                    if (!installmentEdited) next.installment = autoInstallment(form.remaining, v);
                    setForm(next);
                  }} type="number" placeholder="Ej: 9" />
                  <Input label="Día de vencimiento" value={form.dueDay} onChange={v => setForm({ ...form, dueDay: v })} type="number" placeholder="1-31" />
                  <Input label="Interés mensual (%)" value={form.interest} onChange={v => setForm({ ...form, interest: v })} type="number" placeholder="0" />
                </div>
              </div>
            )}
          </div>
          <SheetActions onCancel={() => setShowForm(false)} onSave={add} saveLabel="Agregar deuda" />
        </BottomSheet>
      )}

      {data.debts.length === 0 ? (
        <Card style={{ textAlign: "center", padding: 48 }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>🎉</div>
          <div style={{ color: COLORS.textMuted }}>¡Sin deudas registradas! Si tenés, podés agregarlas arriba.</div>
        </Card>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {data.debts.map(d => {
            const pct = d.total > 0 ? Math.min(100, ((d.total - d.remaining) / d.total) * 100) : 0;
            return (
              <Removable key={d.id} onRemove={() => commitDeleteDebt(d.id)}>
              {({ remove, rowClass }) => (
              <Card className={editId === d.id ? "form-pop" : rowClass}>
                {editId === d.id ? (
                  <div style={{ marginBottom: 16 }}>
                    <div style={{ fontWeight: 700, marginBottom: 12, fontSize: 14 }}>✏️ Editar deuda</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                      <input value={editForm.name} onChange={e => setEditForm({ ...editForm, name: e.target.value })} placeholder="Nombre / Acreedor" style={{ background: "#f8faf8", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none" }} />
                      <input type="text" inputMode="numeric" value={editForm.remaining} onChange={e => setEditForm({ ...editForm, remaining: formatAmountInput(e.target.value) })} placeholder="Monto pendiente" style={{ background: "#f8faf8", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none" }} />
                      <input type="text" inputMode="numeric" value={editForm.total} onChange={e => setEditForm({ ...editForm, total: formatAmountInput(e.target.value) })} placeholder="Deuda total original" style={{ background: "#f8faf8", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none" }} />
                      <input type="text" inputMode="numeric" value={editForm.installment} onChange={e => setEditForm({ ...editForm, installment: formatAmountInput(e.target.value) })} placeholder="Cuota mensual" style={{ background: "#f8faf8", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none" }} />
                      <div className="form-grid-4" style={{ margin: 0 }}>
                        <input type="number" value={editForm.remainingInstallments} onChange={e => setEditForm({ ...editForm, remainingInstallments: e.target.value })} placeholder="Cuotas restantes" style={{ background: "#f8faf8", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none" }} />
                        <input type="number" value={editForm.dueDay} onChange={e => setEditForm({ ...editForm, dueDay: e.target.value })} placeholder="Día de vencimiento" style={{ background: "#f8faf8", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none" }} />
                        <input type="number" value={editForm.interest} onChange={e => setEditForm({ ...editForm, interest: e.target.value })} placeholder="Interés mensual (%)" style={{ background: "#f8faf8", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none" }} />
                      </div>
                      <div className="inline-edit-actions">
                        <Button onClick={saveEdit} size="sm">Guardar</Button>
                        <Button onClick={() => setEditId(null)} variant="ghost" size="sm">Cancelar</Button>
                      </div>
                    </div>
                  </div>
                ) : (
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 15 }}>💳 {d.name} {d.currency === "usd" && <Pill color={COLORS.green}>USD</Pill>}</div>
                    <div style={{ fontSize: 12, color: COLORS.textMuted, marginTop: 2 }}>
                      {d.dueDay ? `Vence día ${d.dueDay}` : ""}
                      {d.interest > 0 ? ` · ${d.interest}% mensual` : ""}
                    </div>
                  </div>
                  <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
                    <div style={{ textAlign: "right" }}>
                      <div style={{ fontSize: 22, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif" }}>
                        {d.currency === "usd" ? formatUSD(d.remainingUSD) : formatFull(d.remaining)}
                      </div>
                      <div style={{ fontSize: 12, color: COLORS.textMuted }}>de {d.currency === "usd" ? formatUSD(d.amountUSD) : formatFull(d.total)}</div>
                    </div>
                    <button onClick={() => startEdit(d)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textMuted, fontSize: 14 }}>✏️</button>
                  </div>
                </div>
                )}
                <ProgressBar value={d.total - d.remaining} max={d.total || 1} color={COLORS.accent} height={8} />
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: COLORS.textMuted, marginTop: 6, marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
                  <span style={{ color: COLORS.textMuted }}>{pct.toFixed(0)}% pagado</span>
                  <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                    {d.installment > 0 && <span>Cuota: <strong style={{ color: COLORS.text }}>{formatFull(d.installment)}</strong>/mes</span>}
                    {d.remainingInstallments > 0 && <span>Cuotas restantes: <strong style={{ color: COLORS.text }}>{d.remainingInstallments}</strong></span>}
                  </div>
                </div>
                <div className="inline-edit-actions">
                  <input
                    type="text"
                    inputMode="numeric"
                    value={payAmt[d.id] || ""}
                    onChange={e => setPayAmt({ ...payAmt, [d.id]: formatAmountInput(e.target.value) })}
                    placeholder={d.currency === "usd" ? "Monto a pagar (US$)..." : "Monto a pagar..."}
                    style={{ background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13 }}
                  />
                  <Button onClick={() => pay(d.id)} size="sm">💸 Pagar</Button>
                  <Button onClick={() => { if (confirmDeleteDebt()) remove(); }} variant="danger" size="sm">Eliminar</Button>
                </div>
              </Card>
              )}
              </Removable>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ---- PRÉSTAMOS (dinero prestado a terceros) ----
// Editable desde la web con paridad total con el bot: alta de préstamo/fiado
// (agregar_prestamo / agregar_fiado — préstamo descuenta del balance con una
// transacción de gasto categoría "Préstamos", fiado no), registro de cobros con
// reparto FIFO entre los préstamos activos de la persona (registrar_pago_prestamo:
// transacción de ingreso por lo efectivamente aplicado, el excedente va a
// data.credits como saldo a favor) y edición/borrado de cada registro.
const CURRENCY_OPTS = [{ value: "ars", label: "🇦🇷 ARS" }, { value: "usd", label: "🇺🇸 USD" }];

function Prestamos({ data, save, dolarRate }) {
  const loans = data.loans || [];
  const credits = data.credits || {};
  const rate = dolarRate || 0;

  const emptyForm = { loanType: "prestamo", name: "", reason: "", amount: "", currency: "ars" };
  const [form, setForm] = useState(emptyForm);
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [editForm, setEditForm] = useState({ name: "", reason: "", amount: "", remaining: "" });
  const [payState, setPayState] = useState({});

  const closeForm = () => { setShowForm(false); setForm(emptyForm); };

  const totalPrestado = loans.reduce((s, l) => s + (l.currency === "usd" ? (l.amountUSD || 0) * (dolarRate || l.arsRate || 0) : (l.amount || 0)), 0);
  const totalPendiente = loans.reduce((s, l) => s + (l.currency === "usd" ? ((l.remainingUSD ?? l.amountUSD ?? 0)) * (dolarRate || l.arsRate || 0) : (l.remaining || 0)), 0);

  // ---- alta ----
  const addLoan = () => {
    const name = form.name.trim();
    if (!name) return;
    const isUsd = form.currency === "usd";
    if (isUsd && !rate) { window.alert("Sin cotización del dólar disponible, intentá más tarde."); return; }
    const amountInput = parseAmountInput(form.amount);
    if (amountInput <= 0) return;
    const amountUSD = isUsd ? amountInput : null;
    const amountARS = isUsd ? Math.round(amountInput * rate) : amountInput;
    const reason = form.reason.trim();
    const key = name.toLowerCase();

    const creditsNext = { ...credits };
    let remaining = amountARS;
    if (creditsNext[key] && creditsNext[key].amount > 0) {
      const credito = creditsNext[key].amount;
      if (credito >= remaining) {
        creditsNext[key] = { ...creditsNext[key], amount: credito - remaining };
        save({ ...data, credits: creditsNext });
        window.alert(`${name} tenía un saldo a favor de ${formatFull(credito)}. Este ${form.loanType === "fiado" ? "fiado" : "préstamo"} (${formatFull(remaining)}) queda cubierto con ese saldo.`);
        closeForm();
        return;
      }
      remaining -= credito;
      creditsNext[key] = { ...creditsNext[key], amount: 0 };
    }

    const loanId = crypto.randomUUID();
    const loan = {
      id: loanId, name, reason, amount: remaining, remaining, payments: [],
      loanType: form.loanType, createdAt: todayStr(),
      ...(isUsd ? { currency: "usd", amountUSD } : {}),
    };
    const next = { ...data, credits: creditsNext, loans: [...loans, loan] };
    if (form.loanType === "prestamo") {
      next.categories = catExists(data, "Préstamos") ? data.categories : { ...data.categories, "Préstamos": "🤝" };
      next.transactions = [...(data.transactions || []), {
        id: crypto.randomUUID(), type: "gasto", amount: remaining,
        description: `Préstamo a ${name}${reason ? ` — ${reason}` : ""}`,
        category: "Préstamos", date: todayStr(), loanId,
        ...(isUsd ? { currency: "usd", amountUSD } : {}),
      }];
    }
    save(next);
    closeForm();
  };

  // ---- cobro (reparto FIFO entre los préstamos activos de la persona) ----
  const registrarCobro = (key, personName) => {
    const ps = payState[key] || {};
    const isUsd = ps.currency === "usd";
    if (isUsd && !rate) { window.alert("Sin cotización del dólar disponible, intentá más tarde."); return; }
    const input = parseAmountInput(ps.amount || "0");
    if (input <= 0) return;
    const amountUSD = isUsd ? input : null;
    const amountARS = isUsd ? Math.round(input * rate) : input;

    let restante = amountARS;
    const loansNext = loans.map(l => {
      if (l.name.toLowerCase() !== key || l.remaining <= 0 || restante <= 0) return l;
      const aplicar = Math.min(l.remaining, restante);
      let usdUpd = {};
      if (l.currency === "usd" && l.amountUSD && isUsd && amountUSD) {
        const paidUSD = Math.min(amountUSD, l.remainingUSD ?? l.amountUSD);
        usdUpd = { remainingUSD: Math.max(0, (l.remainingUSD ?? l.amountUSD) - paidUSD) };
      }
      restante -= aplicar;
      return { ...l, ...usdUpd, remaining: l.remaining - aplicar, payments: [...(l.payments || []), { date: todayStr(), amount: aplicar }] };
    });

    const creditsNext = { ...credits };
    if (restante > 0) creditsNext[key] = { name: personName, amount: (creditsNext[key]?.amount || 0) + restante };
    const pagado = amountARS - Math.max(restante, 0);
    save({
      ...data,
      loans: loansNext,
      credits: creditsNext,
      categories: catExists(data, "Préstamos") ? data.categories : { ...data.categories, "Préstamos": "🤝" },
      transactions: [...(data.transactions || []), {
        id: crypto.randomUUID(), type: "ingreso", amount: pagado,
        description: `Cobro préstamo — ${personName}`, category: "Préstamos", date: todayStr(),
        ...(isUsd && amountUSD ? { currency: "usd", amountUSD } : {}),
      }],
    });
    setPayState({ ...payState, [key]: { amount: "", currency: ps.currency || "ars" } });
  };

  // ---- edición / borrado ----
  const startEdit = (l) => {
    setEditId(l.id);
    const isUsd = l.currency === "usd";
    setEditForm({
      name: l.name,
      reason: l.reason || "",
      amount: formatAmountInput(String(isUsd ? (l.amountUSD || 0) : (l.amount || 0))),
      remaining: formatAmountInput(String(isUsd ? (l.remainingUSD ?? l.amountUSD ?? 0) : (l.remaining ?? l.amount ?? 0))),
    });
  };
  const saveEdit = () => {
    if (!editForm.name.trim()) return;
    const loansNext = loans.map(l => {
      if (l.id !== editId) return l;
      const isUsd = l.currency === "usd";
      const r = dolarRate || l.arsRate || 0;
      const amtVal = parseAmountInput(editForm.amount);
      const remVal = parseAmountInput(editForm.remaining);
      const upd = { ...l, name: editForm.name.trim(), reason: editForm.reason.trim() };
      if (isUsd) {
        upd.amountUSD = amtVal; upd.remainingUSD = remVal;
        upd.amount = Math.round(amtVal * r); upd.remaining = Math.round(remVal * r);
      } else {
        upd.amount = amtVal; upd.remaining = remVal;
      }
      return upd;
    });
    save({ ...data, loans: loansNext });
    setEditId(null);
  };
  const del = (id) => { if (window.confirm("¿Eliminar este préstamo?")) save({ ...data, loans: loans.filter(l => l.id !== id) }); };
  const clearCredit = (k) => {
    if (!window.confirm("¿Poner en cero este saldo a favor?")) return;
    const creditsNext = { ...credits };
    if (creditsNext[k]) creditsNext[k] = { ...creditsNext[k], amount: 0 };
    save({ ...data, credits: creditsNext });
  };

  // agrupar préstamos por persona conservando el orden de aparición
  const groups = [];
  const gIdx = {};
  loans.forEach(l => {
    const k = l.name.toLowerCase();
    if (gIdx[k] === undefined) { gIdx[k] = groups.length; groups.push({ key: k, name: l.name, loans: [] }); }
    groups[gIdx[k]].loans.push(l);
  });

  const inputStyle = { background: "#f8faf8", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none" };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <Card style={{ padding: "12px 20px" }}>
            <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", marginBottom: 4 }}>Total prestado</div>
            <div style={{ fontSize: 22, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif" }}>{formatFull(totalPrestado)}</div>
          </Card>
          <Card style={{ padding: "12px 20px" }}>
            <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", marginBottom: 4 }}>Total pendiente</div>
            <div style={{ fontSize: 22, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif" }}>{formatFull(totalPendiente)}</div>
          </Card>
        </div>
        <Button onClick={() => setShowForm(true)}>+ Nuevo préstamo / fiado</Button>
      </div>

      {showForm && (
        <BottomSheet title="Nuevo préstamo / fiado" onClose={closeForm}>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <SegmentedControl label="Tipo" options={[{ value: "prestamo", label: "Préstamo" }, { value: "fiado", label: "Fiado" }]} value={form.loanType} onChange={v => setForm({ ...form, loanType: v })} />
            <Input label="Persona" value={form.name} onChange={v => setForm({ ...form, name: v })} placeholder="Ej: Juan" />
            <Input label="Motivo (opcional)" value={form.reason} onChange={v => setForm({ ...form, reason: v })} placeholder="Ej: para el auto" />
            <SegmentedControl label="Moneda" options={CURRENCY_OPTS} value={form.currency} onChange={v => setForm({ ...form, currency: v })} />
            <Input label="Monto" value={form.amount} onChange={v => setForm({ ...form, amount: v })} type="amount" decimals={form.currency === "usd"} prefix={form.currency === "usd" ? "US$" : "$"} placeholder="0" />
            <div style={{ background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 14px", fontSize: 12.5, color: COLORS.textMuted }}>
              {form.loanType === "fiado"
                ? "El fiado no descuenta de tu balance (fue mercadería o servicio)."
                : "El préstamo se registra como gasto y descuenta de tu balance."}
              {form.currency === "usd" && rate > 0 && parseAmountInput(form.amount) > 0 && <> {" · ≈ "}{formatFull(Math.round(parseAmountInput(form.amount) * rate))}</>}
            </div>
          </div>
          <SheetActions onCancel={closeForm} onSave={addLoan} saveLabel="Agregar" />
        </BottomSheet>
      )}

      {groups.length === 0 ? (
        <Card style={{ textAlign: "center", padding: 48 }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>🤝</div>
          <div style={{ color: COLORS.textMuted }}>No tenés préstamos registrados.</div>
        </Card>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {groups.map(g => {
            const pendiente = g.loans.reduce((s, l) => s + (l.remaining || 0), 0);
            const ps = payState[g.key] || { amount: "", currency: "ars" };
            return (
              <Card key={g.key}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10 }}>
                  <div style={{ fontWeight: 700, fontSize: 15 }}>🤝 {g.name}</div>
                  <div style={{ fontSize: 13, color: COLORS.textMuted }}>Pendiente {formatFull(pendiente)}</div>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {g.loans.map(l => {
                    const isUsd = l.currency === "usd";
                    const amount = isUsd ? (l.amountUSD || 0) : (l.amount || 0);
                    const remaining = isUsd ? (l.remainingUSD ?? l.amountUSD ?? 0) : (l.remaining ?? l.amount ?? 0);
                    const fmt = isUsd ? formatUSD : formatFull;
                    const pct = amount > 0 ? Math.min(100, ((amount - remaining) / amount) * 100) : 0;
                    if (editId === l.id) {
                      return (
                        <div key={l.id} className="form-pop" style={{ borderTop: `1px solid ${COLORS.border}`, paddingTop: 10 }}>
                          <div style={{ fontWeight: 700, marginBottom: 8, fontSize: 13 }}>✏️ Editar {l.loanType === "fiado" ? "fiado" : "préstamo"}</div>
                          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                            <input value={editForm.name} onChange={e => setEditForm({ ...editForm, name: e.target.value })} placeholder="Persona" style={inputStyle} />
                            <input value={editForm.reason} onChange={e => setEditForm({ ...editForm, reason: e.target.value })} placeholder="Motivo" style={inputStyle} />
                            <input type="text" inputMode="numeric" value={editForm.amount} onChange={e => setEditForm({ ...editForm, amount: formatAmountInput(e.target.value) })} placeholder={isUsd ? "Monto original (US$)" : "Monto original"} style={inputStyle} />
                            <input type="text" inputMode="numeric" value={editForm.remaining} onChange={e => setEditForm({ ...editForm, remaining: formatAmountInput(e.target.value) })} placeholder={isUsd ? "Pendiente (US$)" : "Pendiente"} style={inputStyle} />
                            <div style={{ display: "flex", gap: 8, marginTop: 2 }}>
                              <Button onClick={saveEdit} size="sm">Guardar</Button>
                              <Button onClick={() => setEditId(null)} variant="soft" size="sm">Cancelar</Button>
                            </div>
                          </div>
                        </div>
                      );
                    }
                    return (
                      <div key={l.id} style={{ borderTop: `1px solid ${COLORS.border}`, paddingTop: 10 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                          <div>
                            <div style={{ fontSize: 13, fontWeight: 600 }}>
                              {l.loanType === "fiado" ? <Pill color={COLORS.gold}>Fiado</Pill> : <Pill color={COLORS.accent}>Préstamo</Pill>} {isUsd && <Pill color={COLORS.green}>USD</Pill>}
                            </div>
                            {l.reason && <div style={{ fontSize: 12, color: COLORS.textMuted, marginTop: 3 }}>{l.reason}</div>}
                          </div>
                          <div style={{ textAlign: "right" }}>
                            <div style={{ fontSize: 17, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif" }}>{fmt(remaining)}</div>
                            <div style={{ fontSize: 11, color: COLORS.textMuted }}>de {fmt(amount)}</div>
                          </div>
                        </div>
                        <div style={{ marginTop: 8 }}><ProgressBar value={amount - remaining} max={amount || 1} color={COLORS.accent} height={7} /></div>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 8 }}>
                          <span style={{ fontSize: 11, color: COLORS.textMuted }}>{pct.toFixed(0)}% cobrado</span>
                          <div style={{ display: "flex", gap: 4 }}>
                            <button onClick={() => startEdit(l)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.accent, fontSize: 13, fontWeight: 600, padding: 4 }}>Editar</button>
                            <button onClick={() => del(l.id)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textDim, fontSize: 16, padding: 4 }}>✕</button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
                {pendiente > 0 && (
                  <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 8, marginTop: 12, borderTop: `1px solid ${COLORS.border}`, paddingTop: 12 }}>
                    <select value={ps.currency || "ars"} onChange={e => setPayState({ ...payState, [g.key]: { ...ps, currency: e.target.value } })} style={{ ...inputStyle, padding: "7px 8px" }}>
                      <option value="ars">$</option>
                      <option value="usd">US$</option>
                    </select>
                    <input
                      type="text" inputMode="numeric"
                      value={ps.amount || ""}
                      onChange={e => setPayState({ ...payState, [g.key]: { ...ps, amount: formatAmountInput(e.target.value) } })}
                      placeholder="Monto cobrado"
                      style={{ ...inputStyle, flex: 1, minWidth: 120 }}
                    />
                    <Button onClick={() => registrarCobro(g.key, g.name)} size="sm">💵 Registrar cobro</Button>
                  </div>
                )}
              </Card>
            );
          })}
        </div>
      )}

      {Object.values(credits).filter(c => c.amount > 0).length > 0 && (
        <Card>
          <div style={{ fontWeight: 700, marginBottom: 12, fontSize: 15 }}>💰 Saldo a favor</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {Object.entries(credits).filter(([, c]) => c.amount > 0).map(([k, c]) => (
              <div key={k} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13 }}>
                <span style={{ color: COLORS.textMuted }}>{c.name}</span>
                <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontWeight: 600 }}>{formatFull(c.amount)}</span>
                  <button onClick={() => clearCredit(k)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textDim, fontSize: 15, padding: 2 }}>✕</button>
                </span>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
}

// ---- GASTOS FIJOS ----
// Editable desde la web con el mismo esquema que escribe el bot:
// data.recurringExpenses[] = { id, description, amount, category, day, active }.
// Alta sin transacción (igual que agregar_gasto_fijo); baja = active:false.
function GastosFijos({ data, save }) {
  const items = (data.recurringExpenses || []).filter(g => g.active !== false);
  const total = items.reduce((s, g) => s + (g.amount || 0), 0);
  const catNames = Object.keys(data.categories || {});
  const emptyForm = { description: "", amount: "", category: catNames[0] || "Otros", day: "1" };
  const [form, setForm] = useState(emptyForm);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);

  const closeForm = () => { setShowForm(false); setEditingId(null); setForm(emptyForm); };
  const startEdit = (g) => {
    setForm({ description: g.description || "", amount: formatAmountInput(String(g.amount || 0)), category: g.category || catNames[0] || "Otros", day: String(g.day || 1) });
    setEditingId(g.id);
    setShowForm(true);
  };
  const submit = () => {
    const amount = parseAmountInput(form.amount);
    if (!form.description.trim() || amount <= 0) return;
    const day = Math.min(31, Math.max(1, parseInt(form.day) || 1));
    const list = data.recurringExpenses || [];
    if (editingId) {
      save({ ...data, recurringExpenses: list.map(g => g.id === editingId ? { ...g, description: form.description.trim(), amount, category: form.category, day } : g) });
    } else {
      save({ ...data, recurringExpenses: [...list, { id: crypto.randomUUID(), description: form.description.trim(), amount, category: form.category, day, active: true }] });
    }
    closeForm();
  };
  const del = (id) => {
    if (!window.confirm("¿Eliminar este gasto fijo?")) return;
    save({ ...data, recurringExpenses: (data.recurringExpenses || []).map(g => g.id === id ? { ...g, active: false } : g) });
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <Card style={{ padding: "12px 20px" }}>
          <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", marginBottom: 4 }}>Total mensual</div>
          <div style={{ fontSize: 22, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif" }}>{formatFull(total)}</div>
        </Card>
        <Button onClick={() => setShowForm(true)}>+ Nuevo gasto fijo</Button>
