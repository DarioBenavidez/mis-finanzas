  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- Versiones pinneadas (antes @18 / sin pin): un deploy nuevo del CDN no puede
       cambiar el runtime bajo los pies ni romper el sitio sin aviso. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Menta pálido más saturado que el gris-verdoso original (#F2F7F5), calcado
       del "piso" de contenido bajo el header verde en la app real (Expo). */
    html, body { background: #E9F6F0; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #E9F6F0; }
    ::-webkit-scrollbar-thumb { background: #C8DDD6; border-radius: 3px; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    /* El outline nativo de foco del navegador no sigue el border-radius de los
       botones (se ve como una raya rectangular sobre esquinas redondeadas).
       Se quita para click con mouse y se restaura solo para navegación con
       teclado (:focus-visible), así no se pierde accesibilidad. */
    button { outline: none; -webkit-appearance: none; appearance: none; }
    button:focus-visible { outline: 2px solid #005247; outline-offset: 2px; }
    /* Foco de teclado visible en TODOS los campos: varios inputs traen
       outline:none inline, así que el :focus-visible va con !important para
       pisarlo solo cuando el foco viene del teclado. */
    input:focus-visible, select:focus-visible, textarea:focus-visible,
    [tabindex]:not([tabindex="-1"]):focus-visible {
      outline: 2px solid #005247 !important; outline-offset: 1px; border-radius: 6px;
    }
    [role="dialog"]:focus-visible { outline: none !important; }

    /* ── Sistema de movimiento: una sola curva/escala de duración para toda la
       app, en vez de valores sueltos (.15s / .2s / .4s) repartidos por el código.
       "fast" = feedback inmediato (hover, tap), "base" = cambio de estado de
       rutina (mostrar/ocultar, listas), "layout" = overlay/panel entrando. La
       curva de salida usa un ease-in simétrico para que cerrar se sienta tan
       intencional como abrir, solo que más rápido. */
    :root {
      --ease-standard: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in: cubic-bezier(0.4, 0, 1, 1);
      --dur-fast: 140ms;
      --dur-base: 200ms;
      --dur-layout: 300ms;
    }

    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes rowExit { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.97); } }
    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes overlayOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes modalOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(8px) scale(.97); } }

    /* Filas/cards de listas (transacciones, categorías, ahorros, deudas): entran
       con fade+slide sutil apenas se montan (alta nueva o primer render de
       página), salen con fade+scale antes de desmontarse (ver componente
       Removable en el script). */
    .row-enter { animation: fadeSlideIn var(--dur-base) var(--ease-standard); }
    .row-exit { animation: rowExit var(--dur-fast) var(--ease-in) forwards; pointer-events: none; }

    /* Formularios de alta/edición que se expanden inline dentro de una lista
       (nueva categoría, nueva meta, nueva deuda, editar transacción, etc.). */
    .form-pop { animation: fadeSlideIn var(--dur-base) var(--ease-standard); transform-origin: top; }

    /* Cambio de tab (Inicio ⇄ Análisis ⇄ Perfil): el contenido nuevo entra con
       fade+slide; no hay salida animada porque el tab anterior se desmonta al
       instante (React solo renderiza uno a la vez), pero la entrada alcanza
       para que no se sienta como un corte brusco. */
    .tab-fade { animation: fadeSlideIn var(--dur-layout) var(--ease-standard); }

    /* Overlay a pantalla completa (PanelModal) y modal de Conectar WhatsApp:
       el fondo se desvanece y la card/panel entra con una leve translación +
       escala. Al cerrar, un estado "closing" en React aplica las variantes
       *Out durante --dur-fast antes de desmontar (ver hook useClosable). */
    .overlay-anim { animation: overlayIn var(--dur-layout) var(--ease-standard); }
    .overlay-anim.is-closing { animation: overlayOut var(--dur-fast) var(--ease-in) forwards; }
    .modal-anim { animation: modalIn var(--dur-layout) var(--ease-standard); }
    .modal-anim.is-closing { animation: modalOut var(--dur-fast) var(--ease-in) forwards; }

    /* ── Bottom sheet: identidad pinneada de los formularios "Nueva X" de la app
       real (Deudas, Transacciones, Ahorros, Turnos, Eventos, Categorías) — sube
       desde abajo con barrita de agarre y esquinas superiores muy redondeadas en
       mobile. Reemplaza el patrón anterior de sección inline expandida dentro
       del panel. Desde 1024px no tiene sentido un bottom sheet pegado al piso
       de un monitor: pasa a ser un modal centrado con las 4 esquinas redondeadas
       (mismo criterio que ya se usó en panel-card/LoginScreen). */
    @keyframes sheetSlideIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes sheetSlideOut { from { transform: translateY(0); } to { transform: translateY(100%); } }
    .sheet-overlay { position: fixed; inset: 0; background: #0D1F1C73; z-index: 220; display: flex; align-items: flex-end; justify-content: center; }
    .sheet-card { background: #FFFFFF; width: 100%; max-width: 560px; border-radius: 28px 28px 0 0; max-height: 88vh; overflow-y: auto; box-shadow: 0 -8px 40px #00000030; animation: sheetSlideIn var(--dur-layout) var(--ease-standard); }
    .sheet-card.sheet-closing { animation: sheetSlideOut var(--dur-fast) var(--ease-in) forwards; }
    .sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: #D8E8E1; margin: 10px auto 2px; flex-shrink: 0; }
    .sheet-header { font-size: 21px; font-weight: 800; padding: 14px 24px 4px; color: #0D1F1C; letter-spacing: -.3px; }

    /* ── Chat con Orbe: captura rápida de gastos (barra del header, panel, overlay mobile) ── */
    .orbe-chat { display: flex; flex-direction: column; height: 100%; min-height: 0; background: #E9F6F0; }
    .orbe-chat-msgs { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: #C8DDD6 transparent; }
    .orbe-chat-bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px; font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .orbe-chat-bubble.user { align-self: flex-end; background: #005247; color: #fff; border-bottom-right-radius: 5px; }
    .orbe-chat-bubble.bot { align-self: flex-start; background: #fff; color: #0D1F1C; box-shadow: 0 1px 3px rgba(0,40,34,.10); border-bottom-left-radius: 5px; }
    .orbe-chat-bubble.is-error { background: #FFF1F2; color: #7F1D2D; }
    .orbe-retry { display: block; margin-top: 8px; background: #fff; color: #9F1239; border: 1px solid #F3B7C0; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 13px; font-family: inherit; cursor: pointer; }
    .orbe-retry:hover { background: #FFE4E8; }
    .orbe-dots { display: inline-flex; align-items: center; gap: 4px; height: 20px; }
    .orbe-dots i { width: 6px; height: 6px; border-radius: 50%; background: #4A6B62; opacity: .35; animation: orbe-dot 1.1s ease-in-out infinite; }
    .orbe-dots i:nth-child(2) { animation-delay: .15s; } .orbe-dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes orbe-dot { 0%, 70%, 100% { opacity: .3; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-3px); } }
    /* Movimientos anotados por el bot: filas dentro de la misma burbuja (sin tarjeta anidada) */
    .orbe-rcpt-list { margin-top: 9px; border-top: 1px solid #E1EEE8; }
    .orbe-rcpt { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #EEF5F1; animation: orbe-rcpt-in .22s cubic-bezier(.16,1,.3,1); }
    .orbe-rcpt:last-child { border-bottom: none; padding-bottom: 2px; }
    @keyframes orbe-rcpt-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .orbe-rcpt-ico { width: 34px; height: 34px; border-radius: 10px; background: #DCEEE3; display: grid; place-items: center; font-size: 17px; }
    .orbe-rcpt-main { display: flex; flex-direction: column; min-width: 0; }
    .orbe-rcpt-main b { font-size: 13.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .orbe-rcpt-main i { font-style: normal; font-size: 12px; color: #4A6B62; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .orbe-rcpt-side { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
    .orbe-rcpt-side b { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .orbe-rcpt-side b.out { color: #BE123C; } .orbe-rcpt-side b.in { color: #047857; }
    .orbe-rcpt-side i { font-style: normal; font-size: 12px; color: #4A6B62; }
    .orbe-rcpt-side button { position: relative; background: none; border: none; padding: 3px 0 0; font-weight: 700; font-size: 12.5px; font-family: inherit; color: #005247; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
    .orbe-rcpt-side button:hover { color: #002f28; }
    .orbe-rcpt-side button::after { content: ""; position: absolute; inset: -14px -12px; } /* área táctil ~44px sin mover nada */
    .orbe-rcpt.is-undone { opacity: .55; } .orbe-rcpt.is-undone .orbe-rcpt-main b, .orbe-rcpt.is-undone .orbe-rcpt-side b { text-decoration: line-through; }
    /* Pie del chat: atajos, aviso de voz y campo */
    .orbe-chat-foot { flex-shrink: 0; background: #fff; border-top: 1px solid #C8DDD6; }
    .orbe-starters { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 0; }
    .orbe-starters button { height: 32px; padding: 0 13px; border: none; border-radius: 999px; background: #DCEEE3; color: #005247; font-weight: 700; font-size: 13px; font-family: inherit; cursor: pointer; transition: background .15s; }
    .orbe-starters button:hover { background: #CBE5D7; }
    .orbe-voicehint { display: flex; align-items: center; gap: 8px; margin: 10px 14px 0; padding: 8px 12px; border-radius: 12px; background: #FBF4DC; color: #5C4710; font-size: 13px; font-weight: 600; }
    .orbe-err { margin: 8px 14px 0; font-size: 12.5px; font-weight: 600; color: #BE123C; }
    .orbe-chat-composer { display: flex; align-items: center; gap: 8px; padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
    .orbe-chat-composer input { flex: 1; min-width: 0; height: 46px; border: 1px solid #C8DDD6; border-radius: 999px; padding: 0 18px; font-family: inherit; font-size: 16px; background: #E9F6F0; color: #0D1F1C; outline: none; transition: border-color .15s, box-shadow .15s, background .15s; }
    .orbe-chat-composer input::placeholder { color: #4A6B62; }
    .orbe-chat-composer input:focus { border-color: #005247; background: #fff; box-shadow: 0 0 0 3px rgba(0,82,71,.14); }
    .orbe-chat-composer input:disabled { opacity: .7; }
    .orbe-chat-composer button { width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; transition: background .15s, transform .12s; }
    .orbe-chat-composer button:active { transform: scale(.94); }
    .orbe-chat-composer button.mic { background: #DCEEE3; color: #005247; }
    .orbe-chat-composer button.mic:hover { background: #CBE5D7; }
    .orbe-chat-composer button.send { background: #005247; color: #fff; }
    .orbe-chat-composer button.send:hover { background: #003d34; }
    .orbe-chat-composer button.send:disabled { background: #C8DDD6; color: #fff; cursor: default; }
    .chat-overlay { position: fixed; inset: 0; z-index: 160; background: #E9F6F0; display: flex; flex-direction: column; }
    .chat-overlay-header { flex-shrink: 0; background: #005247; color: #fff; padding: 8px 12px; display: flex; align-items: center; gap: 8px; min-height: 56px; }
    .chat-overlay-header button { width: 40px; height: 40px; border-radius: 50%; border: none; background: transparent; color: #fff; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
    .chat-overlay-header button:hover { background: rgba(255,255,255,.14); }
    .chat-overlay-header .orbe-linkbtn { width: auto; height: 36px; padding: 0 12px; border-radius: 999px; font-weight: 700; font-size: 13px; font-family: inherit; }
    /* Barra en el header verde (escritorio): translúcida en reposo, blanca al escribir */
    .chatbar-wrap { position: relative; flex: 1 1 auto; max-width: 560px; min-width: 0; margin: 0 24px; }
    .chatbar-pill { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 5px 0 14px; border-radius: 999px; color: #fff;
      background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22); transition: background .16s, border-color .16s, color .16s, box-shadow .16s; }
    .chatbar-pill:hover { background: rgba(255,255,255,0.2); }
    .chatbar-pill:focus-within, .chatbar-pill.is-open { background: #fff; border-color: #fff; color: #005247; box-shadow: 0 0 0 3px rgba(255,255,255,.28); }
    .chatbar-pill input { flex: 1; min-width: 0; background: none; border: none; color: inherit; font-family: inherit; font-size: 14px; font-weight: 600; }
    .chatbar-pill input, .chatbar-pill input:focus, .chatbar-pill input:focus-visible { outline: none !important; box-shadow: none !important; }
    .chatbar-pill input::placeholder { color: rgba(255,255,255,0.84); font-weight: 500; }
    .chatbar-pill:focus-within input, .chatbar-pill.is-open input { color: #0D1F1C; }
    .chatbar-pill:focus-within input::placeholder, .chatbar-pill.is-open input::placeholder { color: #4A6B62; }
    .chatbar-btn { width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent; color: inherit; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; transition: background .15s; }
    .chatbar-btn:hover { background: rgba(255,255,255,0.18); }
    .chatbar-pill:focus-within .chatbar-btn:hover, .chatbar-pill.is-open .chatbar-btn:hover { background: #DCEEE3; }
    .chatbar-btn.send { background: #C9A84C; color: #2b2205; }
    .chatbar-btn.send:hover { background: #D6B65C; }
    .chatbar-btn.send:disabled { background: rgba(255,255,255,0.16); color: rgba(255,255,255,0.7); cursor: default; }
    .chatbar-pill:focus-within .chatbar-btn.send:disabled, .chatbar-pill.is-open .chatbar-btn.send:disabled { background: #E1EEE8; color: #7C968E; }
    .chatbar-btn.is-rec, .orbe-chat-composer button.mic.is-rec { background: #E11D48; color: #fff; animation: chatbar-pulse 1.1s ease-in-out infinite; }
    @keyframes chatbar-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(225,29,72,.5); } 50% { box-shadow: 0 0 0 7px rgba(225,29,72,0); } }
    .chatbar-pop { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: #fff; border-radius: 16px; box-shadow: 0 18px 44px rgba(0,0,0,.22), 0 2px 6px rgba(0,0,0,.10); overflow: hidden; display: flex; flex-direction: column; max-height: min(560px, calc(100vh - 88px)); z-index: 120; animation: chatbar-in .18s cubic-bezier(.16,1,.3,1); }
    @keyframes chatbar-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .chatbar-pop-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 8px 10px 16px; border-bottom: 1px solid #E1EEE8; flex-shrink: 0; }
    .chatbar-pop-head div:first-child { display: flex; flex-direction: column; min-width: 0; }
    .chatbar-pop-head b { font-size: 14px; font-weight: 800; color: #0D1F1C; }
    .chatbar-pop-head span { font-size: 12px; color: #4A6B62; }
    .chatbar-pop-actions { display: flex; align-items: center; gap: 2px; }
    .chatbar-pop .chatbar-btn { color: #4A6B62; } .chatbar-pop .chatbar-btn:hover { background: #E9F6F0; color: #0D1F1C; }
    .orbe-linkbtn { background: none; border: none; color: #005247; font-weight: 700; font-size: 13px; font-family: inherit; padding: 6px 10px; border-radius: 999px; cursor: pointer; }
    .orbe-linkbtn:hover { background: #E9F6F0; }
    .chatbar-pop .orbe-chat-msgs { min-height: 150px; }
    .chatbar-pop .orbe-voicehint { margin-bottom: 12px; }
    .chatbar-pop .orbe-starters { padding: 10px 14px 12px; border-top: 1px solid #E1EEE8; }
    /* Píldora del header en mobile */
    .chatpill { flex: 1 1 auto; min-width: 0; margin: 0 10px; display: flex; align-items: center; height: 38px; border-radius: 999px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.24); color: #fff; }
    .chatpill-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 6px 0 13px; background: none; border: none; color: rgba(255,255,255,0.92); font-family: inherit; font-size: 13.5px; font-weight: 600; text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; }
    .chatpill .chatbar-btn { width: 34px; height: 34px; margin-right: 2px; }
    @media (max-width: 599px) { .topbar-user-txt { display: none !important; } }
    @media (prefers-reduced-motion: reduce) { .orbe-dots i, .orbe-rcpt, .chatbar-pop, .chatbar-btn.is-rec, .orbe-chat-composer button.mic.is-rec { animation: none !important; } .orbe-dots i { opacity: .7; } }
    @media (min-width: 1024px) {
      .boceto-panel.orbe-chat-host { display: flex; flex-direction: column; padding: 0 !important; overflow: hidden; min-height: 560px; max-height: calc(100vh - 140px); }
    }
    .sheet-body { padding: 16px 24px 24px; }
    @media (min-width: 1024px) {
      .sheet-overlay { align-items: center; padding: 40px; }
      .sheet-card { border-radius: 24px; max-height: 85vh; animation: modalIn var(--dur-layout) var(--ease-standard); }
      .sheet-card.sheet-closing { animation: modalOut var(--dur-fast) var(--ease-in) forwards; }
      .sheet-handle { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ── Layout responsive: app shell mobile-first, sidebar persistente desde 1024px ── */
    /* tabular-nums para toda la app logueada: es una app de plata, casi todo
       número es una cifra que se compara o se actualiza en vivo (balance,
       totales de categoría, cuotas, listas). Con figuras de ancho fijo los
       montos no "bailan" al cambiar de mes o al editar. `font-variant-numeric`
       se hereda, así que esto alcanza para paneles, sheets y modales (todos
       cuelgan de .app-shell). Auth y landing quedan afuera a propósito. */
    .app-shell { display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
    .app-main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar-inner { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 16px; height: 56px; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; }
    /* Mobile: marca más chica y nombre/email acotados para que quepa el bloque de usuario. */
    @media (max-width: 1023px) {
      .topbar-brand img { width: 92px !important; }
      .topbar-user-txt span { max-width: 124px !important; }
    }
    .content-area { flex: 1; width: 100%; overflow-y: auto; max-width: 720px; margin: 0 auto; padding: 20px 16px 110px; box-sizing: border-box; }
    .inicio-layout { display: flex; flex-direction: column; gap: 16px; }
    .inicio-primary { display: flex; flex-direction: column; gap: 16px; }
    .inicio-rail { display: flex; flex-direction: column; gap: 16px; }
    /* 3 columnas fijas en mobile (como antes); desde 1024px pasa a auto-fill
       para aprovechar el ancho completo sin quedar en una columna angosta. */
    .inicio-shortcuts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .inicio-upcoming { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .panel-card { width: 100%; }

    /* Grid de formularios de alta con varios campos ("Nueva meta de ahorro",
       "Nueva deuda"): 1 columna en mobile angosto (~360-412px Android), 2
       desde 640px, y las 4 originales recién desde 1024px. Antes eran grids
       fijos de 4 columnas sin adaptar, así que en mobile los campos quedaban
       apretados e ilegibles. Nombre genérico porque lo comparten Ahorros y
       Deudas (antes era ".ahorros-form-grid", solo para Ahorros). */
    .form-grid-4 { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 12px; }
    @media (min-width: 640px) {
      .form-grid-4 { grid-template-columns: 1fr 1fr; }
    }

    /* Filas de input + botones en una sola línea (edición inline de categoría
       en Presupuesto y de meta en Ahorros; fila de pagar/eliminar deuda en
       Deudas): flex-wrap para que los botones no queden cortados en
       pantallas angostas. Si hay un input compartiendo la fila, usa una base
       chica en vez de flex:1 para no empujar los botones fuera del viewport. */
    .inline-edit-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .inline-edit-actions input { flex: 1 1 140px; min-width: 0; }

    @media (min-width: 1024px) {
      /* !important: pisa el display:flex inline que estos elementos usan en mobile */
      .bottom-nav { display: none !important; }
      .mobile-fab { display: none !important; }

      .topbar { justify-content: flex-end; }
      .content-area { max-width: 1160px; padding: 32px 40px 40px; }
      .narrow-col { max-width: 720px; margin: 0 auto; }
      /* Inicio se queda apilado en una sola columna a todos los anchos: la card de
         Balance quedaba más angosta que Transacciones de abajo cuando el rail de
         accesos rápidos vivía al costado en un grid de 2 columnas — todo comparte
         el mismo borde izq./der. así. Con más ancho disponible, los accesos
         rápidos y las cards de turnos/vencimientos aprovechan el espacio extra. */
      .inicio-shortcuts { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .inicio-upcoming { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
      .panel-overlay { display: flex; align-items: center; justify-content: center; padding: 40px; background: #0D1F1CCC !important; }
      .panel-card { max-width: 640px; max-height: 85vh; border-radius: 20px; overflow-y: auto; background: #F2F7F5; box-shadow: 0 24px 64px #00000030; }
      .panel-card-header { border-radius: 20px 20px 0 0; }
      .form-grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

      /* ── Vista "boceto": es TODA la vista de escritorio (las 3 tabs). ── */
      .app-shell.boceto-on .topbar { justify-content: space-between; }
      .app-shell.boceto-on .topbar-brand { display: flex !important; }
      .app-shell.boceto-on .content-area {
        max-width: 1680px; padding: 0 clamp(28px, 4vw, 72px);
        /* El contenido no scrollea a nivel página: cada columna del boceto tiene
           su propio scroll, así la izquierda NO se mueve al cambiar de sección. */
        overflow: hidden;
      }
      /* La barra superior alinea su contenido (logo, Análisis/WhatsApp, avatar)
         con el mismo margen que el resto de la página. */
      .topbar-inner { max-width: 1680px; padding: 0 clamp(28px, 4vw, 72px); }
      .topbar-nueva {
        display: flex; align-items: center; gap: 7px; background: #C9A84C; color: #2b2205;
        border: none; border-radius: 999px; padding: 9px 16px; font-family: inherit;
        font-weight: 800; font-size: 12.5px; cursor: pointer; white-space: nowrap;
      }
      .topbar-user { transition: background .15s; }
      .topbar-user:hover { background: rgba(255,255,255,0.1); }
      /* En pantallas medianas el nombre/email se ocultan y queda solo la foto. */
      @media (min-width: 1024px) and (max-width: 1200px) { .topbar-user-txt { display: none !important; } }
      /* Análisis / WhatsApp en la barra de arriba (reemplazan al grupo "Cuenta"
         del rail izquierdo). */
      .topbar-nav { display: flex; gap: 4px; margin-left: 20px; }

        font-size: 13px; padding: 7px 12px; border-radius: 8px; cursor: pointer;
        white-space: nowrap; transition: background .15s, color .15s;
      }

      /* Altura fija = viewport menos el topbar. Las dos columnas scrollean solas. */
      /* El saludo va en una fila propia que abarca las dos columnas, así la card
         de balance (izq) y la primera card del panel (der) quedan alineadas. */
      .boceto { display: grid; grid-template-columns: 316px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 6px 32px; align-items: stretch; height: calc(100vh - 56px); padding-top: 12px; box-sizing: border-box; }
      .boceto-head { grid-column: 1 / -1; font-size: 13px; color: #4A6B62; display: grid; grid-template-columns: 316px minmax(0, 1fr); align-items: center; column-gap: 32px; }
      @media (max-width: 1160px) { .header-anuncio { display: none !important; } }
      .boceto-col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
      .boceto-hi { font-size: 13px; color: #4A6B62; flex-shrink: 0; }
      .boceto-balance {
        background: linear-gradient(155deg, #005247 0%, #00332c 100%); color: #fff;
        border-radius: 20px; padding: 20px 22px; box-shadow: 0 16px 34px -18px rgba(13,31,28,0.4);
        flex-shrink: 0;

      .boceto-balance .split span { display: flex; align-items: center; gap: 6px; color: #ffffffdd; }
      .boceto-balance .split .d { width: 7px; height: 7px; border-radius: 50%; flex: none; }
      .boceto-nav { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; min-height: 0; padding-right: 5px; padding-bottom: 20px; }
      .boceto-navgroup { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #6E8B82; padding: 14px 4px 4px; }

      /* Inicio (panorama estilo dashboard) usa una grilla de cards de 3 columnas
         y necesita más ancho que los paneles de sección normales. */
      .boceto-panel.boceto-panel--wide { max-width: 1180px; }
      .boceto-panel::-webkit-scrollbar { width: 8px; }
      .boceto-panel::-webkit-scrollbar-thumb { background: #cfe4db; border-radius: 999px; }

         línea de 1px entre ellas. Esquinas redondeadas solo en el marco exterior. */
      .panorama-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #C8DDD6; border: 1px solid #C8DDD6; border-radius: 16px; overflow: hidden; }
      @media (max-width: 1180px) { .panorama-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

       la pantalla, igual que en la app (header verde fijo + card crema que
       "sube" con las esquinas superiores muy redondeadas). Desde 640px no tiene
       sentido estirar eso a lo ancho/alto de un monitor, así que la identidad
       (verde arriba, crema abajo, mismos botones) se contiene en una card
       centrada de ancho máximo razonable con esquinas redondeadas en las 4

       que React Native renderiza con la fuente del sistema (Roboto en Android,
