      {showForm && (
        <BottomSheet title={editingId ? "Editar gasto fijo" : "Nuevo gasto fijo"} onClose={closeForm}>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <Input label="Nombre" value={form.description} onChange={v => setForm({ ...form, description: v })} placeholder="Ej: Alquiler, Expensas" />
            <Input label="Monto mensual" value={form.amount} onChange={v => setForm({ ...form, amount: v })} type="amount" prefix="$" placeholder="0" />
            {catNames.length > 0 && <Input label="Categoría" value={form.category} onChange={v => setForm({ ...form, category: v })} options={catNames} />}
            <Input label="Día del mes" value={form.day} onChange={v => setForm({ ...form, day: v })} type="number" placeholder="1-31" />
          </div>
          <SheetActions onCancel={closeForm} onSave={submit} saveLabel={editingId ? "Guardar cambios" : "Agregar"} />
        </BottomSheet>
      )}

      {items.length === 0 ? (
        <Card style={{ textAlign: "center", padding: 48 }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>📌</div>
          <div style={{ color: COLORS.textMuted }}>No tenés gastos fijos registrados.</div>
        </Card>
      ) : (
        <Card style={{ padding: 0, overflow: "hidden" }}>
          {items.map(g => (
            <div key={g.id} style={{ display: "flex", alignItems: "center", padding: "14px 20px", borderBottom: `1px solid ${COLORS.border}`, gap: 12 }}>
              <div style={{ width: 36, height: 36, borderRadius: 10, background: COLORS.accentDim, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>{catIcon(data, g.category)}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 500, fontSize: 14 }}>{g.description}</div>
                <div style={{ fontSize: 12, color: COLORS.textMuted }}>{g.category}{g.day ? ` · día ${g.day}` : ""}</div>
              </div>
              <div style={{ fontWeight: 700, fontSize: 16 }}>{formatFull(g.amount)}</div>
              <button onClick={() => startEdit(g)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.accent, fontSize: 13, fontWeight: 600, padding: 4 }}>Editar</button>
              <button onClick={() => del(g.id)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textDim, fontSize: 16, padding: 4 }}>✕</button>
            </div>
          ))}
        </Card>
      )}
    </div>
  );
}

// ---- SUSCRIPCIONES ----
// Editable desde la web replicando agregar_suscripcion / cancelar_suscripcion del
// bot: el alta/edición crea y sincroniza el gasto fijo "espejo" en
// data.recurringExpenses y (opcional) registra el gasto del mes actual.
function Suscripciones({ data, save }) {
  const items = (data.suscripciones || []).filter(s => s.active !== false);
  const total = items.reduce((s, x) => s + (x.amount || 0), 0);
  const catNames = Object.keys(data.categories || {});
  const emptyForm = { name: "", amount: "", category: "Entretenimiento", day: "1", registerTx: true };
  const [form, setForm] = useState(emptyForm);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);

  const closeForm = () => { setShowForm(false); setEditingId(null); setForm(emptyForm); };
  const startEdit = (s) => {
    setForm({ name: s.name || "", amount: formatAmountInput(String(s.amount || 0)), category: s.category || "Entretenimiento", day: String(s.day || 1), registerTx: false });
    setEditingId(s.id);
    setShowForm(true);
  };

  const submit = () => {
    const amount = parseAmountInput(form.amount);
    const name = form.name.trim();
    if (!name || amount <= 0) return;
    const day = Math.min(31, Math.max(1, parseInt(form.day) || 1));
    const category = form.category || "Entretenimiento";
    const subs = data.suscripciones || [];
    const recs = data.recurringExpenses || [];

    if (editingId) {
      const prev = subs.find(s => s.id === editingId);
      const oldKey = (prev?.name || "").toLowerCase();
      const nextSubs = subs.map(s => s.id === editingId ? { ...s, name, amount, category, day, active: true } : s);
      const nextRecs = recs.map(g => (g.description || "").toLowerCase() === oldKey ? { ...g, description: name, amount, category, day, active: true } : g);
      save({ ...data, suscripciones: nextSubs, recurringExpenses: nextRecs });
      closeForm();
      return;
    }

    const key = name.toLowerCase();
    const existingIdx = subs.findIndex(s => (s.name || "").toLowerCase() === key);
    const hasMirror = recs.some(g => (g.description || "").toLowerCase() === key);
    let nextSubs, nextRecs;
    if (existingIdx !== -1) {
      nextSubs = subs.map((s, i) => i === existingIdx ? { ...s, amount, day, category, active: true } : s);
      nextRecs = recs.map(g => (g.description || "").toLowerCase() === key ? { ...g, amount, category, active: true } : g);
      if (!hasMirror) nextRecs = [...nextRecs, { id: crypto.randomUUID(), description: name, amount, category, day, active: true }];
    } else {
      nextSubs = [...subs, { id: crypto.randomUUID(), name, amount, day, category, active: true }];
      nextRecs = hasMirror ? recs : [...recs, { id: crypto.randomUUID(), description: name, amount, category, day, active: true }];
    }
    const nextData = { ...data, suscripciones: nextSubs, recurringExpenses: nextRecs };
    if (form.registerTx) {
      nextData.transactions = [...(data.transactions || []), { id: crypto.randomUUID(), type: "gasto", amount, description: `Suscripción ${name}`, category, date: todayStr() }];
    }
    save(nextData);
    closeForm();
  };

  const del = (s) => {
    if (!window.confirm(`¿Cancelar la suscripción "${s.name}"?`)) return;
    const key = (s.name || "").toLowerCase();
    save({
      ...data,
      suscripciones: (data.suscripciones || []).map(x => x.id === s.id ? { ...x, active: false } : x),
      recurringExpenses: (data.recurringExpenses || []).map(g => (g.description || "").toLowerCase() === key ? { ...g, active: false } : g),
    });
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <Card style={{ padding: "12px 20px" }}>
          <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", marginBottom: 4 }}>Total mensual</div>
          <div style={{ fontSize: 22, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif" }}>{formatFull(total)}</div>
        </Card>
        <Button onClick={() => setShowForm(true)}>+ Nueva suscripción</Button>
      </div>

      {showForm && (
        <BottomSheet title={editingId ? "Editar suscripción" : "Nueva suscripción"} onClose={closeForm}>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <Input label="Nombre" value={form.name} onChange={v => setForm({ ...form, name: v })} placeholder="Ej: Netflix, Spotify" />
            <Input label="Monto mensual" value={form.amount} onChange={v => setForm({ ...form, amount: v })} type="amount" prefix="$" placeholder="0" />
            {catNames.length > 0 && <Input label="Categoría" value={form.category} onChange={v => setForm({ ...form, category: v })} options={catNames} />}
            <Input label="Día del mes" value={form.day} onChange={v => setForm({ ...form, day: v })} type="number" placeholder="1-31" />
            {!editingId && (
              <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: COLORS.textMuted }}>
                <input type="checkbox" checked={form.registerTx} onChange={e => setForm({ ...form, registerTx: e.target.checked })} />
                Registrar el gasto de este mes
              </label>
            )}
          </div>
          <SheetActions onCancel={closeForm} onSave={submit} saveLabel={editingId ? "Guardar cambios" : "Agregar"} />
        </BottomSheet>
      )}

      {items.length === 0 ? (
        <Card style={{ textAlign: "center", padding: 48 }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>📺</div>
          <div style={{ color: COLORS.textMuted }}>No tenés suscripciones registradas.</div>
        </Card>
      ) : (
        <Card style={{ padding: 0, overflow: "hidden" }}>
          {items.map(s => (
            <div key={s.id} style={{ display: "flex", alignItems: "center", padding: "14px 20px", borderBottom: `1px solid ${COLORS.border}`, gap: 12 }}>
              <div style={{ width: 36, height: 36, borderRadius: 10, background: COLORS.accentDim, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>📺</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 500, fontSize: 14 }}>{s.name}</div>
                <div style={{ fontSize: 12, color: COLORS.textMuted }}>{s.category}{s.day ? ` · día ${s.day}` : ""}</div>
              </div>
              <div style={{ fontWeight: 700, fontSize: 16 }}>{formatFull(s.amount)}</div>
              <button onClick={() => startEdit(s)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.accent, fontSize: 13, fontWeight: 600, padding: 4 }}>Editar</button>
              <button onClick={() => del(s)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textDim, fontSize: 16, padding: 4 }}>✕</button>
            </div>
          ))}
        </Card>
      )}
    </div>
  );
}

// ---- TURNOS ----
const TIPOS_TURNO = ["médico", "peluquería", "banco", "trámite", "reunión", "otro"];
const TIPO_ICONS = { "médico": "🩺", "peluquería": "💇", "banco": "🏦", "trámite": "📋", "reunión": "🧑‍💼", "otro": "📌" };

function Turnos({ data, save }) {
  const emptyForm = { description: "", date: todayStr(), time: "", location: "", turnoType: "otro", addToCal: false };
  const [form, setForm] = useState(emptyForm);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);

  const turnos = data.turnos || [];
  const today = todayStr();
  const proximos = turnos.filter(t => t.date >= today).sort((a, b) => a.date.localeCompare(b.date));
  const historial = turnos.filter(t => t.date < today).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);

  const closeForm = () => { setShowForm(false); setEditingId(null); setForm(emptyForm); };

  const startEdit = (t) => {
    setForm({ description: t.description, date: t.date, time: t.time || "", location: t.location || "", turnoType: t.turnoType || "otro", addToCal: false });
    setEditingId(t.id);
    setShowForm(true);
  };

  const save_ = () => {
    if (!form.description || !form.date) return;
    if (editingId) {
      const turnosUpd = turnos.map(t => t.id === editingId ? { ...t, description: form.description, date: form.date, time: form.time, location: form.location, turnoType: form.turnoType } : t);
      save({ ...data, turnos: turnosUpd });
    } else {
      const t = { id: Date.now(), description: form.description, date: form.date, time: form.time, location: form.location, turnoType: form.turnoType, notified: false };
      let events = data.events;
      if (form.addToCal) {
        const day = parseInt(form.date.split("-")[2], 10);
        events = [...events, { id: Date.now() + 1, title: form.description, day, type: "recordatorio", notifyDaysBefore: 1 }];
      }
      save({ ...data, turnos: [...turnos, t], events });
    }
    closeForm();
  };

  const del = (id) => save({ ...data, turnos: turnos.filter(t => t.id !== id) });

  const Row = ({ t }) => (
    <div style={{ display: "flex", alignItems: "center", padding: "14px 20px", borderBottom: `1px solid ${COLORS.border}`, gap: 12 }}>
      <div style={{ width: 36, height: 36, borderRadius: 10, background: COLORS.accentDim, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>{TIPO_ICONS[t.turnoType] || "📌"}</div>
      <div style={{ flex: 1 }}>
        <div style={{ fontWeight: 500, fontSize: 14 }}>{t.description}</div>
        <div style={{ fontSize: 12, color: COLORS.textMuted }}>{t.date}{t.time ? ` · ${t.time}` : ""}{t.location ? ` · ${t.location}` : ""}</div>
      </div>
      <button onClick={() => startEdit(t)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.accent, fontSize: 13, fontWeight: 600, padding: 4 }}>Editar</button>
      <button onClick={() => del(t.id)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textDim, fontSize: 16, padding: 4 }}>✕</button>
    </div>
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <Button onClick={() => setShowForm(true)}>+ Nuevo turno</Button>
      </div>

      {showForm && (
        <BottomSheet title={editingId ? "Editar turno" : "Nuevo turno"} onClose={closeForm}>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <Input label="Descripción" value={form.description} onChange={v => setForm({ ...form, description: v })} placeholder="Ej: Médico clínico, Banco Galicia" />
            <Input label="Fecha (YYYY-MM-DD)" value={form.date} onChange={v => setForm({ ...form, date: v })} type="date" />
            <Input label="Hora (opcional)" value={form.time} onChange={v => setForm({ ...form, time: v })} type="time" />
            <Input label="Lugar (opcional)" value={form.location} onChange={v => setForm({ ...form, location: v })} placeholder="Ej: Av. Corrientes 1234" />
            <SegmentedControl label="Tipo" options={TIPOS_TURNO} value={form.turnoType} onChange={v => setForm({ ...form, turnoType: v })} />
            {!editingId && (
              <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: COLORS.textMuted }}>
                <input type="checkbox" checked={form.addToCal} onChange={e => setForm({ ...form, addToCal: e.target.checked })} />
                Agregar al calendario
              </label>
            )}
          </div>
          <SheetActions onCancel={closeForm} onSave={save_} saveLabel={editingId ? "Guardar cambios" : "Guardar"} />
        </BottomSheet>
      )}

      <Card style={{ padding: 0, overflow: "hidden" }}>
        <div style={{ padding: "16px 20px", borderBottom: `1px solid ${COLORS.border}`, fontWeight: 700, fontSize: 15 }}>Próximos</div>
        {proximos.length === 0 ? (
          <div style={{ padding: 32, textAlign: "center", color: COLORS.textMuted }}>Sin turnos próximos.</div>
        ) : proximos.map(t => <Row key={t.id} t={t} />)}
      </Card>

      {historial.length > 0 && (
        <Card style={{ padding: 0, overflow: "hidden" }}>
          <div style={{ padding: "16px 20px", borderBottom: `1px solid ${COLORS.border}`, fontWeight: 700, fontSize: 15 }}>Historial</div>
          {historial.map(t => <Row key={t.id} t={t} />)}
        </Card>
      )}
    </div>
  );
}

// ---- CALENDARIO ----
const EVENT_TYPES = {
  vencimiento: { label: "Vencimiento 📋", color: "#e53935" },
  pago: { label: "Pago 💳", color: "#4aba82" },
  recordatorio: { label: "Recordatorio 🔔", color: "#005247" },
};
// El tipo de evento puede venir de la app móvil o del bot con un valor que la
// web todavía no conoce: sin este fallback, indexar EVENT_TYPES[type] devuelve
// undefined y .color/.label revientan toda la app (no hay dato de ejemplo, es
// data real compartida). Nunca acceder EVENT_TYPES[x] directo con x de datos.
const eventType = (t) => EVENT_TYPES[t] || { label: "Evento", color: "#5E7D74" };

function Calendario({ data, save }) {
  const emptyForm = { title: "", day: "1", type: "vencimiento", notifyDaysBefore: "3" };
  const [form, setForm] = useState(emptyForm);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [payingId, setPayingId] = useState(null);
  const [payAmt, setPayAmt] = useState("");

  const events = data.events || [];
  const daysInMonth = new Date(data.selectedYear, data.selectedMonth + 1, 0).getDate();
  const todayDate = new Date();
  const isCurrentMonth = todayDate.getMonth() === data.selectedMonth && todayDate.getFullYear() === data.selectedYear;
  const todayDay = todayDate.getDate();

  const closeForm = () => { setShowForm(false); setEditingId(null); setForm(emptyForm); };

  const startEdit = (ev) => {
    setForm({ title: ev.title, day: String(ev.day), type: ev.type, notifyDaysBefore: String(ev.notifyDaysBefore || 3) });
    setEditingId(ev.id);
    setShowForm(true);
  };

  const save_ = () => {
    if (!form.title || !form.day) return;
    const day = Math.min(daysInMonth, Math.max(1, parseInt(form.day) || 1));
    if (editingId) {
      const updated = events.map(e => e.id === editingId ? { ...e, title: form.title, day, type: form.type, notifyDaysBefore: parseInt(form.notifyDaysBefore) || 3 } : e);
      save({ ...data, events: updated });
    } else {
      const ev = { id: Date.now(), title: form.title, day, type: form.type, notifyDaysBefore: parseInt(form.notifyDaysBefore) || 3 };
      save({ ...data, events: [...events, ev] });
    }
    closeForm();
  };

  const del = (id) => save({ ...data, events: events.filter(e => e.id !== id) });

  const confirmPago = (ev) => {
    const amt = parseAmountInput(payAmt || 0);
    if (!amt) return;
    const preferred = ev.type === "pago" ? "Servicios" : "Otros";
    const cat = findCatCI(data, preferred) || Object.keys(data.categories)[0];
    const transactions = [...data.transactions, { id: Date.now(), type: "gasto", description: ev.title, amount: amt, category: cat, date: todayStr() }];
    save({ ...data, transactions, events: events.filter(e => e.id !== ev.id) });
    setPayingId(null);
    setPayAmt("");
  };

  const grouped = Object.keys(EVENT_TYPES).map(type => ({ type, items: events.filter(e => e.type === type).sort((a, b) => a.day - b.day) }));

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <Button onClick={() => setShowForm(true)}>+ Nuevo evento</Button>
      </div>

      {showForm && (
        <BottomSheet title={editingId ? "Editar evento" : "Nuevo evento"} onClose={closeForm}>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <Input label="Título" value={form.title} onChange={v => setForm({ ...form, title: v })} placeholder="Ej: Vencimiento luz" />
            <Input label="Día del mes" value={form.day} onChange={v => setForm({ ...form, day: v })} type="number" placeholder={`1-${daysInMonth}`} />
            <SegmentedControl
              label="Tipo"
              options={Object.entries(EVENT_TYPES).map(([key, v]) => ({ value: key, label: v.label }))}
              value={form.type}
              onChange={v => setForm({ ...form, type: v })}
            />
            <Input label="Notificar por WhatsApp (días antes)" value={form.notifyDaysBefore} onChange={v => setForm({ ...form, notifyDaysBefore: v })} type="number" placeholder="3" />
          </div>
          <SheetActions onCancel={closeForm} onSave={save_} saveLabel={editingId ? "Guardar cambios" : "Guardar"} />
        </BottomSheet>
      )}

      {/* Grilla del mes */}
      <Card>
        <div style={{ fontWeight: 700, marginBottom: 14, fontSize: 15 }}>{MONTH_NAMES[data.selectedMonth]} {data.selectedYear}</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6 }}>
          {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(day => {
            const dayEvents = events.filter(e => e.day === day);
            const isToday = isCurrentMonth && day === todayDay;
            return (
              <div key={day} style={{
                aspectRatio: "1", borderRadius: 8, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                background: isToday ? COLORS.accent : dayEvents.length > 0 ? (eventType(dayEvents[0].type).color + "22") : COLORS.bg,
                border: isToday ? "none" : `1px solid ${COLORS.border}`, fontSize: 12, gap: 2,
              }}>
                <span style={{ color: isToday ? "#fff" : COLORS.text, fontWeight: isToday ? 700 : 400 }}>{day}</span>
                {dayEvents.length > 0 && (
                  <div style={{ display: "flex", gap: 2 }}>
                    {dayEvents.slice(0, 3).map(e => <div key={e.id} style={{ width: 5, height: 5, borderRadius: "50%", background: isToday ? "#fff" : eventType(e.type).color }} />)}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </Card>

      {/* Próximos a vencer */}
      {isCurrentMonth && (() => {
        const proximos = events.filter(e => e.day - todayDay >= 0 && e.day - todayDay <= 7);
        return proximos.length > 0 ? (
          <InfoBanner>
            ⏰ {proximos.map(e => `${e.title} vence en ${e.day - todayDay === 0 ? "hoy" : `${e.day - todayDay} día(s)`}`).join(" · ")}
          </InfoBanner>
        ) : null;
      })()}

      {/* Listas agrupadas */}
      {grouped.map(g => g.items.length > 0 && (
        <Card key={g.type} style={{ padding: 0, overflow: "hidden" }}>
          <div style={{ padding: "16px 20px", borderBottom: `1px solid ${COLORS.border}`, fontWeight: 700, fontSize: 15, color: eventType(g.type).color }}>{eventType(g.type).label}</div>
          {g.items.map(ev => (
            <div key={ev.id} style={{ padding: "14px 20px", borderBottom: `1px solid ${COLORS.border}` }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 500, fontSize: 14 }}>{ev.title}</div>
                  <div style={{ fontSize: 12, color: COLORS.textMuted }}>Día {ev.day}</div>
                </div>
                {(g.type === "vencimiento" || g.type === "pago") && (
                  <Button size="sm" onClick={() => { setPayingId(ev.id); setPayAmt(""); }}>💸 Pagar</Button>
                )}
                <button onClick={() => startEdit(ev)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.accent, fontSize: 13, fontWeight: 600, padding: 4 }}>Editar</button>
                <button onClick={() => del(ev.id)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textDim, fontSize: 16, padding: 4 }}>✕</button>
              </div>
              {payingId === ev.id && (
                <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                  <input type="text" inputMode="numeric" value={payAmt} onChange={e => setPayAmt(formatAmountInput(e.target.value))} placeholder="Monto pagado..." autoFocus
                    style={{ flex: 1, background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13 }} />
                  <Button size="sm" onClick={() => confirmPago(ev)}>Confirmar</Button>
                  <Button size="sm" variant="ghost" onClick={() => setPayingId(null)}>Cancelar</Button>
                </div>
              )}
            </div>
          ))}
        </Card>
      ))}
    </div>
  );
}

// ---- PROYECCIÓN 12 MESES ----
function Proyeccion({ data, save }) {
  const now = new Date();
  const startMonth = now.getMonth();
  const startYear = now.getFullYear();
  const [expandido, setExpandido] = useState(null);
  const [showOverrideForm, setShowOverrideForm] = useState(false);
  const [overrideForm, setOverrideForm] = useState({ month: startMonth, year: startYear, amount: "" });

  const recurringIncomes = data.recurringIncomes || [];
  const salaryOverrides = data.salaryOverrides || [];

  // Promedio de ingresos (ingreso + sueldo) de los últimos 3 meses
  const avgIncome = (() => {
    const totals = [];
    for (let i = 0; i < 3; i++) {
      let m = startMonth - i; let y = startYear;
      if (m < 0) { m += 12; y--; }
      const inc = data.transactions
        .filter(t => isIncomeType(t) && parseDateParts(t.date).month === m && parseDateParts(t.date).year === y)
        .reduce((s, t) => s + t.amount, 0);
      if (inc > 0) totals.push(inc);
    }
    return totals.length > 0 ? totals.reduce((a, b) => a + b, 0) / totals.length : 0;
  })();

  // Ingreso de un mes dado: usa el override vigente más reciente, si no el promedio.
  const getIncome = (m, y) => {
    const applicable = salaryOverrides
      .filter(o => o.fromYear < y || (o.fromYear === y && o.fromMonth <= m))
      .sort((a, b) => (b.fromYear - a.fromYear) || (b.fromMonth - a.fromMonth));
    return applicable.length > 0 ? applicable[0].amount : avgIncome;
  };

  const addOverride = () => {
    if (!overrideForm.amount) return;
    const ov = { fromMonth: parseInt(overrideForm.month), fromYear: parseInt(overrideForm.year), amount: parseAmountInput(overrideForm.amount) };
    save({ ...data, salaryOverrides: [...salaryOverrides, ov] });
    setOverrideForm({ month: startMonth, year: startYear, amount: "" });
    setShowOverrideForm(false);
  };
  const delOverride = (i) => save({ ...data, salaryOverrides: salaryOverrides.filter((_, idx) => idx !== i) });
  const delRecurringIncome = (id) => save({ ...data, recurringIncomes: recurringIncomes.filter(r => r.id !== id) });

  // Categorías de presupuesto con límite > 0
  const budgetItems = data.budgets.filter(b => b.limit > 0);
  const budgetTotal = budgetItems.reduce((s, b) => s + b.limit, 0);
  const gastosFijosTotal = (data.recurringExpenses || []).filter(g => g.active !== false).reduce((s, g) => s + (g.amount || 0), 0);

  // Colores para cuotas
  const DEBT_COLORS = ["#5aacbf","#3ecfaa","#f472b6","#fb923c","#3ecfaa","#fbbf24","#22d3ee"];
  const activeDebts = data.debts.filter(d => d.installment > 0 && d.remainingInstallments > 0);

  // Calcular 12 meses
  const months = Array.from({ length: 12 }, (_, i) => {
    const m = (startMonth + i) % 12;
    const y = startYear + Math.floor((startMonth + i) / 12);
    const income = getIncome(m, y);
    const cuotas = activeDebts
      .filter(d => i < d.remainingInstallments)
      .map(d => ({ name: d.name, amount: d.installment, color: DEBT_COLORS[activeDebts.indexOf(d) % DEBT_COLORS.length] }));
    const totalCuotas = cuotas.reduce((s, c) => s + c.amount, 0);
    const totalGasto = budgetTotal + gastosFijosTotal + totalCuotas;
    const balance = income - totalGasto;
    return { m, y, label: MONTH_NAMES[m], year: y, income, cuotas, totalCuotas, budgetTotal, gastosFijosTotal, totalGasto, balance };
  });

  const maxGasto = Math.max(...months.map(mo => mo.totalGasto), avgIncome, 1);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>

      {/* KPIs */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(170px, 1fr))", gap: 14 }}>
        {[
          { label: "Ingreso estimado", value: months[0].income, color: COLORS.text, icon: "📈", sub: avgIncome > 0 || months[0].income !== avgIncome ? "Prom. últimos 3 meses / ajustes" : "Sin ingresos registrados" },
          { label: "Gastos fijos + presup.", value: budgetTotal + gastosFijosTotal, color: COLORS.text, icon: "🏷️", sub: `${budgetItems.length} categorías` },
          { label: "Cuotas este mes", value: months[0].totalCuotas, color: COLORS.text, icon: "💳", sub: `${months[0].cuotas.length} cuota(s)` },
          { label: "Compromiso total", value: months[0].totalGasto, color: COLORS.text, icon: "📊", sub: "Fijos + cuotas" },
          ...(months[0].income > 0 ? [{ label: "Balance estimado", value: months[0].balance, color: COLORS.text, icon: months[0].balance >= 0 ? "✅" : "⚠️", sub: months[0].balance >= 0 ? "Superávit" : "Déficit" }] : []),
        ].map(k => (
          <Card key={k.label} style={{ padding: 18 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px" }}>{k.label}</div>
              <span style={{ fontSize: 18 }}>{k.icon}</span>
            </div>
            <div style={{ fontSize: 22, fontWeight: 300, color: k.color, fontFamily: "'Nunito', sans-serif" }}>{formatFull(k.value)}</div>
            <div style={{ fontSize: 11, color: COLORS.textMuted, marginTop: 4 }}>{k.sub}</div>
          </Card>
        ))}
      </div>

      {/* Tips si faltan datos */}
      {avgIncome === 0 && salaryOverrides.length === 0 && (
        <InfoBanner>💡 Registrá ingresos en <strong>Transacciones</strong> (o un ajuste de sueldo abajo) para ver tu balance mensual estimado.</InfoBanner>
      )}
      {activeDebts.length === 0 && (
        <InfoBanner>💳 Agregá deudas en cuotas en la pestaña <strong>Deudas</strong> (con cuota mensual y cuotas restantes) para verlas en la proyección.</InfoBanner>
      )}

      {/* ─── LÍNEA DE TIEMPO ─── */}
      <Card style={{ padding: 0, overflow: "hidden" }}>
        <div style={{ padding: "18px 22px", borderBottom: `1px solid ${COLORS.border}`, fontWeight: 700, fontSize: 15, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
          <span>📅 Línea de tiempo — 12 meses</span>
          <span style={{ fontSize: 12, color: COLORS.textMuted, fontWeight: 400 }}>Hacé click en un mes para ver el detalle</span>
        </div>

        {/* Leyenda */}
        <div style={{ padding: "12px 22px", borderBottom: `1px solid ${COLORS.border}`, display: "flex", flexWrap: "wrap", gap: 8 }}>
          {(budgetTotal + gastosFijosTotal) > 0 && (
            <span style={{ background: COLORS.accent+"22", color: COLORS.accent, borderRadius: 20, padding: "3px 10px", fontSize: 11, fontWeight: 600 }}>
              🏷️ Fijos + presupuesto ({formatFull(budgetTotal + gastosFijosTotal)})
            </span>
          )}
          {activeDebts.map((d, i) => (
            <span key={d.id} style={{ background: DEBT_COLORS[i % DEBT_COLORS.length]+"22", color: DEBT_COLORS[i % DEBT_COLORS.length], borderRadius: 20, padding: "3px 10px", fontSize: 11, fontWeight: 600 }}>
              💳 {d.name} ({formatFull(d.installment)}/mes · {d.remainingInstallments}c restantes)
            </span>
          ))}
          {avgIncome > 0 && (
            <span style={{ background: COLORS.green+"22", color: COLORS.green, borderRadius: 20, padding: "3px 10px", fontSize: 11, fontWeight: 600 }}>
              📈 Ingreso prom. {formatFull(avgIncome)}
            </span>
          )}
        </div>

        {/* Meses */}
        {months.map((mo, i) => {
          const isHoy = i === 0;
          const abierto = expandido === i;
          const pctTotal = (mo.totalGasto / maxGasto) * 100;
          const pctBudget = ((mo.budgetTotal + mo.gastosFijosTotal) / maxGasto) * 100;
          const isDeficit = mo.income > 0 && mo.balance < 0;

          return (
            <div key={i}>
              {/* Fila principal clickeable */}
              <div
                onClick={() => setExpandido(abierto ? null : i)}
                style={{
                  display: "flex", alignItems: "center", gap: 0,
                  borderBottom: `1px solid ${COLORS.border}`,
                  background: isHoy ? COLORS.accent + "08" : abierto ? "#00000005" : "transparent",
                  cursor: "pointer", transition: "background var(--dur-fast) var(--ease-standard)",
                }}
              >
                {/* Indicador lateral */}
                <div style={{
                  width: 4, alignSelf: "stretch", flexShrink: 0,
                  background: isHoy ? COLORS.accent : isDeficit ? COLORS.red : COLORS.green,
                }} />

                {/* Contenido */}
                <div style={{ flex: 1, padding: "14px 18px", display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" }}>

                  {/* Mes + año */}
                  <div style={{ width: 54, flexShrink: 0 }}>
                    <div style={{ fontSize: 15, fontWeight: 700, color: isHoy ? COLORS.accent : COLORS.text }}>{mo.label}</div>
                    <div style={{ fontSize: 11, color: COLORS.textMuted }}>{mo.year}{isHoy ? " · hoy" : ""}</div>
                  </div>

                  {/* Barra apilada */}
                  <div style={{ flex: 1, minWidth: 120, display: "flex", flexDirection: "column", gap: 5 }}>
                    <div style={{ display: "flex", height: 22, borderRadius: 6, overflow: "hidden", background: COLORS.bg }}>
                      {(mo.budgetTotal + mo.gastosFijosTotal) > 0 && (
                        <div style={{ width: `${pctBudget}%`, background: COLORS.accent, opacity: 0.8, transition: "width var(--dur-layout) var(--ease-standard)" }} />
                      )}
                      {mo.cuotas.map((c) => (
                        <div key={c.name} style={{
                          width: `${(c.amount / maxGasto) * 100}%`,
                          background: c.color, opacity: 0.85,
                          transition: "width var(--dur-layout) var(--ease-standard)",
                        }} />
                      ))}
                    </div>
                    {mo.income > 0 && (
                      <div style={{ position: "relative", height: 2 }}>
                        <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${(mo.income / maxGasto) * 100}%`, background: COLORS.green, borderRadius: 2 }} />
                        <div style={{ position: "absolute", left: 0, top: 0, right: 0, bottom: 0, background: COLORS.bg, borderRadius: 2, zIndex: -1 }} />
                      </div>
                    )}
                  </div>

                  {/* Totales */}
                  <div style={{ width: 140, flexShrink: 0, textAlign: "right" }}>
                    <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.text }}>{formatFull(mo.totalGasto)}</div>
                    {mo.income > 0 && (
                      <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.textMuted, marginTop: 2 }}>
                        {mo.balance >= 0 ? "▲ +" : "▼ "}{formatFull(mo.balance)}
                      </div>
                    )}
                    {mo.cuotas.length > 0 && (
                      <div style={{ fontSize: 10, color: COLORS.textMuted, marginTop: 2 }}>
                        {mo.cuotas.length} cuota{mo.cuotas.length > 1 ? "s" : ""}
                      </div>
                    )}
                  </div>

                  {/* Chevron */}
                  <div style={{ fontSize: 12, color: COLORS.textMuted, width: 16, flexShrink: 0 }}>
                    {abierto ? "▲" : "▼"}
                  </div>
                </div>
              </div>

              {/* Detalle expandido */}
              {abierto && (
                <div style={{ background: "#00000004", borderBottom: `1px solid ${COLORS.border}`, padding: "16px 22px 16px 42px" }}>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8, maxWidth: 500 }}>

                    {budgetItems.length > 0 && (
                      <>
                        <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", marginBottom: 4 }}>
                          🏷️ Presupuesto por categoría
                        </div>
                        {budgetItems.map(b => (
                          <div key={b.cat} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13 }}>
                            <span style={{ color: COLORS.textMuted }}>{catIcon(data, b.cat)} {b.cat}</span>
                            <span style={{ color: COLORS.text, fontWeight: 600 }}>{formatFull(b.limit)}</span>
                          </div>
                        ))}
                      </>
                    )}

                    {gastosFijosTotal > 0 && (
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13, marginTop: budgetItems.length > 0 ? 6 : 0 }}>
                        <span style={{ color: COLORS.textMuted }}>📌 Gastos fijos</span>
                        <span style={{ color: COLORS.text, fontWeight: 600 }}>{formatFull(gastosFijosTotal)}</span>
                      </div>
                    )}

                    {(budgetItems.length > 0 || gastosFijosTotal > 0) && (
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, borderTop: `1px solid ${COLORS.border}`, paddingTop: 8, marginTop: 2 }}>
                        <span style={{ color: COLORS.text, fontWeight: 600 }}>Subtotal fijos</span>
                        <span style={{ color: COLORS.text, fontWeight: 700 }}>{formatFull(mo.budgetTotal + mo.gastosFijosTotal)}</span>
                      </div>
                    )}

                    {mo.cuotas.length > 0 && (
                      <>
                        <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", marginBottom: 4, marginTop: 12 }}>
                          💳 Cuotas activas
                        </div>
                        {mo.cuotas.map((c) => {
                          const debt = activeDebts.find(d => d.name === c.name);
                          return (
                            <div key={c.name} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13 }}>
                              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                <div style={{ width: 10, height: 10, borderRadius: "50%", background: c.color, flexShrink: 0 }} />
                                <span style={{ color: COLORS.textMuted }}>{c.name}</span>
                                <span style={{ fontSize: 10, color: COLORS.textMuted }}>({debt ? debt.remainingInstallments - i : "?"} restantes)</span>
                              </div>
                              <span style={{ color: c.color, fontWeight: 600 }}>{formatFull(c.amount)}</span>
                            </div>
                          );
                        })}
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, borderTop: `1px solid ${COLORS.border}`, paddingTop: 8, marginTop: 2 }}>
                          <span style={{ color: COLORS.text, fontWeight: 600 }}>Subtotal cuotas</span>
                          <span style={{ color: COLORS.text, fontWeight: 700 }}>{formatFull(mo.totalCuotas)}</span>
                        </div>
                      </>
                    )}

                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 15, fontWeight: 700, background: COLORS.bg, borderRadius: 10, padding: "10px 14px", marginTop: 8 }}>
                      <span>Total comprometido</span>
                      <span style={{ color: COLORS.text }}>{formatFull(mo.totalGasto)}</span>
                    </div>

                    {mo.income > 0 && (
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, fontWeight: 700, background: mo.balance >= 0 ? COLORS.greenDim : COLORS.redDim, borderRadius: 10, padding: "10px 14px", border: `1px solid ${mo.balance >= 0 ? COLORS.green : COLORS.red}40` }}>
                        <span style={{ color: COLORS.text }}>
                          {mo.balance >= 0 ? "✅ Te sobra" : "⚠️ Te falta"}
                        </span>
                        <span style={{ color: COLORS.text }}>
                          {mo.balance >= 0 ? "+" : ""}{formatFull(mo.balance)}
                        </span>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </Card>

      {/* Ingresos recurrentes */}
      {recurringIncomes.length > 0 && (
        <Card>
          <div style={{ fontWeight: 700, marginBottom: 12, fontSize: 15 }}>💵 Ingresos recurrentes</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {recurringIncomes.map(r => (
              <div key={r.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13 }}>
                <span style={{ color: COLORS.textMuted }}>{r.name}{r.day ? ` · día ${r.day}` : ""}{r.active === false ? " (inactivo)" : ""}</span>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontWeight: 600 }}>{formatFull(r.amount)}</span>
                  <button onClick={() => delRecurringIncome(r.id)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textDim }}>✕</button>
                </div>
              </div>
            ))}
          </div>
        </Card>
      )}

      {/* Ajustes de sueldo (salaryOverrides) */}
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div style={{ fontWeight: 700, fontSize: 15 }}>📈 Ajustes de ingreso futuro</div>
          <Button size="sm" onClick={() => setShowOverrideForm(!showOverrideForm)}>{showOverrideForm ? "✕ Cancelar" : "+ Nuevo ajuste"}</Button>
        </div>
        <div style={{ fontSize: 12, color: COLORS.textMuted, marginBottom: showOverrideForm || salaryOverrides.length > 0 ? 14 : 0 }}>
          Usá esto si sabés que tu ingreso va a cambiar (ej. aumento) a partir de un mes puntual.
        </div>
        {showOverrideForm && (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr auto", gap: 10, marginBottom: 14, alignItems: "end" }}>
            <Input label="Mes" value={MONTH_NAMES[overrideForm.month]} onChange={v => setOverrideForm({ ...overrideForm, month: MONTH_NAMES.indexOf(v) })} options={MONTH_NAMES} />
            <Input label="Año" value={String(overrideForm.year)} onChange={v => setOverrideForm({ ...overrideForm, year: v })} type="number" />
            <Input label="Ingreso mensual" value={overrideForm.amount} onChange={v => setOverrideForm({ ...overrideForm, amount: v })} type="amount" prefix="$" />
            <Button size="sm" onClick={addOverride}>Guardar</Button>
          </div>
        )}
        {salaryOverrides.length > 0 && (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {salaryOverrides.map((o, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13 }}>
                <span style={{ color: COLORS.textMuted }}>Desde {MONTH_NAMES[o.fromMonth]} {o.fromYear}</span>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontWeight: 600 }}>{formatFull(o.amount)}</span>
                  <button onClick={() => delOverride(i)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textDim }}>✕</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><FinanzasApp /></ErrorBoundary>);

  </script>
</body>
