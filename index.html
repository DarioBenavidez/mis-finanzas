function validatePassword(pw) {
  if (!pw || pw.length < 8) return "La contraseña debe tener al menos 8 caracteres";
  if (!/[A-Z]/.test(pw)) return "Debe incluir al menos una mayúscula";
  if (!/[a-z]/.test(pw)) return "Debe incluir al menos una minúscula";
  if (!/[0-9]/.test(pw)) return "Debe incluir al menos un número";
  if (!/[^A-Za-z0-9]/.test(pw)) return "Debe incluir al menos un carácter especial";
  return null;
}

const formatCurrency = (n) => {
  const abs = Math.abs(n);
  if (abs >= 1000000) return `$${(n/1000000).toFixed(1)}M`;
  if (abs >= 1000) return `$${(n/1000).toFixed(0)}K`;
  return `$${n.toFixed(0)}`;
};

const formatFull = (n) => { const abs = Math.abs(Number(n) || 0); const formatted = abs.toLocaleString("es-AR", { minimumFractionDigits: 0, maximumFractionDigits: 0 }); return ((Number(n) || 0) < 0 ? "-$" : "$") + formatted; };
const formatUSD = (n) => `US$${(Number(n) || 0).toLocaleString("es-AR", { minimumFractionDigits: 0, maximumFractionDigits: 0 })}`;

function Button({ children, onClick, variant = "primary", size = "md", disabled = false, style = {} }) {
  const base = {
    cursor: disabled ? "not-allowed" : "pointer", border: "none", borderRadius: 10, fontFamily: "inherit",
    fontWeight: 600, transition: "all .15s",
    padding: size === "sm" ? "6px 14px" : "10px 20px",
    fontSize: size === "sm" ? 13 : 14,
    opacity: disabled ? 0.6 : 1,
  };
  const variants = {
    primary: { background: COLORS.accent, color: "#ffffff", boxShadow: "none" },
    gold: { background: COLORS.gold, color: "#2b2205", boxShadow: "none" },
    ghost: { background: "transparent", color: COLORS.textMuted, border: `1px solid ${COLORS.border}` },
    danger: { background: "#fff5f5", color: COLORS.red, border: `1px solid #f0c8c8` },
  };
  return <button onClick={disabled ? undefined : onClick} disabled={disabled} style={{ ...base, ...variants[variant], ...style }}>{children}</button>;
}

function Input({ label, value, onChange, type = "text", placeholder, prefix, options, style = {} }) {

        ) : (

  );
}

function ProgressBar({ value, max, color = COLORS.accent, height = 6 }) {
  const pct = max > 0 ? Math.min(100, (value / max) * 100) : 0;
  const barColor = pct > 90 ? COLORS.red : pct > 70 ? "#f59e0b" : color;
  return (
    <div style={{ background: "#e8f0ec", borderRadius: 99, height, overflow: "hidden" }}>
      <div style={{ width: `${pct}%`, height: "100%", background: barColor, borderRadius: 99, transition: "width .4s ease" }} />
    </div>
  );
}

// ---- RESET PASSWORD SCREEN ----
function ResetPasswordScreen({ onDone }) {
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState(false);

  const inputStyle = {
    width: "100%", background: "#f8faf8", border: `1px solid ${COLORS.border}`,
    borderRadius: 10, padding: "11px 14px", color: COLORS.text,
    fontFamily: "inherit", fontSize: 14, outline: "none",
  };

  const handleReset = async () => {
    const pwErr = validatePassword(password);
    if (pwErr) { setError(pwErr); return; }
    if (password !== confirm) { setError("Las contraseñas no coinciden"); return; }
    setError(""); setLoading(true);
    try {
      const { error } = await supabaseClient.auth.updateUser({ password });
      if (error) throw error;
      setSuccess(true);
      setTimeout(() => {
        window.history.replaceState({}, document.title, window.location.pathname);
        onDone();
      }, 2000);
    } catch (e) {
      setError(e.message || "Error al actualizar la contraseña");
    }
    setLoading(false);
  };

  return (
    <div style={{ minHeight: "100vh", background: COLORS.bg, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Nunito', 'DM Sans', sans-serif", padding: 16 }}>
      <div style={{ width: "100%", maxWidth: 400 }}>
        <div style={{ textAlign: "center", marginBottom: 36 }}>
          <div style={{ width: 60, height: 60, borderRadius: 16, background: COLORS.accent, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 28, margin: "0 auto 16px" }}>🔑</div>
          <div style={{ fontFamily: "'Nunito', sans-serif", fontSize: 26, color: COLORS.text, fontWeight: 700 }}>Nueva contraseña</div>
          <div style={{ fontSize: 13, color: COLORS.textMuted, marginTop: 4 }}>Ingresá tu nueva contraseña</div>
        </div>
        <div style={{ background: "#ffffff", borderRadius: 22, padding: 32, border: `1px solid ${COLORS.border}`, boxShadow: "0 4px 24px #00000012" }}>
          {success ? (
            <div style={{ textAlign: "center", padding: "20px 0" }}>
              <div style={{ fontSize: 40, marginBottom: 12 }}>✅</div>
              <div style={{ fontSize: 15, color: COLORS.accent, fontWeight: 600 }}>¡Contraseña actualizada!</div>
              <div style={{ fontSize: 13, color: COLORS.textMuted, marginTop: 6 }}>Redirigiendo al login...</div>
            </div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <div>
                <div style={{ fontSize: 12, color: COLORS.textMuted, fontWeight: 600, marginBottom: 6, textTransform: "uppercase", letterSpacing: ".5px" }}>Nueva contraseña</div>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Mínimo 8 caracteres" style={inputStyle} />
              </div>
              <div>
                <div style={{ fontSize: 12, color: COLORS.textMuted, fontWeight: 600, marginBottom: 6, textTransform: "uppercase", letterSpacing: ".5px" }}>Confirmar contraseña</div>
                <input type="password" value={confirm} onChange={e => setConfirm(e.target.value)} placeholder="Repetí la contraseña" style={inputStyle} onKeyDown={e => e.key === "Enter" && handleReset()} />
              </div>
              {error && <div style={{ background: "#fff5f5", border: "1px solid #f0c8c8", borderRadius: 8, padding: "10px 14px", fontSize: 13, color: COLORS.red }}>{error}</div>}
              <button onClick={handleReset} disabled={loading} style={{ background: loading ? "#c8dcd4" : COLORS.accent, color: "#ffffff", border: "none", borderRadius: 10, padding: "12px", fontFamily: "inherit", fontSize: 15, fontWeight: 700, cursor: loading ? "not-allowed" : "pointer", marginTop: 4 }}>
                {loading ? "Actualizando..." : "Guardar contraseña"}
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [mode, setMode] = useState("login"); // "login" | "register" | "reset"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [nombre, setNombre] = useState("");
  const [apellido, setApellido] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState("");

  const inputStyle = {
    width: "100%", background: "#f8faf8", border: `1px solid ${COLORS.border}`,
    borderRadius: 10, padding: "11px 14px", color: COLORS.text,
    fontFamily: "inherit", fontSize: 14, outline: "none",
  };

  const handleSubmit = async () => {
    setError(""); setSuccess(""); setLoading(true);
    try {
      if (mode === "register") {
        const pwErr = validatePassword(password);
        if (pwErr) throw new Error(pwErr);
        const full_name = [nombre, apellido].filter(Boolean).join(" ");
        const { error } = await supabaseClient.auth.signUp({
          email, password,
          options: { data: { nombre, apellido, full_name } },
        });
        if (error) throw error;
        setSuccess("¡Cuenta creada! Ahora podés iniciar sesión.");
        setMode("login");
      } else if (mode === "reset") {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: "https://dariobenavidez.github.io/mis-finanzas/",
        });
        if (error) throw error;
        setSuccess("¡Listo! Revisá tu email para restablecer la contraseña.");
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        onLogin(data.user);
      }
    } catch (e) {
      setError(e.message || "Error al procesar la solicitud");
    }
    setLoading(false);
  };

  return (
    <div style={{ minHeight: "100vh", background: COLORS.bg, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Nunito', 'DM Sans', sans-serif", padding: 16 }}>
      <div style={{ width: "100%", maxWidth: 400 }}>

          <div style={{ width: 60, height: 60, borderRadius: 16, background: COLORS.accent, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 28, margin: "0 auto 16px" }}>🌐</div>
          <div style={{ fontFamily: "'Nunito', sans-serif", fontSize: 28, color: COLORS.text, fontWeight: 700 }}>Orbe</div>
          <div style={{ fontSize: 13, color: COLORS.textMuted, marginTop: 4 }}>Tu asistente financiero personal</div>
        </div>

        {/* Card */}
        <div style={{ background: "#ffffff", borderRadius: 22, padding: 32, border: `1px solid ${COLORS.border}`, boxShadow: "0 4px 24px #00000012" }}>
          {/* Tabs */}
          <div style={{ display: "flex", marginBottom: 28, background: COLORS.bg, borderRadius: 10, padding: 4 }}>
            {[["login","Iniciar sesión"], ["register","Registrarse"], ["reset","Olvidé clave"]].map(([m, label]) => (
              <button key={m} onClick={() => { setMode(m); setError(""); setSuccess(""); }} style={{
                flex: 1, padding: "8px", borderRadius: 8, border: "none", cursor: "pointer",
                fontFamily: "'Nunito', sans-serif", fontSize: 12, fontWeight: 600, transition: "all .2s",
                background: mode === m ? COLORS.accent : "transparent",
                color: mode === m ? "#ffffff" : COLORS.textMuted,
              }}>
                {label}
              </button>
            ))}
          </div>

          {/* Fields */}
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            {mode === "register" && (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <div>
                  <div style={{ fontSize: 12, color: COLORS.textMuted, fontWeight: 600, marginBottom: 6, textTransform: "uppercase", letterSpacing: ".5px" }}>Nombre</div>
                  <input value={nombre} onChange={e => setNombre(e.target.value)} placeholder="Tu nombre" style={inputStyle} />
                </div>
                <div>
                  <div style={{ fontSize: 12, color: COLORS.textMuted, fontWeight: 600, marginBottom: 6, textTransform: "uppercase", letterSpacing: ".5px" }}>Apellido</div>
                  <input value={apellido} onChange={e => setApellido(e.target.value)} placeholder="Tu apellido" style={inputStyle} />

            )}
            <div>
              <div style={{ fontSize: 12, color: COLORS.textMuted, fontWeight: 600, marginBottom: 6, textTransform: "uppercase", letterSpacing: ".5px" }}>Email</div>
              <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                placeholder="tu@email.com" style={inputStyle}
                onKeyDown={e => e.key === "Enter" && handleSubmit()} />
            </div>
            {mode !== "reset" && (
              <div>
                <div style={{ fontSize: 12, color: COLORS.textMuted, fontWeight: 600, marginBottom: 6, textTransform: "uppercase", letterSpacing: ".5px" }}>Contraseña</div>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                  placeholder={mode === "register" ? "Mín. 8 car., mayús., minús., número y símbolo" : "Tu contraseña"} style={inputStyle}
                  onKeyDown={e => e.key === "Enter" && handleSubmit()} />
              </div>
            )}
            {mode === "reset" && (
              <div style={{ fontSize: 13, color: COLORS.textMuted, background: COLORS.bg, borderRadius: 8, padding: "10px 14px" }}>
                Te enviaremos un email para restablecer tu contraseña.
              </div>
            )}

            {error && <div style={{ background: COLORS.redDim, border: "1px solid #f0c8c8", borderRadius: 8, padding: "10px 14px", fontSize: 13, color: COLORS.red }}>{error}</div>}
            {success && <div style={{ background: COLORS.greenDim, border: `1px solid ${COLORS.green}40`, borderRadius: 8, padding: "10px 14px", fontSize: 13, color: COLORS.green }}>{success}</div>}

            <button onClick={handleSubmit} disabled={loading} style={{
              background: loading ? "#c8dcd4" : COLORS.accent, color: "#ffffff",
              border: "none", borderRadius: 10, padding: "12px", fontFamily: "inherit",
              fontSize: 15, fontWeight: 700, cursor: loading ? "not-allowed" : "pointer",
              marginTop: 4, transition: "all .2s",
            }}>
              {loading ? "Procesando..." : mode === "login" ? "Entrar" : mode === "register" ? "Crear cuenta" : "Enviar email"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

        <button onClick={onClose} style={{ background: "#ffffff22", border: "none", borderRadius: 10, color: "#fff", fontSize: 18, width: 36, height: 36, cursor: "pointer", flexShrink: 0 }}>←</button>

function FinanzasApp() {
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [resetMode, setResetMode] = useState(false);
  const [mainTab, setMainTab] = useState("inicio"); // inicio | analisis | perfil
  const [panel, setPanel] = useState(null); // key de PLAN_PANELS, "transacciones", o null
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [dolarRate, setDolarRate] = useState(null);
  const [waPhone, setWaPhone] = useState(null); // null=sin chequear, false=no vinculado, string=teléfono
  const [waModal, setWaModal] = useState(false);
  const [waCode, setWaCode] = useState("");
  const [waLoading, setWaLoading] = useState(false);
  const [waError, setWaError] = useState("");

  const defaultData = makeDefaultData();

  // Check existing session on mount
  useEffect(() => {
    const hash = window.location.hash;
    if (hash.includes("type=recovery")) {
      setResetMode(true);
      setAuthLoading(false);
      return;
    }

    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      setUser(session?.user || null);
      setAuthLoading(false);
    });
    const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        setResetMode(true);
        setUser(session?.user || null);
      } else {
        setUser(session?.user || null);
        setResetMode(false);
      }
    });
    return () => subscription.unsubscribe();
  }, []);

  // Cotización blue (para ahorros/deudas/préstamos en USD). Best-effort: si el
  // backend no responde o bloquea el origen por CORS, la app sigue funcionando
  // sin conversión USD.
  useEffect(() => {
    fetch(`${BACKEND_URL}/api/dolar`)
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d && d.blue) setDolarRate(d.blue); })
      .catch(() => {});
  }, []);

  // Estado de vinculación con WhatsApp: se lee directo de whatsapp_users (RLS
  // scopeado a auth.uid()), igual que hace la app móvil.
  useEffect(() => {
    if (!user) return;
    supabaseClient.from("whatsapp_users").select("phone, linked_at").eq("user_id", user.id)
      .order("linked_at", { ascending: false })
      .then(({ data: rows }) => setWaPhone(rows?.[0]?.phone || false))
      .catch(() => setWaPhone(false));
  }, [user]);

  const generateWaCode = async () => {
    setWaError(""); setWaLoading(true);
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const resp = await fetch(`${BACKEND_URL}/api/generate-link-code`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${session.access_token}`, "Content-Type": "application/json" },
        body: JSON.stringify({}),
      });
      const body = await resp.json();
      if (resp.ok && body.code) {
        setWaCode(body.code);
        window.open(`https://wa.me/5491125728211?text=${encodeURIComponent("ORBE:" + body.code)}`, "_blank");
      } else {
        setWaError(body.error || "No se pudo generar el código. Probá de nuevo.");
      }
    } catch {
      setWaError("Error de conexión con el backend de Orbe. Probá de nuevo.");
    }
    setWaLoading(false);
  };

  const refreshWaLinked = async () => {
    setWaLoading(true);
    try {
      const { data: rows } = await supabaseClient.from("whatsapp_users").select("phone, linked_at").eq("user_id", user.id).order("linked_at", { ascending: false });
      const phone = rows?.[0]?.phone || null;
      if (phone) { setWaPhone(phone); setWaError(""); }
      else setWaError("Todavía no recibí tu mensaje. Asegurate de enviarlo desde tu WhatsApp.");
    } catch {
      setWaError("No pude verificar. Probá de nuevo.");
    }
    setWaLoading(false);
  };

  useEffect(() => {
    if (!user) return;
    async function load() {
      try {
        const d = await loadData(user.id);
        let next = d || defaultData;
        // Igual que la app: si el mes/año guardado quedó en el pasado, lo
        // adelantamos al actual en vez de mostrar un mes viejo por defecto.
        if (next.selectedYear < currentYear || (next.selectedYear === currentYear && next.selectedMonth < currentMonth)) {
          next = { ...next, selectedMonth: currentMonth, selectedYear: currentYear };
        }
        setData(next);
      } catch {
        setData(defaultData);
      }
      setLoading(false);
    }
    load();
  }, [user]);

  const save = useCallback(async (newData) => {
    setData(newData);
    try { await saveData(user.id, newData); } catch {}
  }, [user]);

  const logout = async () => {
    await supabaseClient.auth.signOut();
    setUser(null);
    setData(null);
    setLoading(true);
  };

  if (authLoading) return (
    <div style={{ minHeight: "100vh", background: COLORS.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ color: COLORS.textMuted, fontFamily: "'Nunito', sans-serif", fontSize: 18 }}>Cargando...</div>
    </div>
  );

  if (resetMode) return <ResetPasswordScreen onDone={() => { setResetMode(false); setUser(null); }} />;

  if (!user) return <LoginScreen onLogin={setUser} />;

  if (loading || !data) return (
    <div style={{ minHeight: "100vh", background: COLORS.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ color: COLORS.textMuted, fontFamily: "'Nunito', sans-serif", fontSize: 18 }}>Cargando tus finanzas...</div>
    </div>
  );

  const displayName = user?.user_metadata?.full_name || [user?.user_metadata?.nombre, user?.user_metadata?.apellido].filter(Boolean).join(" ") || (user?.email || "").split("@")[0];

  const monthTxs = data.transactions.filter(t =>
    new Date(t.date).getMonth() === data.selectedMonth &&
    new Date(t.date).getFullYear() === data.selectedYear
  );
  const totalIncome = monthTxs.filter(isIncomeType).reduce((s, t) => s + t.amount, 0);
  const totalExpense = monthTxs.filter(isExpenseType).reduce((s, t) => s + t.amount, 0);

  const expByCat = {};
  monthTxs.filter(t => t.type === "gasto").forEach(t => {
    expByCat[t.category] = (expByCat[t.category] || 0) + t.amount;
  });

  const totalDebt = data.debts.reduce((s, d) => s + (d.currency === "usd" ? (d.remainingUSD || 0) * (dolarRate || d.arsRate || 0) : d.remaining), 0);
  const totalSavings = data.savings.reduce((s, g) => s + (g.currency === "usd" ? (g.current || 0) * (dolarRate || g.arsRate || 0) : (g.current || 0)), 0);

  const openWa = () => { setWaError(""); setWaCode(""); setWaModal(true); };

  return (
    <div style={{ minHeight: "100vh", background: COLORS.bg, fontFamily: "'Nunito', 'DM Sans', 'Helvetica Neue', sans-serif", color: COLORS.text, display: "flex", flexDirection: "column" }}>
      <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

      {/* ── TOP HEADER (solo marca + mes/año, como el header fijo verde de la app) ── */}
      <div style={{ background: "rgba(242,247,245,0.97)", backdropFilter: "blur(20px)", borderBottom: `1px solid ${COLORS.border}`, padding: "0 20px", boxShadow: "0 1px 8px #00000008", display: "flex", alignItems: "center", justifyContent: "space-between", height: 56, position: "sticky", top: 0, zIndex: 50, flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 32, height: 32, borderRadius: 9, background: COLORS.accent, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15 }}>🌐</div>
          <div style={{ fontFamily: "'Nunito', 'DM Sans', sans-serif", fontSize: 19, color: COLORS.text, fontWeight: 800, letterSpacing: "-.3px" }}>Orbe</div>
        </div>
        <MonthYearPicker selectedMonth={data.selectedMonth} selectedYear={data.selectedYear} onChangeMonth={m => save({ ...data, selectedMonth: m })} onChangeYear={y => save({ ...data, selectedYear: y })} />
      </div>

      {/* ── CONTENIDO: una sola columna centrada, como la app ── */}
      <div style={{ flex: 1, overflowY: "auto", padding: "20px 16px 110px", width: "100%", maxWidth: 720, margin: "0 auto", boxSizing: "border-box" }}>
        {mainTab === "inicio" && <InicioTab data={data} save={save} displayName={displayName} monthTxs={monthTxs} totalIncome={totalIncome} totalExpense={totalExpense} totalDebt={totalDebt} totalSavings={totalSavings} onOpenPanel={setPanel} />}
        {mainTab === "analisis" && <AnalisisTab data={data} />}
        {mainTab === "perfil" && <PerfilTab user={user} displayName={displayName} waPhone={waPhone} onConnectWa={openWa} onLogout={logout} />}
      </div>

      {/* ── BOTTOM NAV estilo app: Inicio / Análisis / + / WhatsApp / Perfil ── */}
      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "rgba(242,247,245,0.97)", backdropFilter: "blur(20px)", borderTop: `1px solid ${COLORS.border}`, boxShadow: "0 -2px 12px #00000010", padding: "8px 4px calc(8px + env(safe-area-inset-bottom))", display: "flex", justifyContent: "space-around", alignItems: "center", zIndex: 60 }}>
        {[["inicio", "Inicio", "🏠"], ["analisis", "Análisis", "📊"]].map(([key, label, icon]) => (
          <button key={key} onClick={() => setMainTab(key)} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "4px 10px" }}>
            <div style={{ fontSize: 20, filter: mainTab === key ? "none" : "grayscale(1) opacity(0.4)", transform: mainTab === key ? "scale(1.1)" : "scale(1)", transition: "all .2s" }}>{icon}</div>
            <div style={{ fontSize: 9, color: mainTab === key ? COLORS.accent : COLORS.textDim, fontWeight: mainTab === key ? 700 : 400 }}>{label}</div>
          </button>
        ))}
        <button onClick={() => setPanel("transacciones")} style={{ background: COLORS.accent, border: "none", borderRadius: "50%", width: 48, height: 48, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", boxShadow: `0 4px 16px ${COLORS.accent}50`, marginTop: -14, flexShrink: 0 }}>
          <span style={{ color: "#fff", fontSize: 24, fontWeight: 700, lineHeight: 1 }}>+</span>
        </button>
        <button onClick={openWa} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "4px 10px" }}>
          <div style={{ fontSize: 20, filter: waPhone ? "none" : "grayscale(1) opacity(0.4)" }}>💬</div>
          <div style={{ fontSize: 9, color: waPhone ? COLORS.green : COLORS.textDim, fontWeight: 600 }}>WhatsApp</div>
        </button>
        <button onClick={() => setMainTab("perfil")} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "4px 10px" }}>
          <div style={{ fontSize: 20, filter: mainTab === "perfil" ? "none" : "grayscale(1) opacity(0.4)", transform: mainTab === "perfil" ? "scale(1.1)" : "scale(1)", transition: "all .2s" }}>👤</div>
          <div style={{ fontSize: 9, color: mainTab === "perfil" ? COLORS.accent : COLORS.textDim, fontWeight: mainTab === "perfil" ? 700 : 400 }}>Perfil</div>
        </button>
      </div>

      {/* ── PANELES pantalla completa (Ahorros, Deudas, Presupuesto, etc.) ── */}
      {panel && (
        <PanelModal title={PANEL_LABELS[panel]} onClose={() => setPanel(null)}>
          {panel === "ahorros" && <Ahorros data={data} save={save} dolarRate={dolarRate} />}
          {panel === "deudas" && <Deudas data={data} save={save} dolarRate={dolarRate} />}
          {panel === "prestamos" && <Prestamos data={data} save={save} dolarRate={dolarRate} />}
          {panel === "turnos" && <Turnos data={data} save={save} />}
          {panel === "calendario" && <Calendario data={data} save={save} />}
          {panel === "proyeccion" && <Proyeccion data={data} save={save} />}
          {panel === "suscripciones" && <Suscripciones data={data} />}
          {panel === "gastosfijos" && <GastosFijos data={data} />}
          {panel === "presupuesto" && <Presupuesto data={data} save={save} expByCat={expByCat} />}
          {panel === "transacciones" && <Transacciones data={data} save={save} monthTxs={monthTxs} startOpen />}
        </PanelModal>
      )}

      {/* ── MODAL: Conectar WhatsApp ── */}
      {waModal && (
        <div onClick={() => setWaModal(false)} style={{ position: "fixed", inset: 0, background: "#00000070", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: "#fff", borderRadius: 22, padding: 28, maxWidth: 420, width: "100%", boxShadow: "0 20px 60px #00000030" }}>
            <div style={{ fontSize: 32, textAlign: "center", marginBottom: 10 }}>💬</div>
            <div style={{ fontWeight: 700, fontSize: 18, textAlign: "center", marginBottom: 6 }}>Conectar WhatsApp</div>
            {waPhone ? (
              <>
                <div style={{ fontSize: 13, color: COLORS.textMuted, textAlign: "center", marginBottom: 20 }}>
                  Tu número <strong style={{ color: COLORS.text }}>{waPhone}</strong> ya está vinculado al bot de Orbe.
                </div>
                <Button onClick={() => setWaModal(false)} style={{ width: "100%" }}>Listo</Button>
              </>
            ) : (
              <>
                <div style={{ fontSize: 13, color: COLORS.textMuted, textAlign: "center", marginBottom: 20 }}>
                  Generá un código, se va a abrir WhatsApp con un mensaje listo para enviar al bot. Apenas lo mandes desde tu teléfono, quedan vinculados.
                </div>
                {waCode && (
                  <div style={{ background: COLORS.accentDim, borderRadius: 10, padding: "10px 14px", fontSize: 13, color: COLORS.accent, textAlign: "center", marginBottom: 14, fontWeight: 600 }}>
                    Código: ORBE:{waCode} — se abrió WhatsApp en otra pestaña.
                  </div>
                )}
                {waError && <div style={{ background: COLORS.redDim, borderRadius: 8, padding: "10px 14px", fontSize: 13, color: COLORS.red, marginBottom: 14 }}>{waError}</div>}
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {!waCode ? (
                    <Button onClick={generateWaCode} disabled={waLoading} style={{ width: "100%" }}>{waLoading ? "Generando..." : "Generar código y abrir WhatsApp"}</Button>
                  ) : (
                    <>
                      <Button onClick={refreshWaLinked} disabled={waLoading} style={{ width: "100%" }}>{waLoading ? "Verificando..." : "Ya lo envié, verificar"}</Button>
                      <Button onClick={generateWaCode} variant="ghost" disabled={waLoading} style={{ width: "100%" }}>Generar otro código</Button>
                    </>
                  )}
                  <Button onClick={() => setWaModal(false)} variant="ghost" style={{ width: "100%" }}>Cerrar</Button>
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function InicioTab({ data, save, displayName, monthTxs, totalIncome, totalExpense, totalDebt, totalSavings, onOpenPanel }) {
  const [hideBalance, setHideBalance] = useState(false);
  const [txFilter, setTxFilter] = useState("mes");
  const [search, setSearch] = useState("");

  const balance = totalIncome - totalExpense;
  const greeting = (() => {
    const h = new Date().getHours();
    if (h < 12) return "Buen día";
    if (h < 20) return "Buenas tardes";
    return "Buenas noches";
  })();

  const totalBudget = data.budgets.reduce((s, b) => s + b.limit, 0);
  const spentThisMonth = monthTxs.filter(t => t.type === "gasto").reduce((s, t) => s + t.amount, 0);

  const today = todayStr();
  const proximosTurnos = (data.turnos || []).filter(t => t.date >= today && !t.cancelled).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3);

  const isCurrentMonth = data.selectedMonth === currentMonth && data.selectedYear === currentYear;
  const todayDay = new Date().getDate();
  const proximosVencimientos = isCurrentMonth ? (data.events || []).filter(e => e.day - todayDay >= 0 && e.day - todayDay <= 7).sort((a, b) => a.day - b.day) : [];

  let filteredTxs;
  if (txFilter === "semana") {
    const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
    filteredTxs = data.transactions.filter(t => new Date(t.date) >= weekAgo);
  } else if (txFilter === "anterior") {
    filteredTxs = data.transactions.filter(t => {
      const d = new Date(t.date);
      return d.getFullYear() < data.selectedYear || (d.getFullYear() === data.selectedYear && d.getMonth() < data.selectedMonth);
    });
  } else {
    filteredTxs = monthTxs;
  }
  if (search.trim()) {
    const q = search.trim().toLowerCase();
    filteredTxs = filteredTxs.filter(t => (t.description || "").toLowerCase().includes(q) || (t.category || "").toLowerCase().includes(q));
  }
  const listTxs = [...filteredTxs].reverse().slice(0, 20);
  const delTx = (id) => save({ ...data, transactions: data.transactions.filter(t => t.id !== id) });

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div>
        <div style={{ fontSize: 13, color: COLORS.textMuted, marginBottom: 2 }}>{greeting},</div>
        <div style={{ fontSize: 20, fontWeight: 700 }}>{displayName}</div>
      </div>

      {/* Hero balance */}
      <div style={{ background: `linear-gradient(135deg, ${COLORS.accent} 0%, #002f28 100%)`, borderRadius: 28, padding: "28px 26px 24px", boxShadow: `0 12px 48px ${COLORS.accent}28`, position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", top: -50, right: -50, width: 200, height: 200, borderRadius: "50%", background: "#ffffff0d", pointerEvents: "none" }} />
        <div style={{ position: "relative", zIndex: 1 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={{ fontSize: 11, color: "#ffffffaa", fontWeight: 700, textTransform: "uppercase", letterSpacing: 1.5 }}>Balance del mes</div>
            <button onClick={() => setHideBalance(!hideBalance)} style={{ background: "none", border: "none", color: "#ffffffaa", cursor: "pointer", fontSize: 15 }}>{hideBalance ? "🙈" : "👁️"}</button>
          </div>
          <div style={{ display: "flex", alignItems: "baseline", gap: 4, marginBottom: 6 }}>
            {hideBalance ? (
              <span style={{ fontSize: 40, fontWeight: 300, color: "#fff", fontFamily: "'Nunito', sans-serif" }}>••••••</span>
            ) : (
              <>
                <span style={{ fontSize: 26, fontWeight: 400, color: "#ffffffcc", fontFamily: "'Nunito', sans-serif" }}>$</span>
                <span style={{ fontSize: 52, fontWeight: 300, color: "#fff", fontFamily: "'Nunito', sans-serif", letterSpacing: -2, lineHeight: 1 }}>{Math.abs(balance).toLocaleString("es-AR", { maximumFractionDigits: 0 })}</span>
              </>
            )}
          </div>
          <div style={{ fontSize: 13, color: "#ffffff70" }}>{MONTH_NAMES[data.selectedMonth]} {data.selectedYear}</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 24, marginTop: 20, paddingTop: 16, borderTop: "1px solid #ffffff18" }}>
            {[["↑ Ingresos", totalIncome], ["↓ Gastos", totalExpense], ["◆ Deudas", totalDebt], ["🐷 Ahorros", totalSavings]].map(([label, val]) => (
              <div key={label}>
                <div style={{ fontSize: 10, color: "#ffffff60", marginBottom: 4, textTransform: "uppercase", letterSpacing: .5 }}>{label}</div>
                <div style={{ fontSize: 16, fontWeight: 300, color: "#fff", fontFamily: "'Nunito', sans-serif" }}>{hideBalance ? "••••" : formatFull(val)}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {totalBudget > 0 && (
        <Card style={{ padding: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: COLORS.textMuted, marginBottom: 8 }}>
            <span>Presupuesto del mes</span>
            <span>{formatFull(spentThisMonth)} / {formatFull(totalBudget)}</span>
          </div>
          <ProgressBar value={spentThisMonth} max={totalBudget} height={8} />
        </Card>
      )}

      {/* Grilla de paneles, igual que el home de la app */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10 }}>

// ---- ANÁLISIS ----
function AnalisisTab({ data }) {
  const months = Array.from({ length: 6 }, (_, i) => {
    let m = currentMonth - 5 + i, y = currentYear;
    if (m < 0) { m += 12; y--; }
    const txs = data.transactions.filter(t => { const d = new Date(t.date); return d.getMonth() === m && d.getFullYear() === y; });
    const inc = txs.filter(isIncomeType).reduce((s, t) => s + t.amount, 0);
    const exp = txs.filter(isExpenseType).reduce((s, t) => s + t.amount, 0);
    return { m, y, label: MONTH_NAMES[m], inc, exp };
  });
  const maxVal = Math.max(...months.flatMap(mo => [mo.inc, mo.exp]), 1);

  const selMonthTxs = data.transactions.filter(t => { const d = new Date(t.date); return d.getMonth() === data.selectedMonth && d.getFullYear() === data.selectedYear; });
  const totalIncome = selMonthTxs.filter(isIncomeType).reduce((s, t) => s + t.amount, 0);
  const totalExpense = selMonthTxs.filter(isExpenseType).reduce((s, t) => s + t.amount, 0);
  const expByCat = {};
  selMonthTxs.filter(t => t.type === "gasto").forEach(t => { expByCat[t.category] = (expByCat[t.category] || 0) + t.amount; });
  const topCats = Object.entries(expByCat).sort((a, b) => b[1] - a[1]);
  const maxCat = Math.max(...topCats.map(([, v]) => v), 1);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ fontSize: 20, fontWeight: 700 }}>Análisis</div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Card style={{ padding: 16 }}>
          <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", marginBottom: 6 }}>Ingresos</div>
          <div style={{ fontSize: 22, fontWeight: 300, color: COLORS.green, fontFamily: "'Nunito', sans-serif" }}>{formatFull(totalIncome)}</div>
        </Card>
        <Card style={{ padding: 16 }}>
          <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", marginBottom: 6 }}>Gastos</div>
          <div style={{ fontSize: 22, fontWeight: 300, color: COLORS.red, fontFamily: "'Nunito', sans-serif" }}>{formatFull(totalExpense)}</div>
        </Card>
      </div>

      <Card>
        <div style={{ fontWeight: 700, marginBottom: 16, fontSize: 15 }}>Últimos 6 meses</div>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 10, height: 140 }}>
          {months.map(mo => (
            <div key={`${mo.m}-${mo.y}`} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, height: "100%" }}>
              <div style={{ flex: 1, display: "flex", alignItems: "flex-end", gap: 3, width: "100%", justifyContent: "center" }}>
                <div style={{ width: 10, height: `${Math.max(4, (mo.inc / maxVal) * 100)}%`, background: COLORS.green, borderRadius: 3 }} />
                <div style={{ width: 10, height: `${Math.max(4, (mo.exp / maxVal) * 100)}%`, background: COLORS.red, borderRadius: 3 }} />
              </div>
              <div style={{ fontSize: 10, color: COLORS.textMuted }}>{mo.label}</div>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 16, marginTop: 14, justifyContent: "center" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: COLORS.textMuted }}><div style={{ width: 8, height: 8, borderRadius: 2, background: COLORS.green }} /> Ingresos</div>
          <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: COLORS.textMuted }}><div style={{ width: 8, height: 8, borderRadius: 2, background: COLORS.red }} /> Gastos</div>
        </div>
      </Card>

      <Card>
        <div style={{ fontWeight: 700, marginBottom: 16, fontSize: 15 }}>🔥 Top gastos — {MONTH_NAMES[data.selectedMonth]} {data.selectedYear}</div>
        {topCats.length === 0 ? (
          <div style={{ color: COLORS.textMuted, fontSize: 13 }}>Sin gastos registrados este mes.</div>
        ) : topCats.map(([cat, amt]) => (
          <div key={cat} style={{ marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6, fontSize: 13 }}>
              <span>{catIcon(data, cat)} {cat}</span>
              <span style={{ color: COLORS.text, fontWeight: 600 }}>{formatFull(amt)}</span>
            </div>
            <ProgressBar value={amt} max={maxCat} color={COLORS.accent} />
          </div>
        ))}
      </Card>
    </div>
  );
}

function PerfilTab({ user, displayName, waPhone, onConnectWa, onLogout }) {
  const [editingName, setEditingName] = useState(false);

  const [apellido, setApellido] = useState(user?.user_metadata?.apellido || "");
  const [nameMsg, setNameMsg] = useState("");
  const [savingName, setSavingName] = useState(false);

  const [changingPw, setChangingPw] = useState(false);
  const [pw1, setPw1] = useState("");
  const [pw2, setPw2] = useState("");
  const [pwMsg, setPwMsg] = useState("");
  const [pwLoading, setPwLoading] = useState(false);

  const saveName = async () => {
    setSavingName(true); setNameMsg("");
    const full_name = [nombre, apellido].filter(Boolean).join(" ");
    const { error } = await supabaseClient.auth.updateUser({ data: { nombre, apellido, full_name } });
    setSavingName(false);
    if (error) { setNameMsg(error.message || "Error al guardar"); return; }
    setNameMsg("¡Guardado!");
    setTimeout(() => { setEditingName(false); setNameMsg(""); }, 1200);
  };

  const changePassword = async () => {
    const err = validatePassword(pw1);
    if (err) { setPwMsg(err); return; }
    if (pw1 !== pw2) { setPwMsg("Las contraseñas no coinciden"); return; }
    setPwLoading(true); setPwMsg("");
    const { error } = await supabaseClient.auth.updateUser({ password: pw1 });
    setPwLoading(false);
    if (error) { setPwMsg(error.message || "Error al actualizar"); return; }
    setPwMsg("¡Contraseña actualizada!");
    setPw1(""); setPw2("");

          {(displayName || "?").charAt(0).toUpperCase()}
        </div>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontWeight: 700, fontSize: 16 }}>{displayName}</div>
          <div style={{ fontSize: 12, color: COLORS.textMuted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{user?.email}</div>
        </div>
      </Card>

      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ fontWeight: 700, fontSize: 14 }}>✏️ Nombre</div>
          {!editingName && <button onClick={() => setEditingName(true)} style={{ background: "none", border: "none", color: COLORS.accent, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Editar</button>}
        </div>
        {editingName && (

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>

              <input value={apellido} onChange={e => setApellido(e.target.value)} placeholder="Apellido" style={{ background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "8px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13 }} />
            </div>
            {nameMsg && <div style={{ fontSize: 12, color: nameMsg.includes("Guardado") ? COLORS.green : COLORS.red }}>{nameMsg}</div>}
            <div style={{ display: "flex", gap: 8 }}>
              <Button size="sm" onClick={saveName} disabled={savingName}>{savingName ? "Guardando..." : "Guardar"}</Button>
              <Button size="sm" variant="ghost" onClick={() => setEditingName(false)}>Cancelar</Button>

          </div>

      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>

// ---- TRANSACCIONES ----
function Transacciones({ data, save, monthTxs, startOpen = false }) {
  const catNames = Object.keys(data.categories);
  const [form, setForm] = useState({ type: "gasto", amount: "", category: catNames[0] || "Otros", description: "", date: todayStr() });
  const [showForm, setShowForm] = useState(startOpen);

  const add = () => {
    if (!form.amount || isNaN(form.amount)) return;
    const tx = { ...form, amount: parseFloat(form.amount), id: Date.now() };
    save({ ...data, transactions: [...data.transactions, tx] });
    setForm({ type: "gasto", amount: "", category: catNames[0] || "Otros", description: "", date: todayStr() });
    setShowForm(false);
  };

  const del = (id) => save({ ...data, transactions: data.transactions.filter(t => t.id !== id) });

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <Button onClick={() => setShowForm(!showForm)}>{showForm ? "✕ Cancelar" : "+ Nueva transacción"}</Button>
      </div>

      {showForm && (
        <Card>
          <div style={{ fontWeight: 700, marginBottom: 16 }}>Nueva transacción</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, marginBottom: 12 }}>
            <Input label="Tipo" value={form.type} onChange={v => setForm({ ...form, type: v })} options={["gasto", "ingreso", "sueldo"]} />
            <Input label="Monto" value={form.amount} onChange={v => setForm({ ...form, amount: v })} type="number" prefix="$" placeholder="0" />
            <Input label="Categoría" value={form.category} onChange={v => setForm({ ...form, category: v })} options={catNames} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
            <Input label="Descripción" value={form.description} onChange={v => setForm({ ...form, description: v })} placeholder="ej. Supermercado" />
            <Input label="Fecha" value={form.date} onChange={v => setForm({ ...form, date: v })} type="date" />
          </div>
          <Button onClick={add}>Guardar transacción</Button>
        </Card>
      )}

      <Card style={{ padding: 0, overflow: "hidden" }}>
        <div style={{ padding: "16px 20px", borderBottom: `1px solid ${COLORS.border}`, fontWeight: 700, fontSize: 15 }}>
          Transacciones — {MONTH_NAMES[data.selectedMonth]} {data.selectedYear}
        </div>
        {monthTxs.length === 0 ? (
          <div style={{ padding: 32, textAlign: "center", color: COLORS.textMuted }}>Sin transacciones este mes. ¡Agregá la primera!</div>
        ) : (
          [...monthTxs].reverse().map(t => (
            <div key={t.id} style={{ display: "flex", alignItems: "center", padding: "14px 20px", borderBottom: `1px solid ${COLORS.border}`, gap: 12 }}>
              <div style={{ width: 36, height: 36, borderRadius: 10, background: isIncomeType(t) ? COLORS.greenDim : COLORS.redDim, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>
                {catIcon(data, t.category)}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 500, fontSize: 14 }}>{t.description || t.category}</div>
                <div style={{ fontSize: 12, color: COLORS.textMuted }}>{t.date} · {t.category}{t.type === "ahorro_meta" ? " · aporte a ahorro" : t.type === "sueldo" ? " · sueldo" : ""}</div>
              </div>
              <div style={{ fontWeight: 700, fontSize: 16, color: isIncomeType(t) ? COLORS.green : COLORS.red }}>
                {isIncomeType(t) ? "+" : "-"}{formatFull(t.amount)}
              </div>
              <button onClick={() => del(t.id)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textDim, fontSize: 16, padding: 4 }}>✕</button>
            </div>
          ))
        )}
      </Card>
    </div>
  );
}

// ---- PRESUPUESTO (incluye gestión de categorías) ----
function Presupuesto({ data, save, expByCat }) {
  const [showCatForm, setShowCatForm] = useState(false);
  const [newCat, setNewCat] = useState({ icon: "📦", name: "" });
  const [editingCat, setEditingCat] = useState(null);
  const [editCat, setEditCat] = useState({ icon: "", name: "" });

  const updateLimit = (cat, val) => {
    const budgets = data.budgets.map(b => b.cat === cat ? { ...b, limit: parseFloat(val) || 0 } : b);
    save({ ...data, budgets });
  };

  const addCategory = () => {
    const name = newCat.name.trim();
    if (!name || data.categories[name]) return;
    const categories = { ...data.categories, [name]: newCat.icon };
    const budgets = [...data.budgets, { cat: name, limit: 0 }];
    save({ ...data, categories, budgets });
    setNewCat({ icon: "📦", name: "" });
    setShowCatForm(false);
  };

  const startEditCat = (name) => { setEditingCat(name); setEditCat({ icon: catIcon(data, name), name }); };

  const saveEditCat = () => {
    const oldName = editingCat;
    const newName = editCat.name.trim();
    if (!newName) return;
    const categories = { ...data.categories };
    delete categories[oldName];
    categories[newName] = editCat.icon;
    const budgets = data.budgets.map(b => b.cat === oldName ? { ...b, cat: newName } : b);
    const transactions = data.transactions.map(t => t.category === oldName ? { ...t, category: newName } : t);
    save({ ...data, categories, budgets, transactions });
    setEditingCat(null);
  };

  const deleteCategory = (name) => {
    const txCount = data.transactions.filter(t => t.category === name).length;
    const msg = txCount > 0
      ? `Eliminar "${name}" dejará ${txCount} transacción(es) sin categoría existente. ¿Continuar?`
      : `¿Eliminar la categoría "${name}"?`;
    if (!window.confirm(msg)) return;
    const categories = { ...data.categories };
    delete categories[name];
    const budgets = data.budgets.filter(b => b.cat !== name);
    save({ ...data, categories, budgets });
  };

  const allCatNames = Array.from(new Set([
    ...Object.keys(data.categories),
    ...data.budgets.filter(b => b.limit > 0).map(b => b.cat),
  ]));
  const totalBudget = data.budgets.reduce((s, b) => s + b.limit, 0);
  const totalSpent = Object.values(expByCat).reduce((s, v) => s + v, 0);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
        <Card>
          <div style={{ fontSize: 12, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", marginBottom: 6 }}>Presupuesto total</div>
          <div style={{ fontSize: 28, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif", letterSpacing: -1 }}>{formatFull(totalBudget)}</div>
        </Card>
        <Card>
          <div style={{ fontSize: 12, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", marginBottom: 6 }}>Gastado este mes</div>
          <div style={{ fontSize: 28, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif", letterSpacing: -1 }}>{formatFull(totalSpent)}</div>
        </Card>
      </div>

      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <div style={{ fontWeight: 700, fontSize: 15 }}>Categorías y límites</div>
          <Button size="sm" onClick={() => setShowCatForm(!showCatForm)}>{showCatForm ? "✕ Cancelar" : "+ Nueva categoría"}</Button>
        </div>

        {showCatForm && (
          <div style={{ background: COLORS.bg, borderRadius: 14, padding: 16, marginBottom: 20, display: "flex", flexDirection: "column", gap: 12 }}>
            <IconPicker value={newCat.icon} onChange={ic => setNewCat({ ...newCat, icon: ic })} />
            <div style={{ display: "flex", gap: 10 }}>
              <input value={newCat.name} onChange={e => setNewCat({ ...newCat, name: e.target.value })} placeholder="Nombre de la categoría" style={{ flex: 1, background: "#fff", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "8px 12px", color: COLORS.text, fontFamily: "inherit", fontSize: 14 }} />
              <Button size="sm" onClick={addCategory}>Agregar</Button>
            </div>
          </div>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
          {allCatNames.map(catName => {
            const b = data.budgets.find(x => x.cat === catName) || { cat: catName, limit: 0 };
            const spent = expByCat[catName] || 0;
            const pct = b.limit > 0 ? Math.min(100, (spent / b.limit) * 100) : 0;
            const isEditing = editingCat === catName;
            return (
              <div key={catName}>
                {isEditing ? (
                  <div style={{ background: COLORS.bg, borderRadius: 12, padding: 14, display: "flex", flexDirection: "column", gap: 10 }}>
                    <IconPicker value={editCat.icon} onChange={ic => setEditCat({ ...editCat, icon: ic })} />
                    <div style={{ display: "flex", gap: 8 }}>
                      <input value={editCat.name} onChange={e => setEditCat({ ...editCat, name: e.target.value })} style={{ flex: 1, background: "#fff", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13 }} />
                      <Button onClick={saveEditCat} size="sm">Guardar</Button>
                      <Button onClick={() => setEditingCat(null)} variant="ghost" size="sm">Cancelar</Button>
                    </div>
                  </div>
                ) : (
                  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <span style={{ fontSize: 20 }}>{catIcon(data, catName)}</span>
                    <div style={{ flex: 1 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                        <span style={{ fontSize: 14, fontWeight: 600 }}>{catName}</span>
                        {b.limit > 0 ? (
                          <span style={{ fontSize: 13, color: COLORS.textMuted }}>{formatFull(spent)} / {formatFull(b.limit)}</span>
                        ) : spent > 0 ? (
                          <span style={{ fontSize: 13, color: COLORS.textMuted }}>Gastado: {formatFull(spent)}</span>
                        ) : (
                          <span style={{ fontSize: 13, color: COLORS.textDim }}>Sin gastos este mes</span>
                        )}
                      </div>
                      {b.limit > 0 && <ProgressBar value={spent} max={b.limit} />}
                    </div>
                    <input
                      type="number"
                      value={b.limit || ""}
                      onChange={e => updateLimit(catName, e.target.value)}
                      placeholder="Límite"
                      style={{ width: 90, background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "5px 8px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, textAlign: "right" }}
                    />
                    <button onClick={() => startEditCat(catName)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textMuted, fontSize: 14 }}>✏️</button>
                    <button onClick={() => deleteCategory(catName)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textDim, fontSize: 14 }}>✕</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

// ---- AHORROS ----
function Ahorros({ data, save, dolarRate }) {
  const [form, setForm] = useState({ name: "", target: "", current: "", currency: "ars" });
  const [addAmt, setAddAmt] = useState({});
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [editForm, setEditForm] = useState({ name: "", target: "" });
  const [fromSalary, setFromSalary] = useState(true);

  const add = () => {
    if (!form.name || !form.target) return;
    const current = parseFloat(form.current) || 0;
    const g = {
      id: Date.now(), name: form.name, target: parseFloat(form.target), current,
      currency: form.currency, arsRate: form.currency === "usd" ? dolarRate : null,
      history: current > 0 ? [{ date: todayStr(), amount: current }] : [],
    };
    let transactions = data.transactions;
    if (current > 0 && fromSalary) {
      const amountARS = form.currency === "usd" ? Math.round(current * (dolarRate || 0)) : current;
      transactions = [...transactions, {
        id: Date.now() + 1, type: "ahorro_meta", description: `Ahorro: ${g.name}`,
        amount: amountARS, category: findCatCI(data, "Otros") || "Otros", date: todayStr(), savingsId: g.id,
        ...(form.currency === "usd" ? { currency: "usd", amountUSD: current } : {}),
      }];
    }
    save({ ...data, savings: [...data.savings, g], transactions });
    setForm({ name: "", target: "", current: "", currency: "ars" });
    setFromSalary(true);
    setShowForm(false);
  };

  const startEdit = (g) => { setEditId(g.id); setEditForm({ name: g.name, target: g.target }); };
  const saveEdit = () => {
    if (!editForm.name || !editForm.target) return;
    const savings = data.savings.map(g => g.id === editId ? { ...g, name: editForm.name, target: parseFloat(editForm.target) } : g);
    save({ ...data, savings });
    setEditId(null);
  };

  const addToSaving = (id) => {
    const amt = parseFloat(addAmt[id] || 0);
    if (!amt) return;
    const savings = data.savings.map(g => g.id === id ? { ...g, current: (g.current || 0) + amt, history: [...(g.history || []), { date: todayStr(), amount: amt }] } : g);
    save({ ...data, savings });
    setAddAmt({ ...addAmt, [id]: "" });
  };

  const del = (id) => { if (window.confirm("¿Eliminar esta meta de ahorro?")) save({ ...data, savings: data.savings.filter(g => g.id !== id) }); };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <Button onClick={() => setShowForm(!showForm)}>{showForm ? "✕ Cancelar" : "+ Nueva meta"}</Button>
      </div>
      {showForm && (
        <Card>
          <div style={{ fontWeight: 700, marginBottom: 16 }}>Nueva meta de ahorro</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 12, marginBottom: 12 }}>
            <Input label="Nombre de la meta" value={form.name} onChange={v => setForm({ ...form, name: v })} placeholder="ej. Vacaciones" />
            <Input label="Moneda" value={form.currency} onChange={v => setForm({ ...form, currency: v })} options={["ars", "usd"]} />
            <Input label="Meta total" value={form.target} onChange={v => setForm({ ...form, target: v })} type="number" prefix={form.currency === "usd" ? "US$" : "$"} placeholder="100000" />
            <Input label="Ya tengo" value={form.current} onChange={v => setForm({ ...form, current: v })} type="number" prefix={form.currency === "usd" ? "US$" : "$"} placeholder="0" />
          </div>
          {parseFloat(form.current) > 0 && (
            <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: COLORS.textMuted, marginBottom: 16 }}>
              <input type="checkbox" checked={fromSalary} onChange={e => setFromSalary(e.target.checked)} />
              Ese monto ya lo desconté de mi sueldo (afecta el balance del mes)
            </label>
          )}
          <Button onClick={add}>Crear meta</Button>
        </Card>
      )}

      {data.savings.length === 0 ? (
        <Card style={{ textAlign: "center", padding: 48 }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>🐷</div>
          <div style={{ color: COLORS.textMuted }}>No tenés metas de ahorro aún.</div>
        </Card>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 16 }}>
          {data.savings.map(g => {
            const pct = g.target > 0 ? Math.min(100, (g.current / g.target) * 100) : 0;
            const remaining = Math.max(0, g.target - g.current);
            const fmt = g.currency === "usd" ? formatUSD : formatFull;
            const arsEquiv = g.currency === "usd" && dolarRate ? Math.round(g.current * dolarRate) : null;
            return (
              <Card key={g.id}>
                {editId === g.id ? (
                  <div style={{ marginBottom: 16 }}>
                    <div style={{ fontWeight: 700, marginBottom: 12, fontSize: 14 }}>✏️ Editar meta</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                      <input value={editForm.name} onChange={e => setEditForm({...editForm, name: e.target.value})} placeholder="Nombre" style={{ background: "#f8faf8", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none" }} />
                      <input type="number" value={editForm.target} onChange={e => setEditForm({...editForm, target: e.target.value})} placeholder="Meta total" style={{ background: "#f8faf8", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none" }} />
                      <div style={{ display: "flex", gap: 8 }}>
                        <Button onClick={saveEdit} size="sm">Guardar</Button>
                        <Button onClick={() => setEditId(null)} variant="ghost" size="sm">Cancelar</Button>
                      </div>
                    </div>
                  </div>
                ) : (
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16 }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 16 }}>{g.name}</div>
                    {g.currency === "usd" && <Pill color={COLORS.green}>USD{arsEquiv ? ` · ≈ ${formatFull(arsEquiv)}` : ""}</Pill>}
                  </div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => startEdit(g)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textMuted, fontSize: 14 }}>✏️</button>
                    <button onClick={() => del(g.id)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textDim }}>✕</button>
                  </div>
                </div>
                )}
                <div style={{ marginBottom: 8 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: COLORS.textMuted, marginBottom: 8 }}>
                    <span>Ahorrado: <strong>{fmt(g.current)}</strong></span>
                    <span>Meta: <strong style={{ color: COLORS.text }}>{fmt(g.target)}</strong></span>
                  </div>
                  <ProgressBar value={g.current} max={g.target} color={COLORS.accent} height={10} />
                  <div style={{ fontSize: 13, color: COLORS.textMuted, marginTop: 8 }}>
                    {pct.toFixed(1)}% · Falta {fmt(remaining)}
                  </div>
                </div>
                {g.history && g.history.length > 0 && (
                  <div style={{ fontSize: 11, color: COLORS.textDim, marginTop: 8 }}>
                    Últimos depósitos: {g.history.slice(-3).reverse().map(h => `${h.date} (${fmt(h.amount)})`).join(" · ")}
                  </div>
                )}
                <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
                  <input
                    type="number"
                    value={addAmt[g.id] || ""}
                    onChange={e => setAddAmt({ ...addAmt, [g.id]: e.target.value })}
                    placeholder={g.currency === "usd" ? "Agregar US$..." : "Agregar monto..."}
                    style={{ flex: 1, background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13 }}
                  />
                  <Button onClick={() => addToSaving(g.id)} size="sm">+ Agregar</Button>
                </div>
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ---- DEUDAS ----
function Deudas({ data, save, dolarRate }) {
  const [form, setForm] = useState({ name: "", total: "", remaining: "", installment: "", remainingInstallments: "", dueDay: "", interest: "", currency: "ars" });
  const [showForm, setShowForm] = useState(false);
  const [payAmt, setPayAmt] = useState({});

  const add = () => {
    if (!form.name || !form.remaining) return;
    const installment = parseFloat(form.installment) || 0;
    const remainingInstallments = parseInt(form.remainingInstallments) || (installment > 0 ? Math.ceil(parseFloat(form.remaining) / installment) : 0);
    const isUsd = form.currency === "usd";
    const d = {
      id: Date.now(),
      name: form.name,
      currency: form.currency,
      total: isUsd ? Math.round(parseFloat(form.total || form.remaining) * (dolarRate || 0)) : (parseFloat(form.total) || parseFloat(form.remaining)),
      remaining: isUsd ? Math.round(parseFloat(form.remaining) * (dolarRate || 0)) : parseFloat(form.remaining),
      ...(isUsd ? { amountUSD: parseFloat(form.total || form.remaining), remainingUSD: parseFloat(form.remaining), arsRate: dolarRate } : {}),
      installment,
      remainingInstallments,
      dueDay: parseInt(form.dueDay) || 1,
      interest: parseFloat(form.interest) || 0,
      startMonth: new Date().getMonth(),
      startYear: new Date().getFullYear(),
    };
    save({ ...data, debts: [...data.debts, d] });
    setForm({ name: "", total: "", remaining: "", installment: "", remainingInstallments: "", dueDay: "", interest: "", currency: "ars" });
    setShowForm(false);
  };

  const pay = (id) => {
    const amt = parseFloat(payAmt[id] || 0);
    if (!amt) return;
    const debt = data.debts.find(d => d.id === id);
    if (debt.currency === "usd" && !dolarRate && !debt.arsRate) { alert("Sin cotización del dólar disponible, intentá más tarde."); return; }
    const rate = dolarRate || debt.arsRate || 0;
    const amountARS = debt.currency === "usd" ? Math.round(amt * rate) : amt;
    const debts = data.debts.map(d => {
      if (d.id !== id) return d;
      const upd = { ...d, remainingInstallments: Math.max(0, (d.remainingInstallments || 0) - 1) };
      if (d.currency === "usd") { upd.remainingUSD = Math.max(0, (d.remainingUSD || 0) - amt); upd.remaining = Math.round(upd.remainingUSD * rate); }
      else { upd.remaining = Math.max(0, d.remaining - amt); }
      return upd;
    });
    const cat = findCatCI(data, "Préstamo tarjeta") || findCatCI(data, "Otros") || Object.keys(data.categories)[0];
    const transactions = [...data.transactions, {
      id: Date.now(), type: "gasto", description: `Pago ${debt.name}`, amount: amountARS,
      category: cat, date: todayStr(),
      ...(debt.currency === "usd" ? { currency: "usd", amountUSD: amt } : {}),
    }];
    save({ ...data, debts, transactions });
    setPayAmt({ ...payAmt, [id]: "" });
  };

  const del = (id) => { if (window.confirm("¿Eliminar esta deuda?")) save({ ...data, debts: data.debts.filter(d => d.id !== id) }); };

  const totalDebt = data.debts.reduce((s, d) => s + (d.currency === "usd" ? Math.round((d.remainingUSD || 0) * (dolarRate || d.arsRate || 0)) : d.remaining), 0);
  const monthlyPayments = data.debts.reduce((s, d) => s + (d.installment || 0), 0);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
        <div style={{ display: "flex", gap: 12 }}>
          <Card style={{ padding: "12px 20px" }}>
            <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", marginBottom: 4 }}>Deuda total</div>
            <div style={{ fontSize: 22, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif" }}>{formatFull(totalDebt)}</div>
          </Card>
          {monthlyPayments > 0 && (
            <Card style={{ padding: "12px 20px" }}>
              <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", marginBottom: 4 }}>Cuotas mensuales</div>
              <div style={{ fontSize: 22, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif" }}>{formatFull(monthlyPayments)}</div>
            </Card>
          )}
        </div>
        <Button onClick={() => setShowForm(!showForm)}>{showForm ? "✕ Cancelar" : "+ Nueva deuda"}</Button>
      </div>

      {showForm && (
        <Card>
          <div style={{ fontWeight: 700, marginBottom: 16 }}>Nueva deuda</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 12, marginBottom: 12 }}>
            <Input label="Nombre / Acreedor" value={form.name} onChange={v => setForm({ ...form, name: v })} placeholder="ej. Tarjeta Visa" />
            <Input label="Moneda" value={form.currency} onChange={v => setForm({ ...form, currency: v })} options={["ars", "usd"]} />
            <Input label="Deuda total original" value={form.total} onChange={v => setForm({ ...form, total: v })} type="number" prefix={form.currency === "usd" ? "US$" : "$"} placeholder="0" />
            <Input label="Saldo restante" value={form.remaining} onChange={v => setForm({ ...form, remaining: v })} type="number" prefix={form.currency === "usd" ? "US$" : "$"} placeholder="0" />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 12, marginBottom: 16 }}>
            <Input label="Cuota mensual" value={form.installment} onChange={v => setForm({ ...form, installment: v })} type="number" prefix="$" placeholder="0" />
            <Input label="Cuotas restantes" value={form.remainingInstallments} onChange={v => setForm({ ...form, remainingInstallments: v })} type="number" placeholder="ej. 9" />
            <Input label="Día de vencimiento" value={form.dueDay} onChange={v => setForm({ ...form, dueDay: v })} type="number" placeholder="1-31" />
            <Input label="Interés mensual (%)" value={form.interest} onChange={v => setForm({ ...form, interest: v })} type="number" placeholder="0" />
          </div>
          <Button onClick={add}>Agregar deuda</Button>
        </Card>
      )}

      {data.debts.length === 0 ? (
        <Card style={{ textAlign: "center", padding: 48 }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>🎉</div>
          <div style={{ color: COLORS.textMuted }}>¡Sin deudas registradas! Si tenés, podés agregarlas arriba.</div>
        </Card>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {data.debts.map(d => {
            const pct = d.total > 0 ? Math.min(100, ((d.total - d.remaining) / d.total) * 100) : 0;
            return (
              <Card key={d.id}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 15 }}>💳 {d.name} {d.currency === "usd" && <Pill color={COLORS.green}>USD</Pill>}</div>
                    <div style={{ fontSize: 12, color: COLORS.textMuted, marginTop: 2 }}>
                      {d.dueDay ? `Vence día ${d.dueDay}` : ""}
                      {d.interest > 0 ? ` · ${d.interest}% mensual` : ""}
                    </div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 22, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif" }}>
                      {d.currency === "usd" ? formatUSD(d.remainingUSD) : formatFull(d.remaining)}
                    </div>
                    <div style={{ fontSize: 12, color: COLORS.textMuted }}>de {d.currency === "usd" ? formatUSD(d.amountUSD) : formatFull(d.total)}</div>
                  </div>
                </div>
                <ProgressBar value={d.total - d.remaining} max={d.total || 1} color={COLORS.accent} height={8} />
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: COLORS.textMuted, marginTop: 6, marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
                  <span style={{ color: COLORS.textMuted }}>{pct.toFixed(0)}% pagado</span>
                  <div style={{ display: "flex", gap: 12 }}>
                    {d.installment > 0 && <span>Cuota: <strong style={{ color: COLORS.text }}>{formatFull(d.installment)}</strong>/mes</span>}
                    {d.remainingInstallments > 0 && <span>Cuotas restantes: <strong style={{ color: COLORS.text }}>{d.remainingInstallments}</strong></span>}
                  </div>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <input
                    type="number"
                    value={payAmt[d.id] || ""}
                    onChange={e => setPayAmt({ ...payAmt, [d.id]: e.target.value })}
                    placeholder={d.currency === "usd" ? "Monto a pagar (US$)..." : "Monto a pagar..."}
                    style={{ flex: 1, background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 13 }}
                  />
                  <Button onClick={() => pay(d.id)} size="sm">💸 Pagar</Button>
                  <Button onClick={() => del(d.id)} variant="danger" size="sm">Eliminar</Button>
                </div>
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ---- PRÉSTAMOS (dinero prestado a terceros) ----
// Igual que en la app: crear préstamos y registrar cobros es una función del
// bot de WhatsApp (necesita conversación para tomar todos los datos). Acá se
// puede ver el estado y eliminar registros.
function Prestamos({ data, save, dolarRate }) {
  const loans = data.loans || [];
  const credits = data.credits || {};

  const totalPrestado = loans.reduce((s, l) => s + (l.currency === "usd" ? (l.amountUSD || 0) * (dolarRate || l.arsRate || 0) : (l.amount || 0)), 0);
  const totalPendiente = loans.reduce((s, l) => s + (l.currency === "usd" ? (l.remainingUSD || 0) * (dolarRate || l.arsRate || 0) : (l.remaining || 0)), 0);

  const del = (id) => { if (window.confirm("¿Eliminar este préstamo?")) save({ ...data, loans: loans.filter(l => l.id !== id) }); };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <InfoBanner>💬 Para registrar nuevos préstamos o cobros, usá el bot de WhatsApp.</InfoBanner>

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
        <Card style={{ padding: "12px 20px" }}>
          <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", marginBottom: 4 }}>Total prestado</div>
          <div style={{ fontSize: 22, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif" }}>{formatFull(totalPrestado)}</div>
        </Card>
        <Card style={{ padding: "12px 20px" }}>
          <div style={{ fontSize: 11, color: COLORS.textMuted, fontWeight: 600, textTransform: "uppercase", marginBottom: 4 }}>Total pendiente</div>
          <div style={{ fontSize: 22, fontWeight: 300, color: COLORS.text, fontFamily: "'Nunito', sans-serif" }}>{formatFull(totalPendiente)}</div>
        </Card>
      </div>

      {loans.length === 0 ? (
        <Card style={{ textAlign: "center", padding: 48 }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>🤝</div>
          <div style={{ color: COLORS.textMuted }}>No tenés préstamos registrados.</div>
        </Card>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {loans.map(l => {
            const amount = l.currency === "usd" ? l.amountUSD : l.amount;
            const remaining = l.currency === "usd" ? l.remainingUSD : l.remaining;
            const fmt = l.currency === "usd" ? formatUSD : formatFull;
            const pct = amount > 0 ? Math.min(100, ((amount - remaining) / amount) * 100) : 0;
            return (
              <Card key={l.id}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 15 }}>

const TIPOS_TURNO = ["médico", "peluquería", "banco", "trámite", "reunión", "otro"];
const TIPO_ICONS = { "médico": "🩺", "peluquería": "💇", "banco": "🏦", "trámite": "📋", "reunión": "🧑‍💼", "otro": "📌" };

function Turnos({ data, save }) {
  const [form, setForm] = useState({ description: "", date: todayStr(), time: "", location: "", turnoType: "otro", addToCal: false });
  const [showForm, setShowForm] = useState(false);

  const turnos = data.turnos || [];
  const today = todayStr();
  const proximos = turnos.filter(t => t.date >= today).sort((a, b) => a.date.localeCompare(b.date));
  const historial = turnos.filter(t => t.date < today).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);

  const add = () => {
    if (!form.description || !form.date) return;
    const t = { id: Date.now(), description: form.description, date: form.date, time: form.time, location: form.location, turnoType: form.turnoType, notified: false };
    let events = data.events;
    if (form.addToCal) {
      const day = parseInt(form.date.split("-")[2], 10);
      events = [...events, { id: Date.now() + 1, title: form.description, day, type: "recordatorio", notifyDaysBefore: 1 }];
    }
    save({ ...data, turnos: [...turnos, t], events });
    setForm({ description: "", date: todayStr(), time: "", location: "", turnoType: "otro", addToCal: false });
    setShowForm(false);
  };

  const del = (id) => save({ ...data, turnos: turnos.filter(t => t.id !== id) });

      <div style={{ flex: 1 }}>
        <div style={{ fontWeight: 500, fontSize: 14 }}>{t.description}</div>
        <div style={{ fontSize: 12, color: COLORS.textMuted }}>{t.date}{t.time ? ` · ${t.time}` : ""}{t.location ? ` · ${t.location}` : ""}</div>

      <button onClick={() => del(t.id)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.textDim, fontSize: 16, padding: 4 }}>✕</button>
    </div>
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <Button onClick={() => setShowForm(!showForm)}>{showForm ? "✕ Cancelar" : "+ Nuevo turno"}</Button>
      </div>

        <Card>
          <div style={{ fontWeight: 700, marginBottom: 16 }}>Nuevo turno</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
            <Input label="Descripción" value={form.description} onChange={v => setForm({ ...form, description: v })} placeholder="ej. Dentista" />
            <Input label="Tipo" value={form.turnoType} onChange={v => setForm({ ...form, turnoType: v })} options={TIPOS_TURNO} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, marginBottom: 12 }}>
            <Input label="Fecha" value={form.date} onChange={v => setForm({ ...form, date: v })} type="date" />
            <Input label="Hora" value={form.time} onChange={v => setForm({ ...form, time: v })} type="time" />
            <Input label="Lugar" value={form.location} onChange={v => setForm({ ...form, location: v })} placeholder="opcional" />
          </div>
          <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: COLORS.textMuted, marginBottom: 16 }}>
