<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="m_IEfj_SdjkkTdwQ_ckN2I6TqXHrlcoJot11pUEcHPw" />
  <title>Orbe</title>
  <link rel="icon" type="image/png" href="assets/orbe-icon-64.png" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- Versiones pinneadas (antes @18 / sin pin): un deploy nuevo del CDN no puede
       cambiar el runtime bajo los pies ni romper el sitio sin aviso. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Menta pálido más saturado que el gris-verdoso original (#F2F7F5), calcado
       del "piso" de contenido bajo el header verde en la app real (Expo). */
    html, body { background: #E9F6F0; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #E9F6F0; }
    ::-webkit-scrollbar-thumb { background: #C8DDD6; border-radius: 3px; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    /* El outline nativo de foco del navegador no sigue el border-radius de los
       botones (se ve como una raya rectangular sobre esquinas redondeadas).
       Se quita para click con mouse y se restaura solo para navegación con
       teclado (:focus-visible), así no se pierde accesibilidad. */
    button { outline: none; -webkit-appearance: none; appearance: none; }
    button:focus-visible { outline: 2px solid #005247; outline-offset: 2px; }
    /* Foco de teclado visible en TODOS los campos: varios inputs traen
       outline:none inline, así que el :focus-visible va con !important para
       pisarlo solo cuando el foco viene del teclado. */
    input:focus-visible, select:focus-visible, textarea:focus-visible,
    [tabindex]:not([tabindex="-1"]):focus-visible {
      outline: 2px solid #005247 !important; outline-offset: 1px; border-radius: 6px;
    }
    [role="dialog"]:focus-visible { outline: none !important; }

    /* ── Sistema de movimiento: una sola curva/escala de duración para toda la
       app, en vez de valores sueltos (.15s / .2s / .4s) repartidos por el código.
       "fast" = feedback inmediato (hover, tap), "base" = cambio de estado de
       rutina (mostrar/ocultar, listas), "layout" = overlay/panel entrando. La
       curva de salida usa un ease-in simétrico para que cerrar se sienta tan
       intencional como abrir, solo que más rápido. */
    :root {
      --ease-standard: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in: cubic-bezier(0.4, 0, 1, 1);
      --dur-fast: 140ms;
      --dur-base: 200ms;
      --dur-layout: 300ms;
    }

    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes rowExit { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.97); } }
    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes overlayOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes modalOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(8px) scale(.97); } }

    /* Filas/cards de listas (transacciones, categorías, ahorros, deudas): entran
       con fade+slide sutil apenas se montan (alta nueva o primer render de
       página), salen con fade+scale antes de desmontarse (ver componente
       Removable en el script). */
    .row-enter { animation: fadeSlideIn var(--dur-base) var(--ease-standard); }
    .row-exit { animation: rowExit var(--dur-fast) var(--ease-in) forwards; pointer-events: none; }

    /* Formularios de alta/edición que se expanden inline dentro de una lista
       (nueva categoría, nueva meta, nueva deuda, editar transacción, etc.). */
    .form-pop { animation: fadeSlideIn var(--dur-base) var(--ease-standard); transform-origin: top; }

    /* Cambio de tab (Inicio ⇄ Análisis ⇄ Perfil): el contenido nuevo entra con
       fade+slide; no hay salida animada porque el tab anterior se desmonta al
       instante (React solo renderiza uno a la vez), pero la entrada alcanza
       para que no se sienta como un corte brusco. */
    .tab-fade { animation: fadeSlideIn var(--dur-layout) var(--ease-standard); }

    /* Overlay a pantalla completa (PanelModal) y modal de Conectar WhatsApp:
       el fondo se desvanece y la card/panel entra con una leve translación +
       escala. Al cerrar, un estado "closing" en React aplica las variantes
       *Out durante --dur-fast antes de desmontar (ver hook useClosable). */
    .overlay-anim { animation: overlayIn var(--dur-layout) var(--ease-standard); }
    .overlay-anim.is-closing { animation: overlayOut var(--dur-fast) var(--ease-in) forwards; }
    .modal-anim { animation: modalIn var(--dur-layout) var(--ease-standard); }
    .modal-anim.is-closing { animation: modalOut var(--dur-fast) var(--ease-in) forwards; }

    /* ── Bottom sheet: identidad pinneada de los formularios "Nueva X" de la app
       real (Deudas, Transacciones, Ahorros, Turnos, Eventos, Categorías) — sube
       desde abajo con barrita de agarre y esquinas superiores muy redondeadas en
       mobile. Reemplaza el patrón anterior de sección inline expandida dentro
       del panel. Desde 1024px no tiene sentido un bottom sheet pegado al piso
       de un monitor: pasa a ser un modal centrado con las 4 esquinas redondeadas
       (mismo criterio que ya se usó en panel-card/LoginScreen). */
    @keyframes sheetSlideIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes sheetSlideOut { from { transform: translateY(0); } to { transform: translateY(100%); } }
    .sheet-overlay { position: fixed; inset: 0; background: #0D1F1C73; z-index: 220; display: flex; align-items: flex-end; justify-content: center; }
    .sheet-card { background: #FFFFFF; width: 100%; max-width: 560px; border-radius: 28px 28px 0 0; max-height: 88vh; overflow-y: auto; box-shadow: 0 -8px 40px #00000030; animation: sheetSlideIn var(--dur-layout) var(--ease-standard); }
    .sheet-card.sheet-closing { animation: sheetSlideOut var(--dur-fast) var(--ease-in) forwards; }
    .sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: #D8E8E1; margin: 10px auto 2px; flex-shrink: 0; }
    .sheet-header { font-size: 21px; font-weight: 800; padding: 14px 24px 4px; color: #0D1F1C; letter-spacing: -.3px; }
    .sheet-body { padding: 16px 24px 24px; }
    @media (min-width: 1024px) {
      .sheet-overlay { align-items: center; padding: 40px; }
      .sheet-card { border-radius: 24px; max-height: 85vh; animation: modalIn var(--dur-layout) var(--ease-standard); }
      .sheet-card.sheet-closing { animation: modalOut var(--dur-fast) var(--ease-in) forwards; }
      .sheet-handle { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ── Layout responsive: app shell mobile-first, sidebar persistente desde 1024px ── */
    .app-shell { display: flex; flex-direction: column; }
    .app-main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .desktop-sidebar { display: none; }
    .content-area { flex: 1; width: 100%; overflow-y: auto; max-width: 720px; margin: 0 auto; padding: 20px 16px 110px; box-sizing: border-box; }
    .inicio-layout { display: flex; flex-direction: column; gap: 16px; }
    .inicio-primary { display: flex; flex-direction: column; gap: 16px; }
    .inicio-rail { display: flex; flex-direction: column; gap: 16px; }
    /* 3 columnas fijas en mobile (como antes); desde 1024px pasa a auto-fill
       para aprovechar el ancho completo sin quedar en una columna angosta. */
    .inicio-shortcuts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .inicio-upcoming { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .panel-card { width: 100%; }

    /* Grid de formularios de alta con varios campos ("Nueva meta de ahorro",
       "Nueva deuda"): 1 columna en mobile angosto (~360-412px Android), 2
       desde 640px, y las 4 originales recién desde 1024px. Antes eran grids
       fijos de 4 columnas sin adaptar, así que en mobile los campos quedaban
       apretados e ilegibles. Nombre genérico porque lo comparten Ahorros y
       Deudas (antes era ".ahorros-form-grid", solo para Ahorros). */
    .form-grid-4 { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 12px; }
    @media (min-width: 640px) {
      .form-grid-4 { grid-template-columns: 1fr 1fr; }
    }

    /* Filas de input + botones en una sola línea (edición inline de categoría
       en Presupuesto y de meta en Ahorros; fila de pagar/eliminar deuda en
       Deudas): flex-wrap para que los botones no queden cortados en
       pantallas angostas. Si hay un input compartiendo la fila, usa una base
       chica en vez de flex:1 para no empujar los botones fuera del viewport. */
    .inline-edit-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .inline-edit-actions input { flex: 1 1 140px; min-width: 0; }

    @media (min-width: 1024px) {
      .app-shell { flex-direction: row; }
      /* Verde sólido + dorado calcado del panel izquierdo del LoginScreen (ver
         AUTH/.auth-header): antes era un sidebar blanco liso con un borde
         derecho de 1px que quedaba como una costura sin sentido contra el
         topbar y el fondo menta vacío arriba del contenido. Ahora sidebar y
         topbar comparten el mismo verde de punta a punta -- no hay costura
         que tapar porque no hay corte de color. */
      .desktop-sidebar {
        display: flex; flex-direction: column; width: 264px; flex-shrink: 0;
        background: linear-gradient(180deg, #005247 0%, #002f28 100%); border-right: none; padding: 24px 16px;
        position: sticky; top: 0; height: 100vh; overflow-y: auto; box-sizing: border-box;
      }
      /* !important: pisa el display:flex inline que estos elementos usan en mobile */
      .bottom-nav { display: none !important; }
      .mobile-fab { display: none !important; }
      .topbar-brand { display: none !important; }
      .topbar { justify-content: flex-end; }
      .content-area { max-width: 1160px; padding: 32px 40px 40px; }
      .narrow-col { max-width: 720px; margin: 0 auto; }
      /* Inicio se queda apilado en una sola columna a todos los anchos: la card de
         Balance quedaba más angosta que Transacciones de abajo cuando el rail de
         accesos rápidos vivía al costado en un grid de 2 columnas — todo comparte
         el mismo borde izq./der. así. Con más ancho disponible, los accesos
         rápidos y las cards de turnos/vencimientos aprovechan el espacio extra. */
      .inicio-shortcuts { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .inicio-upcoming { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
      .panel-overlay { display: flex; align-items: center; justify-content: center; padding: 40px; background: #0D1F1CCC !important; }
      .panel-card { max-width: 640px; max-height: 85vh; border-radius: 20px; overflow-y: auto; background: #F2F7F5; box-shadow: 0 24px 64px #00000030; }
      .panel-card-header { border-radius: 20px 20px 0 0; }
      .form-grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
    }

    /* ── Pantalla de login/registro/reset: identidad visual pinneada calcada de
       la app real (LoginScreen.jsx), distinta del resto de la web (paleta y
       radios propios, ver const AUTH en el script). Mobile: la card ocupa toda
       la pantalla, igual que en la app (header verde fijo + card crema que
       "sube" con las esquinas superiores muy redondeadas). Desde 640px no tiene
       sentido estirar eso a lo ancho/alto de un monitor, así que la identidad
       (verde arriba, crema abajo, mismos botones) se contiene en una card
       centrada de ancho máximo razonable con esquinas redondeadas en las 4
       puntas y sombra, sobre el fondo neutro habitual de la web. ── */
    /* La app real (LoginScreen.jsx) nunca declara fontFamily en ningún lado, así
       que React Native renderiza con la fuente del sistema (Roboto en Android,
       San Francisco en iOS) — no hay una "fuente de Orbe" propia. Para calcar
       eso de verdad (y no solo el color/forma), esta pantalla usa la fuente del
       sistema del visitante en vez de heredar la Nunito/DM Sans que sí es la
       identidad tipográfica del resto de la web (que solo se aplica una vez
       logueado, vía .app-shell — esta pantalla vive afuera de eso). */
    .auth-page { min-height: 100vh; width: 100%; background: #005247; display: flex; flex-direction: column; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .auth-visual { flex: 1; display: flex; flex-direction: column; width: 100%; }
    .auth-header { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 56px 24px 18px; flex-shrink: 0; background: #005247; }
    .auth-blob { position: absolute; border-radius: 50%; pointer-events: none; }
    .auth-blob-1 { top: -60px; right: -60px; width: 220px; height: 220px; background: #FFFFFF06; }
    .auth-blob-2 { bottom: -40px; left: -80px; width: 200px; height: 200px; background: #C9A84C08; }
    .auth-logo { position: relative; width: 200px; height: 200px; object-fit: contain; display: block; margin: 0 auto; }
    .auth-tagline { position: relative; margin-top: -38px; text-align: center; color: #FFFFFFB0; font-size: 13px; font-weight: 500; letter-spacing: 0.3px; pointer-events: none; }
    .auth-cardbody { background: #FAFAF8; border-top-left-radius: 36px; border-top-right-radius: 36px; padding: 28px 28px 48px; flex: 1; }
    .auth-greeting { font-size: 22px; font-weight: 800; color: #1A1A1A; letter-spacing: -0.5px; margin-bottom: 22px; text-align: center; }
    .auth-field { display: flex; align-items: center; background: #FFFFFF; border: 1px solid #E8E4DC; border-radius: 16px; margin-bottom: 12px; padding-left: 16px; }
    .auth-input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; padding: 15px 16px 15px 0; font-size: 15px; color: #1A1A1A; font-family: inherit; }
    .auth-input::placeholder { color: #5F5E58; opacity: 1; }
    .auth-eye { background: none; border: none; cursor: pointer; padding: 0 14px 0 4px; line-height: 1; flex-shrink: 0; display: flex; align-items: center; }
    .auth-pwrules { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: -4px; margin-bottom: 12px; padding: 0 4px; }
    .auth-pwrule { font-size: 11px; font-weight: 600; }
    .auth-error { background: #FFF3F3; border: 1px solid #F5C5C5; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; color: #E53935; }
    .auth-success { background: #F0FBF7; border: 1px solid #A8DFC9; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; color: #005247; }
    .auth-hint { font-size: 13px; color: #5F5E58; background: #F2EFE8; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
    .auth-btn-main { width: 100%; background: #005247; border: 1px solid #C9A84C; border-radius: 18px; padding: 17px; color: #E8C97A; font-family: inherit; font-size: 16px; font-weight: 800; letter-spacing: 0.3px; cursor: pointer; box-shadow: 0 6px 18px #00291F26; transition: opacity var(--dur-base) var(--ease-standard); }
    .auth-btn-main:disabled { opacity: 0.7; cursor: not-allowed; }
    .auth-btn-secondary { width: 100%; background: transparent; border: 1.5px solid #005247; border-radius: 18px; padding: 17px; color: #005247; font-family: inherit; font-size: 16px; font-weight: 800; letter-spacing: 0.3px; cursor: pointer; margin-top: 12px; }
    .auth-divider { display: flex; align-items: center; gap: 10px; margin: 16px 0 12px; }
    .auth-divider span { flex: 1; height: 1px; background: #E8E4DC; }
    .auth-divider em { font-style: normal; font-size: 11px; font-weight: 700; color: #6E665A; text-transform: uppercase; letter-spacing: 0.5px; }
    .auth-btn-google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: #FFFFFF; border: 1px solid #E8E4DC; border-radius: 16px; padding: 14px; color: #1A1A1A; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    .auth-links { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .auth-link { background: none; border: none; cursor: pointer; font-family: inherit; font-size: 13px; color: #5F5E58; padding: 4px; }
    .auth-link strong { color: #005247; font-weight: 700; }

    @media (min-width: 640px) {
      .auth-page { background: #F2F7F5; align-items: center; justify-content: center; padding: 40px 20px; }
      .auth-visual { flex: none; width: 100%; max-width: 440px; border-radius: 32px; overflow: hidden; box-shadow: 0 24px 64px #00000030; }
      .auth-header { padding: 44px 24px 24px; }
    }

    /* Pantallas grandes: en vez de una card angosta flotando en un mar de fondo
       vacío, el diseño pasa a ocupar toda la página, partida en dos mitades de
       alto completo — verde con el logo a la izquierda, formulario a la
       derecha. Se probó también apilado (verde arriba/crema abajo, como en
       mobile pero a pantalla completa) y Dario prefirió esta versión.
       .auth-logo usa el ancho de su propia proporción (el archivo ya viene
       recortado a su contenido real, sin margen transparente de sobra — ver
       assets/orbe-logo-wordmark.png) en vez de una caja cuadrada. */
    @media (min-width: 1024px) {
      .auth-page { padding: 0; }
      .auth-visual { flex-direction: row; width: 100%; max-width: none; height: 100vh; border-radius: 0; box-shadow: none; }
      .auth-header { flex: 1; height: 100%; padding: 40px; }
      .auth-logo { width: min(50%, 380px); height: auto; }
      .auth-tagline { margin-top: 14px; font-size: 16px; }
      .auth-cardbody { flex: 1; height: 100%; overflow-y: auto; border-radius: 48px 0 0 48px; display: flex; flex-direction: column; justify-content: center; }
      .auth-cardbody > * { width: 100%; max-width: 400px; margin-left: auto; margin-right: auto; }
    }

    /* ── Onboarding financiero post-login. Usa el MISMO shell que LoginScreen
       (.auth-page/.auth-visual/.auth-header/.auth-cardbody): en mobile es header
       verde con el logo + card crema abajo; en desktop se parte izquierda
       (verde + wordmark) / derecha (los pasos). El contenido de los pasos vive
       sobre la card crema → tonos oscuros. 3 pasos explicativos, no pide datos.
       Se muestra una sola vez por cuenta (data.onboardingDone en Supabase). ── */
    .fob-cardbody { display: flex; flex-direction: column; }
    .fob-topbar { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 6px; flex-shrink: 0; }
    .fob-progress { display: flex; align-items: flex-start; justify-content: center; flex: 1; gap: 60px; }
    .fob-pitem { display: flex; flex-direction: column; align-items: center; position: relative; }
    .fob-plabel, .fob-pline { white-space: nowrap; }
    .fob-pdot { width: 30px; height: 30px; border-radius: 15px; background: #F2EFE8; border: 1.5px solid #E8E4DC; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #6E665A; margin-bottom: 6px; }
    .fob-pdot.active { border-color: #C9A84C; background: #C9A84C22; color: #005247; }
    .fob-pdot.current { background: #C9A84C; border-color: #E8C97A; color: #005247; }
    .fob-plabel { font-size: 10px; color: #6E665A; font-weight: 700; letter-spacing: 0.3px; }
    .fob-plabel.active { color: #005247; }
    .fob-pline { position: absolute; top: 15px; left: 30px; width: 60px; height: 1.5px; background: #E8E4DC; }
    .fob-pline.active { background: #C9A84C; }
    .fob-skip { background: none; border: none; color: #5F5E58; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px; flex-shrink: 0; }
    .fob-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 18px 0 10px; }
    .fob-icon { width: 84px; height: 84px; border-radius: 42px; background: #F2F9F6; border: 1px solid #E8E4DC; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 18px; flex-shrink: 0; }
    .fob-icon.wa { background: #25D3660F; border-color: #25D36633; }
    .fob-title { font-size: 25px; font-weight: 800; color: #1A1A1A; letter-spacing: -0.6px; line-height: 1.2; margin-bottom: 10px; }
    .fob-sub { font-size: 14px; color: #5F5E58; line-height: 1.55; margin-bottom: 20px; max-width: 380px; }
    .fob-cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; margin-bottom: 4px; }
    .fob-cat { aspect-ratio: 1; background: #FFFFFF; border: 1px solid #E8E4DC; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .fob-cat .e { font-size: 20px; }
    .fob-cat .n { font-size: 9px; color: #5F5E58; font-weight: 700; padding: 0 2px; }
    .fob-info { display: flex; align-items: flex-start; gap: 10px; background: #F2EFE8; border: 1px solid #E8E4DC; border-radius: 14px; padding: 14px; width: 100%; text-align: left; font-size: 13px; color: #5A5A5A; line-height: 1.5; margin-top: 10px; }
    .fob-info > span:first-child { font-size: 16px; line-height: 1.3; flex-shrink: 0; }
    .fob-info b { color: #005247; font-weight: 800; }
    .fob-wasteps { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-bottom: 4px; }
    .fob-wastep { display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E8E4DC; border-radius: 14px; padding: 12px 14px; text-align: left; }
    .fob-wanum { width: 24px; height: 24px; border-radius: 12px; background: #005247; color: #E8C97A; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

const formatCurrency = (n) => {

  return `$${n.toFixed(0)}`;
};

const formatFull = (n) => { const abs = Math.abs(Number(n) || 0); const formatted = abs.toLocaleString("es-AR", { minimumFractionDigits: 0, maximumFractionDigits: 0 }); return ((Number(n) || 0) < 0 ? "-$" : "$") + formatted; };
// maximumFractionDigits: 2 (en vez de 0) para que las metas de ahorro en USD,

// Formatea un monto mientras se escribe (separador de miles "."), igual que la
// app real: solo dígitos, agrupados de a 3 desde la derecha. parseAmountInput
// lo revierte para poder hacer cuentas con el valor. Solo para ARS (montos
// enteros): ver formatAmountInputUSD para montos con decimales.
const formatAmountInput = (raw) => {
  const digits = String(raw || "").replace(/\D/g, "");
  if (!digits) return "";
  return digits.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
};
const parseAmountInput = (v) => parseFloat(String(v || "0").replace(/\./g, "")) || 0;

// Variante para montos en USD (metas de ahorro en dólares), que sí usan
// centavos: acá "." es punto decimal, no separador de miles, así que no se
// agrupa. Permite un solo "." y hasta 2 decimales.
const formatAmountInputUSD = (raw) => {
  let s = String(raw || "").replace(/[^\d.]/g, "");
  const firstDot = s.indexOf(".");
  if (firstDot !== -1) {
    s = s.slice(0, firstDot + 1) + s.slice(firstDot + 1).replace(/\./g, "");
    const [intPart, decPart] = s.split(".");
    s = intPart + "." + decPart.slice(0, 2);
  }
  return s;
};

// ---- MOTION HELPERS ----
// Overlays y modales (PanelModal, "Conectar WhatsApp") se cierran de golpe si
// simplemente se desmontan cuando el padre pone su estado en null/false: no
// hay tiempo para que la animación de salida (.overlay-anim.is-closing /
// .modal-anim.is-closing, ver <style>) se vea. useClosable retiene el
// desmontaje real `duration` ms mientras aplica esas clases, así "cerrar" se
// ve tan intencional como "abrir".
function useClosable(onFullyClosed, duration = 140) {
  const [closing, setClosing] = useState(false);
  const requestClose = () => {
    if (closing) return;
    setClosing(true);
    setTimeout(() => { setClosing(false); onFullyClosed(); }, duration);
  };
  return { closing, requestClose };
}

// Atrapa cualquier error de render de sus hijos y muestra una salida en vez de
// una pantalla en blanco. Se usa a nivel app (red de seguridad) y por panel
// (para que un dato roto en una sección no tire abajo toda la web).
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error("Orbe — error de render:", err, info); }
  render() {
    if (!this.state.err) return this.props.children;
    if (this.props.fallback) return this.props.fallback(() => this.setState({ err: null }));
    return (
      <div style={{ minHeight: "60vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 40, textAlign: "center", fontFamily: "'Nunito', sans-serif" }}>
        <div style={{ width: 26, height: 26, borderRadius: "50%", border: "3px solid #C9A84C", borderTopColor: "transparent", transform: "rotate(-45deg)", marginBottom: 16 }} />
        <div style={{ fontWeight: 800, fontSize: 18, color: "#005247" }}>Algo salió mal</div>
        <div style={{ color: "#4A6B62", fontSize: 14, margin: "8px 0 20px", maxWidth: 320 }}>Recargá la página para volver al inicio. Tus datos están a salvo.</div>
        <button onClick={() => window.location.reload()} style={{ background: "#005247", color: "#E8C97A", border: "1px solid #C9A84C", borderRadius: 12, padding: "12px 24px", fontWeight: 800, fontFamily: "inherit", fontSize: 14, cursor: "pointer" }}>Recargar</button>
      </div>
    );
  }
}

// Accesibilidad de modales/sheets: bloquea el scroll de fondo, mueve el foco
// adentro al abrir, lo atrapa con Tab, cierra con Escape y devuelve el foco al
// elemento que lo abrió al cerrar. cardRef apunta al contenedor del diálogo.
function useModalA11y(onEscape, cardRef) {
  useEffect(() => {
    const prevFocus = document.activeElement;
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const SEL = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
    const focusables = () => cardRef.current ? Array.from(cardRef.current.querySelectorAll(SEL)).filter(el => el.offsetParent !== null) : [];
    const t = setTimeout(() => { (focusables()[0] || cardRef.current)?.focus?.(); }, 20);
    const onKey = (e) => {
      if (e.key === "Escape") { e.preventDefault(); onEscape(); return; }
      if (e.key !== "Tab" || !cardRef.current) return;
      const f = focusables();
      if (!f.length) { e.preventDefault(); cardRef.current.focus(); return; }
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || !cardRef.current.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener("keydown", onKey, true);
    return () => {
      clearTimeout(t);
      document.removeEventListener("keydown", onKey, true);
      document.body.style.overflow = prevOverflow;
      if (prevFocus && prevFocus.focus) prevFocus.focus();
    };
  }, []);
}

// Filas/cards de una lista (transacciones, categorías, ahorros, deudas): al
// borrar, primero se les aplica ".row-exit" (fade + scale down) y recién
// después de `duration` se ejecuta la baja real de los datos — así el ítem no
// desaparece de un frame al otro. Render-prop en vez de wrapper de DOM propio
// para no romper el layout (grid/flex) del contenedor de la lista.
function Removable({ onRemove, duration = 140, children }) {
  const [leaving, setLeaving] = useState(false);
  const remove = () => {
    if (leaving) return;
    setLeaving(true);
    setTimeout(onRemove, duration);
  };
  return children({ leaving, remove, rowClass: leaving ? "row-exit" : "row-enter" });
}

// ---- RESET PASSWORD SCREEN ----
// Se llega acá vía el link del email de recuperación (hash #type=recovery),
// no desde los botones de LoginScreen -- pero es el mismo flujo de auth, así
// que comparte la identidad visual (header verde + card crema) en vez de
// quedar con el estilo viejo y desentonar apenas el usuario completa el reset.
function ResetPasswordScreen({ onDone }) {
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [showCf, setShowCf] = useState(false);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState(false);

  const pwRules = passwordRuleList(password);
  const confirmOk = confirm.length > 0 && confirm === password;

  const handleReset = async () => {
    const pwErr = validatePassword(password);
    if (pwErr) { setError(pwErr); return; }
    if (password !== confirm) { setError("Las contraseñas no coinciden"); return; }
    setError(""); setLoading(true);
    try {
      const { error } = await supabaseClient.auth.updateUser({ password });
      if (error) throw error;
      setSuccess(true);
      setTimeout(() => {
        window.history.replaceState({}, document.title, window.location.pathname);
        onDone();
      }, 2000);
    } catch (e) {
      setError(e.message || "Error al actualizar la contraseña");
    }
    setLoading(false);
  };

  return (
    <div className="auth-page">
      <div className="auth-visual">
        <div className="auth-header">
          <div className="auth-blob auth-blob-1" />
          <div className="auth-blob auth-blob-2" />
          <div style={{ position: "relative" }}>
            <img src="assets/orbe-logo-wordmark.png" alt="Orbe" className="auth-logo" />
            <div className="auth-tagline">Tu asistente financiero personal</div>
          </div>
        </div>

        <div className="auth-cardbody">
          <div className="auth-greeting">Nueva contraseña</div>

          {success ? (
            <div style={{ textAlign: "center", padding: "20px 0" }}>
              <div style={{ fontSize: 40, marginBottom: 12 }}>✅</div>
              <div style={{ fontSize: 15, color: AUTH.green, fontWeight: 600 }}>¡Contraseña actualizada!</div>
              <div style={{ fontSize: 13, color: AUTH.textMuted, marginTop: 6 }}>Redirigiendo al login...</div>
            </div>
          ) : (
            <>
              <div>
                <div className="auth-field">
                  <input className="auth-input" type={showPw ? "text" : "password"} value={password}
                    onChange={e => setPassword(e.target.value)} placeholder="Nueva contraseña" />
                  <button type="button" className="auth-eye" aria-label={showPw ? "Ocultar contraseña" : "Mostrar contraseña"} onClick={() => setShowPw(p => !p)}><EyeToggleIcon shown={showPw} /></button>
                </div>
                {password.length > 0 && (
                  <div className="auth-pwrules">
                    {pwRules.map((r, i) => (
                      <span key={i} className="auth-pwrule" style={{ color: r.ok ? AUTH.goldText : AUTH.textMuted }}>{r.ok ? "✓" : "○"} {r.label}</span>
                    ))}
                  </div>
                )}
              </div>

              <div>
                <div className="auth-field">
                  <input className="auth-input" type={showCf ? "text" : "password"} value={confirm}
                    onChange={e => setConfirm(e.target.value)} placeholder="Repetir contraseña"
                    onKeyDown={e => e.key === "Enter" && handleReset()} />
                  <button type="button" className="auth-eye" aria-label={showCf ? "Ocultar contraseña" : "Mostrar contraseña"} onClick={() => setShowCf(c => !c)}><EyeToggleIcon shown={showCf} /></button>
                </div>
                {confirm.length > 0 && (
                  <div style={{ fontSize: 11, color: confirmOk ? AUTH.goldText : AUTH.red, marginTop: -8, marginBottom: 10, marginLeft: 4 }}>
                    {confirmOk ? "✓ Las contraseñas coinciden" : "✗ No coinciden"}
                  </div>
                )}
              </div>

              {error && <div className="auth-error">⚠️ {error}</div>}

              <button className="auth-btn-main" onClick={handleReset} disabled={loading}>
                {loading ? "Actualizando..." : "Guardar contraseña"}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [mode, setMode] = useState("login"); // "login" | "register" | "reset"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const [nombre, setNombre] = useState("");
  const [apellido, setApellido] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [showCf, setShowCf] = useState(false);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState("");

  const isLogin = mode === "login";
  const isRegister = mode === "register";
  const isReset = mode === "reset";

  const pwRules = passwordRuleList(password);
  const confirmOk = confirm.length > 0 && confirm === password;

  const clear = () => { setError(""); setSuccess(""); };

  const handleSubmit = async () => {
    setError(""); setSuccess(""); setLoading(true);
    try {
      if (mode === "register") {
        const pwErr = validatePassword(password);
        if (pwErr) throw new Error(pwErr);
        if (!confirmOk) throw new Error("Las contraseñas no coinciden");
        const full_name = [nombre, apellido].filter(Boolean).join(" ");
        const { error } = await supabaseClient.auth.signUp({
          email, password,
          options: { data: { nombre, apellido, full_name } },
        });
        if (error) throw error;
        setSuccess("¡Cuenta creada! Ahora podés iniciar sesión.");
        setMode("login");
      } else if (mode === "reset") {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + "/",
        });
        if (error) throw error;
        setSuccess("¡Listo! Revisá tu email para restablecer la contraseña.");
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        onLogin(data.user);
      }
    } catch (e) {
      setError(e.message || "Error al procesar la solicitud");
    }
    setLoading(false);
  };

  const handleGoogleLogin = async () => {
    setError(""); setSuccess("");
    // Redirige a Google y vuelve acá con la sesión ya armada; el useEffect de
    // FinanzasApp que escucha onAuthStateChange se encarga de detectarla, no
    // hace falta manejar el callback a mano.
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + "/" },
    });
    if (error) setError(error.message || "No se pudo iniciar sesión con Google");
  };

  return (
    <div className="auth-page">
      <div className="auth-visual">
        {/* Header verde con logo, calcado del de la app real */}
        <div className="auth-header">
          <div className="auth-blob auth-blob-1" />
          <div className="auth-blob auth-blob-2" />
          <div style={{ position: "relative" }}>
            <img src="assets/orbe-logo-wordmark.png" alt="Orbe" className="auth-logo" />
            <div className="auth-tagline">Tu asistente financiero personal</div>
          </div>
        </div>

        {/* Card crema: sin tabs, el modo se controla con los botones/links de abajo */}
        <div className="auth-cardbody">
          {!isLogin && (
            <div className="auth-greeting">{isRegister ? "¡Creá tu cuenta!" : "Recuperar contraseña"}</div>
          )}

          {isRegister && (
            <div style={{ display: "flex", gap: 10 }}>
              <div className="auth-field" style={{ flex: 1, minWidth: 0 }}>
                <input className="auth-input" value={nombre} onChange={e => setNombre(e.target.value)} placeholder="Nombre" autoCapitalize="words" />
              </div>
              <div className="auth-field" style={{ flex: 1, minWidth: 0 }}>
                <input className="auth-input" value={apellido} onChange={e => setApellido(e.target.value)} placeholder="Apellido" autoCapitalize="words" />
              </div>
            </div>
          )}

          <div className="auth-field">
            <input className="auth-input" type="email" value={email} onChange={e => setEmail(e.target.value)}
              placeholder="Email" onKeyDown={e => e.key === "Enter" && handleSubmit()} />
          </div>

          {!isReset && (
            <div>
              <div className="auth-field">
                <input className="auth-input" type={showPw ? "text" : "password"} value={password}
                  onChange={e => setPassword(e.target.value)} placeholder="Contraseña"
                  onKeyDown={e => e.key === "Enter" && handleSubmit()} />
                <button type="button" className="auth-eye" aria-label={showPw ? "Ocultar contraseña" : "Mostrar contraseña"} onClick={() => setShowPw(p => !p)}><EyeToggleIcon shown={showPw} /></button>
              </div>
              {isRegister && password.length > 0 && (
                <div className="auth-pwrules">
                  {pwRules.map((r, i) => (
                    <span key={i} className="auth-pwrule" style={{ color: r.ok ? AUTH.goldText : AUTH.textMuted }}>{r.ok ? "✓" : "○"} {r.label}</span>
                  ))}
                </div>
              )}
            </div>
          )}

          {isRegister && (
            <div>
              <div className="auth-field">
                <input className="auth-input" type={showCf ? "text" : "password"} value={confirm}
                  onChange={e => setConfirm(e.target.value)} placeholder="Repetir contraseña"
                  onKeyDown={e => e.key === "Enter" && handleSubmit()} />
                <button type="button" className="auth-eye" aria-label={showCf ? "Ocultar contraseña" : "Mostrar contraseña"} onClick={() => setShowCf(c => !c)}><EyeToggleIcon shown={showCf} /></button>
              </div>
              {confirm.length > 0 && (
                <div style={{ fontSize: 11, color: confirmOk ? AUTH.goldText : AUTH.red, marginTop: -8, marginBottom: 10, marginLeft: 4 }}>
                  {confirmOk ? "✓ Las contraseñas coinciden" : "✗ No coinciden"}
                </div>
              )}
            </div>
          )}

          {isReset && (
            <div className="auth-hint">Te enviaremos un email para restablecer tu contraseña.</div>
          )}

          {error && <div className="auth-error">⚠️ {error}</div>}
          {success && <div className="auth-success">✅ {success}</div>}

          <button className="auth-btn-main" onClick={handleSubmit} disabled={loading}>
            {loading ? "Procesando..." : isLogin ? "Iniciar sesión" : isRegister ? "Crear cuenta" : "Enviar email"}
          </button>

          {isLogin && (
            <button className="auth-btn-secondary" onClick={() => { setMode("register"); clear(); }}>
              Registrarse
            </button>
          )}

          {!isReset && (
            <>
              <div className="auth-divider"><span /><em>o</em><span /></div>
              <button className="auth-btn-google" onClick={handleGoogleLogin}>
                <GoogleIcon size={18} /> Continuar con Google
              </button>
            </>
          )}

          <div className="auth-links">
            {!isLogin && (
              <button className="auth-link" onClick={() => { setMode("login"); clear(); }}>
                ¿Ya tenés cuenta? <strong>Iniciá sesión</strong>
              </button>
            )}
            {isLogin && (
              <button className="auth-link" onClick={() => { setMode("reset"); clear(); }}>
                ¿Olvidaste tu contraseña?
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

  const { closing, requestClose } = useClosable(onClose);

  return (

      <div ref={cardRef} tabIndex={-1} role="dialog" aria-modal="true" aria-label={typeof title === "string" ? title : "Sección"} className={`panel-card modal-anim ${closing ? "is-closing" : ""}`} onClick={e => e.stopPropagation()}>
        <div className="panel-card-header" style={{ position: "sticky", top: 0, background: `linear-gradient(135deg, ${COLORS.accent} 0%, #002f28 100%)`, padding: "18px 20px", display: "flex", alignItems: "center", gap: 12, zIndex: 1 }}>
          <button onClick={requestClose} aria-label="Volver" style={{ background: "#ffffff22", border: "none", borderRadius: 10, color: "#fff", fontSize: 18, width: 36, height: 36, cursor: "pointer", flexShrink: 0 }}>←</button>
          <div style={{ color: "#fff", fontWeight: 700, fontSize: 17 }}>{title}</div>
        </div>
        <div style={{ padding: 20, maxWidth: 720, margin: "0 auto" }}>{children}</div>
      </div>
    </div>
  );
}
